<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Story List</title>
</head>
<body>
    <h1>Story List</h1>
    <ul>
        {% for title, content in stories %}
            <li>
                <strong>{{ title }}</strong>: {{ content }}
                <a href="{{ url_for('edit_story', title=title) }}">Edit</a>
            </li>
        {% endfor %}
    </ul>
    <p><a href="/story_creation">Create New Story</a></p>
    <p><a href="/">Logout</a></p>
</body>
</html>
