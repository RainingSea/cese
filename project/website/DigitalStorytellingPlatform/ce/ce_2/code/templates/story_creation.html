<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Story</title>
</head>
<body>
    <h1>Create Story</h1>
    <form method="post" action="/story">
        <input type="text" name="title" placeholder="Story Title" required>
        <textarea name="content" placeholder="Story Content" required></textarea>
        <input type="hidden" name="username" value="username"> <!-- Replace with actual username -->
        <button type="submit">Save Story</button>
    </form>
</body>
</html>
