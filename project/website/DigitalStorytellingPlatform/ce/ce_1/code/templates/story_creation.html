<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Story</title>
</head>
<body>
    <h1>Create Story</h1>
    <form action="/create_story" method="post">
        <label for="title">Story Title:</label>
        <input type="text" id="title" name="title" required>
        <br>
        <label for="content">Story Content:</label>
        <textarea id="content" name="content" required></textarea>
        <br>
        <button type="submit">Save Story</button>
    </form>
    <h2>Edit Story</h2>
    <form action="/edit_story" method="post">
        <label for="edit_title">Story Title:</label>
        <input type="text" id="edit_title" name="edit_title" required>
        <br>
        <label for="new_content">New Content:</label>
        <textarea id="new_content" name="new_content" required></textarea>
        <br>
        <button type="submit">Edit Story</button>
    </form>
</body>
</html>
