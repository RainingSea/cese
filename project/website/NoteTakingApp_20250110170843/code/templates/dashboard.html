<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <a href="{{ url_for('add_note') }}">Add Note</a>
    <a href="{{ url_for('search_note') }}">Search Notes</a>
    <h3>Your Notes:</h3>
    <ul>
        {% if notes %}
            {% for note in notes %}
                <li>
                    <a href="{{ url_for('view_note', note_id=note.id) }}">{{ note.title }}</a>
                    <a href="{{ url_for('delete_note', note_id=note.id) }}">Delete</a>
                </li>
            {% endfor %}
        {% else %}
            <li>No notes available. <a href="{{ url_for('add_note') }}">Add a note</a></li>
        {% endif %}
    </ul>
</body>
</html>
