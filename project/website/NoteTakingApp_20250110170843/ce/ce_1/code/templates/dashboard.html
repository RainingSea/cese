<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <h3>Your Notes</h3>
    <ul>
        {% for note in notes %}
            <li><a href="{{ url_for('view_note', note_id=note[0]) }}">{{ note[1] }}</a></li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
    <br>
    <a href="/logout">Logout</a>
</body>
</html>
