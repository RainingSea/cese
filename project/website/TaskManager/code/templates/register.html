<!DOCTYPE html>
<html>
<head>
    <title>Task Manager - Register</title>
</head>
<body>
    <h1>Register</h1>
    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/register">
        <label for="username">Username (min 4 chars, no spaces):</label>
        <input type="text" id="username" name="username" required minlength="4" pattern="[^\s]+"><br>
        <label for="password">Password (min 6 chars):</label>
        <input type="password" id="password" name="password" required minlength="6"><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('handle_login') }}">Login</a></p>
</body>
</html>
