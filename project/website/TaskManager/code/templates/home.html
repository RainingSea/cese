<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Task Manager</h1>
    <form method="POST">
        <label for="task_description">Task Description:</label>
        <input type="text" name="task_description" required>
        <label for="due_date">Due Date:</label>
        <input type="date" name="due_date" required>
        <button type="submit">Add Task</button>
    </form>
    <h2>Your Tasks:</h2>
    <ul>
        {% for task in tasks %}
            <li>{{ task[0] }} - {{ task[1] }} 
                <form method="POST" action="/remove_task/{{ loop.index0 }}">
                    <button type="submit">Remove Task</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <p><a href="/">Logout</a></p>
</body>
</html>
