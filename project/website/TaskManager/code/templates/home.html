<!DOCTYPE html>
<html>
<head>
    <title>Task Manager - Home</title>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>
    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
    
    <h2>Your Tasks</h2>
    <ul>
        {% for task in tasks %}
            <li>
                {{ task.description }} (Due: {{ task.due_date }})
                <form method="POST" action="/home" style="display:inline;">
                    <input type="hidden" name="task_id" value="{{ task.task_id }}">
                    <button type="submit">Remove</button>
                </form>
            </li>
        {% else %}
            <li>No tasks yet!</li>
        {% endfor %}
    </ul>
    
    <h2>Add New Task</h2>
    <form method="POST" action="/home">
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required><br>
        <label for="due_date">Due Date (YYYY-MM-DD):</label>
        <input type="date" id="due_date" name="due_date" required pattern="\d{4}-\d{2}-\d{2}"><br>
        <button type="submit">Add Task</button>
    </form>
    
    <p><a href="{{ url_for('handle_logout') }}">Logout</a></p>
</body>
</html>
