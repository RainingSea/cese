<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>Task List</h1>
    <form method="POST">
        <input type="text" name="description" placeholder="Task description" required>
        <input type="date" name="due_date" required>
        <button type="submit" name="add_task">Add Task</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>{{ task[1] }} - Due: {{ task[2] }}
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="task_id" value="{{ task[0] }}">
                    <button type="submit" name="remove_task">Remove Task</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <p><a href="/">Logout</a></p>
</body>
</html>
