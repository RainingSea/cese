<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Task Management</h2>
        <form method="POST">
            <div class="form-group">
                <label for="task_description">Task Description:</label>
                <input type="text" class="form-control" id="task_description" name="task_description" required>
            </div>
            <div class="form-group">
                <label for="due_date">Due Date:</label>
                <input type="date" class="form-control" id="due_date" name="due_date" required>
            </div>
            <button type="submit" name="add_task" class="btn btn-primary">Add Task</button>
        </form>
        <h3>Your Tasks</h3>
        <ul class="list-group">
            {% for task in tasks %}
            <li class="list-group-item">
                {{ task[0] }} - Due: {{ task[1] }}
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="task_index" value="{{ loop.index0 }}">
                    <button type="submit" name="remove_task" class="btn btn-danger btn-sm">Remove</button>
                </form>
            </li>
            {% endfor %}
        </ul>
        <a href="/logout" class="btn btn-link">Logout</a>
    </div>
</body>
</html>
