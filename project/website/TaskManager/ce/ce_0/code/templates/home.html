<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Welcome, {{ session['username'] }}</h1>
    <form action="/home" method="POST">
        <input type="text" name="task_description" placeholder="Task Description" required>
        <input type="date" name="due_date" required>
        <button type="submit">Add Task</button>
    </form>
    <h2>Your Tasks</h2>
    <ul>
        {% for task in tasks %}
            <li>{{ task.description }} - {{ task.due_date }}
                <form action="/home" method="POST" style="display:inline;">
                    <input type="hidden" name="remove_task" value="{{ task.description }}">
                    <button type="submit">Remove Task</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
