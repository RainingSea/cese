<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Welcome, {{ session['username'] }}!</h2>
    <h3>Your Tasks</h3>
    <ul>
        {% for task in tasks %}
            <li>{{ task[0] }} - Due: {{ task[1] }} 
                <form action="{{ url_for('home') }}" method="post" style="display:inline;">
                    <input type="hidden" name="task_index" value="{{ loop.index0 }}">
                    <button type="submit" name="remove_task">Remove</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <h3>Add New Task</h3>
    <form action="{{ url_for('home') }}" method="post">
        <label for="task_description">Task Description:</label>
        <input type="text" id="task_description" name="task_description" required><br>
        <label for="due_date">Due Date:</label>
        <input type="date" id="due_date" name="due_date" required><br>
        <button type="submit" name="add_task">Add Task</button>
    </form>
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
