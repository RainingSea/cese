{% extends "base.html" %}

{% block content %}
<h2>Study Groups</h2>
<h3>Available Groups</h3>
<ul>
    {% for group in groups %}
    <li>
        {{ group.name }} ({{ group.members|length }} members)
        {% if username not in group.members %}
            <a href="{{ url_for('join_group', groupname=group.name) }}">Join</a>
        {% else %}
            <span>Already joined</span>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endblock %}
