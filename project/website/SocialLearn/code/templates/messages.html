{% extends "base.html" %}

{% block content %}
<h2>Messages</h2>
<h3>Send Message</h3>
<form method="POST">
    <div>
        <label for="receiver">To:</label>
        <input type="text" id="receiver" name="receiver" required>
    </div>
    <div>
        <label for="content">Message:</label>
        <textarea id="content" name="content" required></textarea>
    </div>
    <button type="submit">Send</button>
</form>

<h3>Your Messages</h3>
<ul>
    {% for message in messages %}
    <li>
        <strong>{{ message.sender }} to {{ message.receiver }} ({{ message.timestamp }})</strong>
        <p>{{ message.content }}</p>
    </li>
    {% endfor %}
</ul>
{% endblock %}
