<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shared Resources</title>
</head>
<body>
    <h1>Shared Resources</h1>
    <form method="POST" action="/resources">
        <input type="text" name="title" placeholder="Resource Title" required>
        <input type="text" name="link" placeholder="Resource Link" required>
        <button type="submit">Share Resource</button>
    </form>
    <ul>
        {% for resource in resources %}
            <li><a href="{{ url_for('resource_details', resource_id=loop.index0) }}">{{ resource.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/profile">Profile</a>
</body>
</html>
