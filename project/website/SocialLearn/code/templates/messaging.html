<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messaging</title>
</head>
<body>
    <h1>Messaging</h1>
    <form method="POST" action="/messaging">
        <input type="text" name="receiver" placeholder="Receiver" required>
        <textarea name="content" placeholder="Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>
    <ul>
        {% for message in messages %}
            <li><strong>{{ message.sender }}:</strong> {{ message.content }}</li>
        {% endfor %}
    </ul>
    <a href="/profile">Profile</a>
</body>
</html>
