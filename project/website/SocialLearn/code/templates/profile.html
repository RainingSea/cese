{% extends "base.html" %}

{% block content %}
<h2>Profile</h2>
<p>Welcome, {{ profile.username }}!</p>
<form method="POST">
    <div>
        <label for="interests">Interests:</label>
        <textarea id="interests" name="interests">{{ profile.interests }}</textarea>
    </div>
    <div>
        <label for="expertise">Expertise:</label>
        <textarea id="expertise" name="expertise">{{ profile.expertise }}</textarea>
    </div>
    <button type="submit">Update Profile</button>
</form>
{% endblock %}
