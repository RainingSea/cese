<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resources</title>
</head>
<body>
    <h1>Resources</h1>
    <form method="POST" action="/resources">
        <input type="text" name="title" placeholder="Resource Title" required>
        <input type="text" name="link" placeholder="Resource Link" required>
        <button type="submit">Share Resource</button>
    </form>
    <ul>
        {% for resource in resources %}
            <li><a href="{{ resource[1] }}">{{ resource[0] }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
