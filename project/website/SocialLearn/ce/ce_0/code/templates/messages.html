<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messages</title>
</head>
<body>
    <h1>Messages</h1>
    <form method="POST" action="/messages">
        <input type="text" name="receiver" placeholder="Receiver" required>
        <textarea name="content" placeholder="Message Content" required></textarea>
        <button type="submit">Send Message</button>
    </form>
    <ul>
        {% for message in messages %}
            <li>{{ message[0] }} to {{ message[1] }}: {{ message[2] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
