<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Groups</title>
</head>
<body>
    <h1>Study Groups</h1>
    <form method="POST" action="/study_groups">
        <input type="text" name="group_name" placeholder="Group Name" required>
        <button type="submit">Create Study Group</button>
    </form>
    <ul>
        {% for group in study_groups %}
            <li>{{ group[0] }} - Members: {{ group[1] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
