<!DOCTYPE html>
<html>
<head>
    <title>Resources</title>
</head>
<body>
    <h2>Shared Resources</h2>
    <form method="POST">
        Resource: <input type="text" name="resource" required><br>
        <input type="submit" value="Share Resource">
    </form>
    <ul>
        {% for resource in resources %}
            <li>{{ resource }}</li>
        {% endfor %}
    </ul>
    <a href="/profile">Back to Profile</a>
</body>
</html>
