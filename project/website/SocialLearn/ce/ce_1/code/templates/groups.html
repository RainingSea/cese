<!DOCTYPE html>
<html>
<head>
    <title>Groups</title>
</head>
<body>
    <h1>Study Groups</h1>
    <form method="POST">
        <label>Join a new group:</label>
        <input type="text" name="group_name" required>
        <button type="submit">Join</button>
    </form>
    <h2>Available Groups</h2>
    <ul>
        {% for group in groups %}
            <li>{{ group.name }} (Members: {{ group.members|join(', ') }})</li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
