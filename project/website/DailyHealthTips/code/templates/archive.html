<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips Archive</title>
</head>
<body>
    <h1>Tips Archive</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Search tips...">
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
</body>
</html>
