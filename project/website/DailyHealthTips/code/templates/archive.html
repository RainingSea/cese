<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tips Archive</title>
</head>
<body>
    <h1>Health Tips Archive</h1>
    <form method="POST" action="{{ url_for('search') }}">
        <input type="text" name="query" placeholder="Search tips..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for tip in tips %}
            <li><a href="{{ url_for('tip', tip_index=loop.index0) }}">{{ tip.content }}</a> ({{ tip.date }})</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
