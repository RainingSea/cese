<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Health Tip</title>
</head>
<body>
    <h1>Today's Health Tip</h1>
    <p>{{ tip }}</p>
    <form method="POST">
        <button name="action" value="previous" {% if current_index == 0 %}disabled{% endif %}>Previous Tip</button>
        <button name="action" value="next" {% if current_index == (tip_manager.tips|length - 1) %}disabled{% endif %}>Next Tip</button>
    </form>
    <button onclick="location.href='/archive'">View Archive</button>
    <button onclick="location.href='/logout'">Logout</button>
</body>
</html>
