<!DOCTYPE html>
<html>
<head>
    <title>Tips Archive</title>
</head>
<body>
    <h1>Tips Archive</h1>
    <form action="{{ url_for('archive') }}" method="GET">
        <input type="text" name="search" value="{{ search_query }}" placeholder="Search tips...">
        <button type="submit">Search</button>
    </form>
    <a href="{{ url_for('main') }}">Back to Main</a>
    {% if tips %}
        <ul>
            {% for tip in tips %}
                <li><strong>{{ tip.date }}:</strong> {{ tip.content }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No tips found.</p>
    {% endif %}
</body>
</html>
