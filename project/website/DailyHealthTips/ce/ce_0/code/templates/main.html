<!DOCTYPE html>
<html>
<head>
    <title>Daily Health Tips</title>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>
    <h2>Today's Health Tip</h2>
    {% if tip %}
        <p><strong>{{ tip.date }}:</strong> {{ tip.content }}</p>
        <div>
            <a href="{{ url_for('previous_tip') }}">Previous Tip</a>
            <a href="{{ url_for('next_tip') }}">Next Tip</a>
        </div>
    {% else %}
        <p>No tips available.</p>
    {% endif %}
    <nav>
        <a href="{{ url_for('archive') }}">View Archive</a>
        <a href="{{ url_for('feedback') }}">Submit Feedback</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
    <form action="{{ url_for('archive') }}" method="GET">
        <input type="text" name="search" placeholder="Search tips...">
        <button type="submit">Search</button>
    </form>
</body>
</html>
