<!DOCTYPE html>
<html>
<head>
    <title>Daily Health Tips - Archive</title>
</head>
<body>
    <header>
        <nav>
            <a href="/dashboard">Home</a> |
            <a href="/archive">Archive</a> |
            <a href="/feedback">Feedback</a> |
            <a href="/">Logout</a>
        </nav>
    </header>
    <h1>Health Tips Archive</h1>
    <form action="/search" method="post">
        <input type="text" name="query" placeholder="Search tips...">
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for tip in tips %}
        <li>
            <strong>{{ tip.date }}</strong>: {{ tip.content }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
