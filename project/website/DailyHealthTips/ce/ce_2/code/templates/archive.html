<!DOCTYPE html>
<html>
<head>
    <title>Archive - Daily Health Tips</title>
</head>
<body>
    <header>
        <h1>Welcome, {{ username }}!</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a> |
            <a href="{{ url_for('archive') }}">Archive</a> |
            <a href="{{ url_for('feedback') }}">Feedback</a> |
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    
    <main>
        <h2>Tips Archive</h2>
        <form method="GET" action="{{ url_for('archive') }}">
            <input type="text" name="query" placeholder="Search tips...">
            <button type="submit">Search</button>
        </form>
        
        {% if tips %}
            <ul>
                {% for tip in tips %}
                    <li>
                        <h3>{{ tip.title }}</h3>
                        <p><em>{{ tip.date }}</em></p>
                        <p>{{ tip.content }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No tips found.</p>
        {% endif %}
    </main>
</body>
</html>
