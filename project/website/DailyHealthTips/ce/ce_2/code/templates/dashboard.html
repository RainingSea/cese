<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Daily Health Tips</title>
</head>
<body>
    <header>
        <h1>Welcome, {{ username }}!</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a> |
            <a href="{{ url_for('archive') }}">Archive</a> |
            <a href="{{ url_for('feedback') }}">Feedback</a> |
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    
    <main>
        {% if tip %}
            <h2>{{ tip.title }}</h2>
            <p><em>{{ tip.date }}</em></p>
            <p>{{ tip.content }}</p>
            
            <div>
                <a href="{{ url_for('dashboard', action='prev') }}">Previous Tip</a>
                <a href="{{ url_for('dashboard', action='next') }}">Next Tip</a>
            </div>
        {% else %}
            <p>No tips available.</p>
        {% endif %}
    </main>
</body>
</html>
