<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST" action="/dashboard">
            <input type="text" name="query" placeholder="Search for books..." required>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <h3>Available Books</h3>
        <ul>
            {% for book in books %}
            <li>
                <a href="/book/{{ book.title }}">{{ book.title }}</a> by {{ book.author }}
                <form method="POST" action="/add_to_reading_list" style="display:inline;">
                    <input type="hidden" name="book_title" value="{{ book.title }}">
                    <button type="submit" class="btn btn-secondary">Add to Reading List</button>
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
