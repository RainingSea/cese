<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>{{ title }}</title>
</head>
<body>
    <div class="container">
        <h2>{{ title }}</h2>
        <img src="{{ cover_image }}" alt="{{ title }}" class="img-fluid">
        <h3>Author: {{ author }}</h3>
        <p>{{ summary }}</p>
        <a href="/reading_list" class="btn btn-primary">Add to Reading List</a>
        <a href="/dashboard" class="btn btn-link">Back to Dashboard</a>
    </div>
</body>
</html>
