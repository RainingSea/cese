<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Search Books</h2>
        <ul>
            {% for book in books %}
                <li><a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }}</a> by {{ book.author }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
