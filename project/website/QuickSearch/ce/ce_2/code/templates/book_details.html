<!DOCTYPE html>
<html>
<head>
    <title>Book Details</title>
</head>
<body>
    <h1>{{ book[0] }}</h1>
    <p>Author: {{ book[1] }}</p>
    <p>Summary: {{ book[2] }}</p>
    <img src="{{ book[3] }}" alt="Cover Image">
    <form method="POST" action="/reading_list">
        <input type="hidden" name="book_title" value="{{ book[0] }}">
        <input type="submit" value="Add to Reading List">
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
