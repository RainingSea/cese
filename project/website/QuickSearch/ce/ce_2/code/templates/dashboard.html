<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Book Search</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Search for books..." required>
        <input type="submit" value="Search">
    </form>
    <h2>Available Books</h2>
    <ul>
        {% for book in books %}
            <li><a href="/book/{{ loop.index0 }}">{{ book[0] }} by {{ book[1] }}</a></li>
        {% endfor %}
    </ul>
    <a href="/reading_list">View Reading List</a>
</body>
</html>
