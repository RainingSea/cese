<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Search for books..." required>
        <button type="submit">Search</button>
    </form>
    <h2>Search Results:</h2>
    <ul>
        {% for book in results %}
        <li>
            <a href="/book/{{ loop.index0 }}">{{ book.title }}</a> by {{ book.author }} - {{ book.summary }}
        </li>
        {% endfor %}
    </ul>
    <a href="/reading_list">My Reading List</a>
</body>
</html>
