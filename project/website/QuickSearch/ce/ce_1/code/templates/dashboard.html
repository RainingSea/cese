<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>Dashboard</h2>
    <form method="post">
        <div class="form-group">
            <input type="text" class="form-control" name="search" placeholder="Search for books" required>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <h3>Search Results</h3>
    <ul>
        {% for book in results %}
        <li><a href="{{ url_for('book_details', title=book['title']) }}">{{ book['title'] }}</a> by {{ book['author'] }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
</div>
</body>
</html>
