<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Search for books..." required>
        <button type="submit">Search</button>
    </form>
    <h2>Search Results</h2>
    <ul>
        {% for book in books %}
            <li>
                <a href="/book/{{ book.title }}">{{ book.title }}</a> by {{ book.author }}
                <a href="/add_to_reading_list/{{ book.title }}">Add to Reading List</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/reading_list">View Reading List</a>
    <a href="/logout">Logout</a>
</body>
</html>
