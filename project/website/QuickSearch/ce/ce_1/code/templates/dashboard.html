<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="post">
        <input type="text" name="query" placeholder="Search for books..." required>
        <button type="submit">Search</button>
    </form>
    <h2>Search Results:</h2>
    <ul>
        {% for book in results %}
            <li><a href="/book/{{ book['id'] }}">{{ book['title'] }}</a> by {{ book['author'] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
