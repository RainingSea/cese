<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Journal Entries</h1>
    <a href="{{ url_for('new_entry') }}">New Entry</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    <ul>
        {% for entry in entries %}
        <li>{{ entry.title }} - {{ entry.date }}: {{ entry.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
