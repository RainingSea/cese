<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>
    <h1>Your Shopping Cart</h1>
    <table border="1">
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>${{ product.price }}</td>
            <td><a href="{{ url_for('remove_from_cart', product_id=product.id) }}">Remove</a></td>
        </tr>
        {% endfor %}
    </table>
    <h3>Total: ${{ total }}</h3>
    <p><a href="{{ url_for('products') }}">Continue Shopping</a></p>
    <p><a href="{{ url_for('checkout') }}">Proceed to Checkout</a></p>
</body>
</html>
