<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>
    <h1>Products</h1>
    <p>Welcome, {{ session.username }}! <a href="{{ url_for('logout') }}">Logout</a></p>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Description</th>
            <th>Action</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>${{ product.price }}</td>
            <td>{{ product.description }}</td>
            <td><a href="{{ url_for('add_to_cart', product_id=product.id) }}">Add to Cart</a></td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{{ url_for('cart') }}">View Cart</a></p>
</body>
</html>
