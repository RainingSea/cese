<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
</head>
<body>
    <h1>Checkout</h1>
    <form method="post">
        <label for="shipping_info">Shipping Information:</label>
        <input type="text" name="shipping_info" required>
        <label for="payment_info">Payment Information:</label>
        <input type="text" name="payment_info" required>
        <button type="submit">Place Order</button>
    </form>
</body>
</html>
