<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
</head>
<body>
    <h1>Your Shopping Cart</h1>
    <ul>
        {% for item in cart %}
            <li>Product ID: {{ item }}</li>
        {% endfor %}
    </ul>
    <form action="/checkout" method="post">
        <button type="submit">Checkout</button>
    </form>
    <a href="/product_listing">Continue Shopping</a>
</body>
</html>
