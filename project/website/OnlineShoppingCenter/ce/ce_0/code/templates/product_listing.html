<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Listing</title>
</head>
<body>
    <h1>Products</h1>
    <ul>
        {% for product in products %}
            <li>{{ product.name }} - ${{ product.price }} <a href="/add_to_cart/{{ product.id }}">Add to Cart</a></li>
        {% endfor %}
    </ul>
    <a href="/shopping_cart">View Cart</a>
</body>
</html>
