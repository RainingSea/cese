<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
</head>
<body>
    <h1>Checkout</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <h2>Shipping Information</h2>
        <label>Shipping Address:</label><br>
        <textarea name="shipping_address" rows="4" cols="50" required></textarea><br>
        
        <h2>Payment Information</h2>
        <label>Payment Details:</label><br>
        <textarea name="payment_info" rows="4" cols="50" required></textarea><br>
        
        <h2>Order Total: ${{ "%.2f"|format(total) }}</h2>
        <button type="submit">Confirm Order</button>
    </form>
    <p><a href="{{ url_for('cart') }}">Back to Cart</a></p>
</body>
</html>
