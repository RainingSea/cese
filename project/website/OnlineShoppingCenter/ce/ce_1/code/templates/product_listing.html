<!DOCTYPE html>
<html>
<head>
    <title>Product Listing</title>
</head>
<body>
    <h2>Products</h2>
    <ul>
        {% for product in products %}
        <li>{{ product.name }} - ${{ product.price }} 
            <a href="{{ url_for('add_to_cart', product_id=loop.index0) }}">Add to Cart</a>
        </li>
        {% endfor %}
    </ul>
    <a href="/shopping_cart">View Cart</a>
</body>
</html>
