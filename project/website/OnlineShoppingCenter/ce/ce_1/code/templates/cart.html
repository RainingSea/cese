<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>
    <h1>Your Cart</h1>
    {% if cart %}
    <ul>
        {% for item in cart %}
        <li>
            {{ item.product.name }} - ${{ item.product.price }} (Qty: {{ item.quantity }})
            <form method="POST" action="{{ url_for('cart') }}" style="display: inline;">
                <input type="hidden" name="product_id" value="{{ item.product.id }}">
                <button type="submit" name="remove">Remove</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('checkout') }}">Proceed to Checkout</a></p>
    {% else %}
    <p>Your cart is empty</p>
    {% endif %}
    <p><a href="{{ url_for('products') }}">Continue Shopping</a></p>
</body>
</html>
