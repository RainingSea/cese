<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
</head>
<body>
    <h1>Your Shopping Cart</h1>
    <ul>
        {% for item in cart_items %}
        <li>
            {{ item }} 
            <a href="/remove_from_cart/{{ item }}">Remove</a>
        </li>
        {% endfor %}
    </ul>
    <a href="/checkout">Checkout</a>
</body>
</html>
