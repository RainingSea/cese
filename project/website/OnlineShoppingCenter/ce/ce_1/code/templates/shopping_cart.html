<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>
    <h2>Shopping Cart</h2>
    <ul>
        {% for product in cart_products %}
        <li>{{ product.name }} - ${{ product.price }}</li>
        {% endfor %}
    </ul>
    <form action="/checkout" method="post">
        <input type="submit" value="Checkout">
    </form>
    <a href="/product_listing">Continue Shopping</a>
</body>
</html>
