<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <h3>Equipment List</h3>
    <ul>
        {% for eq in equipment %}
            <li>{{ eq[0] }} - Quantity: {{ eq[1] }}, Condition: {{ eq[2] }}, Availability: {{ eq[3] }}, Location: {{ eq[4] }}</li>
        {% endfor %}
    </ul>
    <form method="POST">
        <button name="logout">Logout</button>
    </form>
</body>
</html>
