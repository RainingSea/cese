<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Equipment Dashboard</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Quantity</th>
            <th>Condition</th>
            <th>Availability</th>
            <th>Location</th>
        </tr>
        {% for name, details in equipment.items() %}
        <tr>
            <td>{{ name }}</td>
            <td>{{ details.type }}</td>
            <td>{{ details.quantity }}</td>
            <td>{{ details.condition }}</td>
            <td>{{ details.availability }}</td>
            <td>{{ details.location }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
