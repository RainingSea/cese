<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Equipment Dashboard</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Condition</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                {% for eq in equipment %}
                <tr>
                    <td>{{ eq[0] }}</td>
                    <td>{{ eq[1] }}</td>
                    <td>{{ eq[2] }}</td>
                    <td>{{ eq[3] }}</td>
                    <td>{{ eq[4] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
