<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
<div class="container">
    <h2>Equipment Dashboard</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="type">Type:</label>
            <input type="text" class="form-control" id="type" name="type" required>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" class="form-control" id="quantity" name="quantity" required>
        </div>
        <div class="form-group">
            <label for="condition">Condition:</label>
            <input type="text" class="form-control" id="condition" name="condition" required>
        </div>
        <div class="form-group">
            <label for="availability">Availability:</label>
            <input type="checkbox" id="availability" name="availability">
        </div>
        <div class="form-group">
            <label for="location">Location:</label>
            <input type="text" class="form-control" id="location" name="location" required>
        </div>
        <div class="form-group">
            <label for="maintenance_alert">Maintenance Alert:</label>
            <input type="text" class="form-control" id="maintenance_alert" name="maintenance_alert" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Equipment</button>
    </form>

    <h3>Equipment List</h3>
    <ul>
        {% for equipment in equipment_list %}
            <li>{{ equipment.name }} - {{ equipment.type }} - {{ equipment.quantity }} - {{ equipment.condition }} - {{ equipment.availability }} - {{ equipment.location }} - {{ equipment.maintenance_alert }}</li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
