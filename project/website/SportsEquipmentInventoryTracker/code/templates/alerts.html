<!DOCTYPE html>
<html>
<head>
    <title>Alerts</title>
</head>
<body>
    <h1>Alerts</h1>
    <a href="/dashboard">Back to Dashboard</a>
    <a href="/logout">Logout</a>
    
    <h2>Active Alerts</h2>
    <table border="1">
        <tr>
            <th>Equipment</th>
            <th>Alert Type</th>
            <th>Threshold Date</th>
        </tr>
        {% for alert in alerts %}
        <tr>
            <td>
                {% for item in equipment %}
                    {% if item.id == alert.equipment_id %}
                        {{ item.name }}
                    {% endif %}
                {% endfor %}
            </td>
            <td>{{ alert.alert_type }}</td>
            <td>{{ alert.threshold_date }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
