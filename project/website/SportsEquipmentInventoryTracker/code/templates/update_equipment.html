<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Update Equipment</title>
</head>
<body>
    <div class="container">
        <h2>Update Equipment</h2>
        <form method="POST">
            <div class="form-group">
                <label for="name">Equipment Name:</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ equipment.name }}" required>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" class="form-control" id="quantity" name="quantity" value="{{ equipment.quantity }}" required>
            </div>
            <div class="form-group">
                <label for="condition">Condition:</label>
                <input type="text" class="form-control" id="condition" name="condition" value="{{ equipment.condition }}" required>
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" class="form-control" id="location" name="location" value="{{ equipment.location }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Equipment</button>
        </form>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</body>
</html>
