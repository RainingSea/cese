<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Equipment Dashboard</h1>
    <form method="GET" action="{{ url_for('search') }}">
        <input type="text" name="query" placeholder="Search equipment" required>
        <button type="submit">Search</button>
    </form>
    <h2>Equipment List</h2>
    <ul>
        {% for item in equipment %}
            <li>
                {{ item.name }} - Quantity: {{ item.quantity }} - Condition: {{ item.condition }} - Availability: {{ item.availability }} - Location: {{ item.location }}
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="name" value="{{ item.name }}">
                    <input type="number" name="quantity" value="{{ item.quantity }}" required>
                    <input type="text" name="condition" value="{{ item.condition }}" required>
                    <input type="text" name="availability" value="{{ item.availability }}" required>
                    <input type="text" name="location" value="{{ item.location }}" required>
                    <button type="submit" name="update">Update Equipment</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <h2>Add Equipment</h2>
    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" required>
        <br>
        <label for="condition">Condition:</label>
        <input type="text" id="condition" name="condition" required>
        <br>
        <label for="availability">Availability:</label>
        <input type="text" id="availability" name="availability" required>
        <br>
        <label for="location">Location:</label>
        <input type="text" id="location" name="location" required>
        <br>
        <button type="submit">Add Equipment</button>
    </form>
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
