<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST">
            <div class="form-group">
                <label for="search">Search Equipment:</label>
                <input type="text" class="form-control" id="search" name="search">
            </div>
            <button type="submit" class="btn btn-secondary">Search</button>
        </form>
        <form method="POST">
            <div class="form-group">
                <label for="name">Equipment Name:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" class="form-control" id="quantity" name="quantity" required>
            </div>
            <div class="form-group">
                <label for="condition">Condition:</label>
                <input type="text" class="form-control" id="condition" name="condition" required>
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" class="form-control" id="location" name="location" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Equipment</button>
        </form>
        <h3>Equipment List</h3>
        <ul>
            {% for equipment in equipment_list %}
                <li>
                    <a href="{{ url_for('view_equipment', index=loop.index0) }}">{{ equipment.name }}</a> - Quantity: {{ equipment.quantity }} - Condition: {{ equipment.condition }} - Location: {{ equipment.location }}
                    <a href="{{ url_for('update_equipment', index=loop.index0) }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{{ url_for('set_alert', index=loop.index0) }}" class="btn btn-info btn-sm">Set Alert</a>
                </li>
            {% endfor %}
        </ul>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
