<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Equipment Dashboard</h2>
        <a href="{{ url_for('add_equipment') }}" class="btn btn-success">Add Equipment</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
        <form method="POST" class="form-inline my-2">
            <input type="text" name="search_query" class="form-control mr-2" placeholder="Search Equipment">
            <button type="submit" class="btn btn-info">Search</button>
        </form>
        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Condition</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                {% for equip in equipment %}
                <tr>
                    <td>{{ equip[0] }}</td>
                    <td>{{ equip[1] }}</td>
                    <td>{{ equip[2] }}</td>
                    <td>{{ equip[3] }}</td>
                    <td>{{ equip[4] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
