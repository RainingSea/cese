<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Set Alert</title>
</head>
<body>
    <div class="container">
        <h2>Set Alert for {{ equipment.name }}</h2>
        <form method="POST">
            <div class="form-group">
                <label for="alert_message">Alert Message:</label>
                <input type="text" class="form-control" id="alert_message" name="alert_message" required>
            </div>
            <button type="submit" class="btn btn-primary">Set Alert</button>
        </form>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</body>
</html>
