<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>
<body>
    <h1>User Profile</h1>
    <h2>Your Submitted Recipes</h2>
    <ul>
        {% for user_recipe in user_recipes %}
            <li>{{ user_recipe.split('|')[1] }}</li>
        {% endfor %}
    </ul>
    <a href="/">Logout</a>
</body>
</html>
