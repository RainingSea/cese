<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Task List</h2>
    <form method="post">
        <label for="task_description">Task Description:</label>
        <input type="text" id="task_description" name="task_description" required>
        <br>
        <label for="due_date">Due Date:</label>
        <input type="date" id="due_date" name="due_date" required>
        <br>
        <button type="submit">Add Task</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>{{ task.description }} - {{ task.due_date }}
                <form method="post" action="/remove_task" style="display:inline;">
                    <input type="hidden" name="task_description" value="{{ task.description }}">
                    <button type="submit">Remove</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
