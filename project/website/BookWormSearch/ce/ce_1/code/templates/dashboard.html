<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Available Books</h2>
    <ul>
        {% for book in books %}
        <li><a href="/book/{{ book.title }}">{{ book.title }}</a> by {{ book.author }}</li>
        {% endfor %}
    </ul>
    <a href="/reading_list">My Reading List</a>
</body>
</html>
