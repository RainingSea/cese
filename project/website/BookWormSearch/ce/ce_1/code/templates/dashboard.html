<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <input type="text" id="search" placeholder="Search for books...">
    <ul id="book-list">
        {% for book in books %}
            <li><a href="/book/{{ book.title }}">{{ book.title }}</a> by {{ book.author }}</li>
        {% endfor %}
    </ul>
    <p><a href="/reading_list">My Reading List</a></p>
</body>
</html>
