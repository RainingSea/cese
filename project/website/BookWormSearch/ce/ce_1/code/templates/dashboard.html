<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Search for books" required>
        <button type="submit">Search</button>
    </form>
    <h2>Available Books</h2>
    <ul>
        {% for book in books %}
        <li><a href="{{ url_for('book_details', book_id=loop.index0) }}">{{ book }}</a></li>
        {% endfor %}
    </ul>
    <a href="/reading_list">My Reading List</a>
</body>
</html>
