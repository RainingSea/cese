<!DOCTYPE html>
<html>
<head>
    <title>Reading List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <h1>Welcome, {{ username }}!</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('reading_list') }}">Reading List</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </div>
    <div class="container">
        <h2>Your Reading List</h2>
        {% if books %}
        <div class="reading-list">
            {% for book in books %}
            <div class="book-card">
                <h3>{{ book.title }}</h3>
                <p>by {{ book.author }}</p>
                <p>{{ book.summary }}</p>
                <div class="actions">
                    <a href="{{ url_for('book_details', title=book.title) }}">View Details</a>
                    <a href="{{ url_for('remove_from_list', title=book.title) }}" class="remove">Remove</a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p>Your reading list is empty.</p>
        {% endif %}
        <a href="{{ url_for('dashboard') }}" class="button">Back to Dashboard</a>
    </div>
</body>
</html>
