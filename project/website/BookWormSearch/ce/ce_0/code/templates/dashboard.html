<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST">
            <input type="text" name="query" placeholder="Search for books..." required>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <h3>Search Results:</h3>
        <ul>
            {% for book in books %}
                <li>
                    <a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }}</a>
                    <a href="{{ url_for('add_to_reading_list', title=book.title) }}" class="btn btn-secondary">Add to Reading List</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
