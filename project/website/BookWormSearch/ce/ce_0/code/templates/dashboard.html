<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome, {{ username }}</h1>
    <a href="{{ url_for('logout') }}">Logout</a>
    <a href="{{ url_for('reading_list') }}">My Reading List</a>
    
    <form method="POST">
        <input type="text" name="query" placeholder="Search books..." required>
        <button type="submit">Search</button>
    </form>
    
    {% if books %}
        <h2>Search Results</h2>
        <ul>
            {% for book in books %}
                <li><a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }} by {{ book.author }}</a></li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
