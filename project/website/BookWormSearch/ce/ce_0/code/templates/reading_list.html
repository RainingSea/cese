<!DOCTYPE html>
<html>
<head>
    <title>My Reading List</title>
</head>
<body>
    <h1>Reading List for {{ username }}</h1>
    <a href="{{ url_for('dashboard') }}">Back to Search</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    
    {% if books %}
        <ul>
            {% for book in books %}
                <li>
                    <a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }} by {{ book.author }}</a>
                    <a href="{{ url_for('remove_from_list', title=book.title) }}" style="color:red">Remove</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Your reading list is empty.</p>
    {% endif %}
</body>
</html>
