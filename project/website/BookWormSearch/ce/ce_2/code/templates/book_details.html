<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }} - Details</title>
</head>
<body>
    <h2>{{ book.title }}</h2>
    <p><strong>Author:</strong> {{ book.author }}</p>
    <p><strong>Description:</strong> {{ book.description }}</p>
    <p><strong>Author Details:</strong> {{ book.author_details }}</p>
    <p><strong>Summary:</strong> {{ book.summary }}</p>
    <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a> | <a href="{{ url_for('reading_list') }}">My Reading List</a> | <a href="{{ url_for('logout') }}">Logout</a></p>
    {% if message %}
    <p style="color:green;">{{ message }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('book_details', book_id=book.id) }}">
        <button type="submit">Add to Reading List</button>
    </form>
</body>
</html>
