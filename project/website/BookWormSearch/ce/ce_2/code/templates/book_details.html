<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ details.title }}</title>
</head>
<body>
    <h1>{{ details.title }}</h1>
    <p><strong>Author:</strong> {{ details.author }}</p>

    <p><strong>Description:</strong> {{ details.description }}</p>

    </form>
</body>
</html>
