<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="post">
        <input type="text" name="query" placeholder="Search for books..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for book in results %}
            <li><a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }}</a> by {{ book.author }}</li>
        {% endfor %}
    </ul>
</body>
</html>
