<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="POST">
        <input type="text" name="search" placeholder="Search for books" required>
        <button type="submit">Search</button>
    </form>
    <h2>Search Results</h2>
    <ul>
        {% for book in books %}
            <li><a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }}</a> by {{ book.author }}</li>
        {% endfor %}
    </ul>
    <a href="/reading_list">My Reading List</a>
    <a href="/logout">Logout</a>
</body>
</html>
