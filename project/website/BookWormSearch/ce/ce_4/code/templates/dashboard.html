<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Book Dashboard</h2>
    <h3>Available Books</h3>
    <ul>
        {% for book in books %}
            <li><a href="/book/{{ loop.index0 }}">{{ book.title }}</a> by {{ book.author }}</li>
        {% endfor %}
    </ul>
    <a href="/reading_list">My Reading List</a>
</body>
</html>
