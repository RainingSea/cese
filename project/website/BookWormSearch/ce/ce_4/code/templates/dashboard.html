<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <form method="POST">
        <input type="text" name="query" placeholder="Search for books..." required>
        <button type="submit">Search</button>
    </form>
    <h3>Search Results:</h3>
    <ul>
        {% for book in books %}
            <li><a href="/book/{{ loop.index0 }}">{{ book.title }} by {{ book.author }}</a></li>
        {% endfor %}
    </ul>
    <a href="/reading_list">My Reading List</a>
    <a href="/logout">Logout</a>
</body>
</html>
