<!DOCTYPE html>
<html>
<head>
    <title>My Reading List</title>
</head>
<body>
    <h1>{{ username }}'s Reading List</h1>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    
    {% if books %}
        <ul>
            {% for book in books %}
                <li>
                    <h3><a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }}</a></h3>
                    <p>by {{ book.author }}</p>
                    <a href="{{ url_for('remove_from_list', title=book.title) }}">Remove</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Your reading list is empty.</p>
    {% endif %}
</body>
</html>
