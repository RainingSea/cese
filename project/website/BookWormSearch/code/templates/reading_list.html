<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading List</title>
</head>
<body>
    <h1>My Reading List</h1>
    <ul>
        {% for book in books %}
            <li>{{ book }} <a href="{{ url_for('remove_from_reading_list', title=book) }}">Remove</a></li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
