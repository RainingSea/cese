<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>
    <h1>{{ username }}'s Profile</h1>
    <h2>Your Recipes</h2>
    <ul>
        {% for recipe in recipes %}
            <li><a href="{{ url_for('recipe_details', recipe_id=recipe[0]) }}">{{ recipe[1] }}</a></li>
        {% endfor %}
    </ul>
    <form method="POST">
        <button type="submit">Delete Account</button>
    </form>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
