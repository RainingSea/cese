<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Recipes</title>
</head>
<body>
    <h1>Browse Recipes</h1>
    <ul>
        {% for recipe in recipes %}
            <li><a href="/recipe/{{ recipe[1] }}">{{ recipe[1] }}</a> by {{ recipe[0] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
