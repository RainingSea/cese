<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browse Recipes</title>
</head>
<body>
    <h1>Recipe Browsing</h1>
    <ul>
        {% for recipe in recipes %}
            <li><a href="{{ url_for('recipe_details', title=recipe.title) }}">{{ recipe.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/recipe_submission">Submit a Recipe</a>
</body>
</html>
