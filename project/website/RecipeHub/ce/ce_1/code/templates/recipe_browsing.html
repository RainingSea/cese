<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browse Recipes</title>
</head>
<body>
    <h1>Browse Recipes</h1>
    <form method="get" action="/browse_recipes">
        <input type="text" name="query" placeholder="Search Recipes">
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for recipe in recipes %}
            <li><a href="/recipe_details/{{ recipe.title }}">{{ recipe.title }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
