<!DOCTYPE html>
<html>
<head>
    <title>Home - RecipeHub</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #4CAF50; }
        .menu { margin-top: 30px; }
        .menu-item { display: block; margin-bottom: 15px; padding: 10px; background-color: #f5f5f5; text-decoration: none; color: #333; }
        .menu-item:hover { background-color: #e0e0e0; }
        .logout { margin-top: 30px; }
    </style>
</head>
<body>
    <h1>Welcome to RecipeHub, {{ username }}!</h1>
    <div class="menu">
        <a href="{{ url_for('submit_recipe') }}" class="menu-item">Submit a New Recipe</a>
        <a href="{{ url_for('browse_recipes') }}" class="menu-item">Browse Recipes</a>
        <a href="{{ url_for('profile') }}" class="menu-item">My Profile</a>
    </div>
    <div class="logout">
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</body>
</html>
