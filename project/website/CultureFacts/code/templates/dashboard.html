<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
<div class="container">
    <h2>Culture Dashboard</h2>
    <form method="POST" action="/search">
        <div class="form-group">
            <input type="text" class="form-control" name="keyword" placeholder="Search cultures..." required>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <ul>
        {% for culture in cultures %}
            <li>
                <a href="/culture/{{ culture.name }}">{{ culture.name }}</a>
                <form action="/bookmark/{{ culture.name }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-link">Bookmark</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
