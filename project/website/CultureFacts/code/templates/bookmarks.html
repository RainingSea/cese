<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookmarks</title>
</head>
<body>
    <h1>Your Bookmarks</h1>
    <ul>
        {% for bookmark in bookmarks %}
            <li>{{ bookmark }} <a href="{{ url_for('remove_bookmark', culture_name=bookmark) }}">Remove</a></li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
