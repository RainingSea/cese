<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>{{ culture_name }} Details</title>
</head>
<body>
    <div class="container">
        <h2>{{ culture_name }} Details</h2>
        <ul>
            {% for fact in details %}
                <li>{{ fact }}</li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('bookmark', culture_name=culture_name) }}" class="btn btn-primary">Bookmark</a>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</body>
</html>
