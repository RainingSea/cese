<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Culture Facts Dashboard</h1>
    <ul>
        {% for culture_name, culture in cultures.items() %}
            <li>
                <a href="/culture/{{ culture_name }}">{{ culture_name }}</a>
                <a href="/bookmark/{{ culture_name }}">Bookmark</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
