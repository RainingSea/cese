<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Culture Dashboard</h2>
        <input type="text" id="search" placeholder="Search cultures...">
        <ul id="culture-list">
            {% for culture in cultures %}
                <li>
                    <a href="{{ url_for('culture_details', culture_name=culture) }}">{{ culture }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
