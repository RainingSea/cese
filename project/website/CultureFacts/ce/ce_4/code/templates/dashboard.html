<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Culture Dashboard</h1>
    <ul>
        {% for culture in cultures.values() %}
            <li><a href="/culture/{{ culture.name }}">{{ culture.name }}</a></li>
        {% endfor %}
    </ul>
    <a href="/bookmarks">View Bookmarks</a>
</body>
</html>
