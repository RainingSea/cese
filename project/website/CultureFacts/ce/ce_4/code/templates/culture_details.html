<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>{{ details.name }}</title>
</head>
<body>
    <div class="container">
        <h2>{{ details.name }}</h2>
        <p>{{ details.details }}</p>
        <form method="POST" action="/bookmark">
            <input type="hidden" name="culture_name" value="{{ details.name }}">
            <button type="submit" class="btn btn-primary">Bookmark</button>
        </form>
        <a href="/dashboard" class="btn btn-link">Back to Dashboard</a>
    </div>
</body>
</html>
