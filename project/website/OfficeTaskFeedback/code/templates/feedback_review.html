<!DOCTYPE html>
<html>
<head>
    <title>Feedback Review</title>
</head>
<body>
    <h2>Feedback Review</h2>
    <ul>
        {% for f in feedback %}
            <li>{{ f.username }}: {{ f.feedback }} ({{ f.category }})</li>
        {% endfor %}
    </ul>
    <a href="/feedback">Submit More Feedback</a>
</body>
</html>
