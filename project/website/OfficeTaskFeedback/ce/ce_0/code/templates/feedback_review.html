<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Review</title>
</head>
<body>
    <h2>Feedback Review</h2>
    <table>
        <tr>
            <th>Username</th>
            <th>Feedback</th>
            <th>Category</th>
        </tr>
        {% for feedback in feedbacks %}
        <tr>
            <td>{{ feedback[0] }}</td>
            <td>{{ feedback[1] }}</td>
            <td>{{ feedback[2] }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/">Logout</a>
</body>
</html>
