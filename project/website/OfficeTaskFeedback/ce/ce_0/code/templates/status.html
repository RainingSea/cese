<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Feedback Status</title>
</head>
<body>
    <div class="container">
        <h2>Feedback Status</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Feedback</th>
                    <th>Category</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for feedback in feedbacks %}
                <tr>
                    <td>{{ feedback[0] }}</td>
                    <td>{{ feedback[1] }}</td>
                    <td>{{ feedback[2] }}</td>
                    <td>{{ feedback[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/feedback" class="btn btn-link">Submit More Feedback</a>
    </div>
</body>
</html>
