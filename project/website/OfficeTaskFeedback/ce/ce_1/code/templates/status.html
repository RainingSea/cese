<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Status</title>
</head>
<body>
    <h2>Your Feedback Status</h2>
    <ul>
        {% for feedback in feedback_status %}
            <li>{{ feedback[1] }} - {{ feedback[3] }}</li>
        {% endfor %}
    </ul>
    <p><a href="/feedback">Submit More Feedback</a></p>
</body>
</html>
