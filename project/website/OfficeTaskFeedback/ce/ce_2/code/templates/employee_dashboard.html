<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Feedback</h2>
        <div>
            <a href="{{ url_for('feedback') }}" class="btn btn-primary">Submit New Feedback</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
        </div>
    </div>
    
    <div class="list-group">
        {% for item in feedback %}
        <div class="list-group-item">
            <div class="d-flex w-100 justify-content-between">
                <h5 class="mb-1">{{ item.task }}</h5>
                <small class="text-{% if item.status == 'Addressed' %}success{% elif item.status == 'In Review' %}warning{% else %}danger{% endif %}">
                    {{ item.status }}
                </small>
            </div>
            <p class="mb-1">{{ item.feedback }}</p>
            <small>Category: {{ item.category }} | Submitted: {{ item.timestamp }}</small>
        </div>
        {% endfor %}
    </div>
</body>
</html>
