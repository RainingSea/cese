<!DOCTYPE html>
<html>
<head>
    <title>Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Feedback Dashboard</h2>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>
    
    <div class="mb-3">
        <form class="row g-3">
            <div class="col-auto">
                <label class="form-label">Filter by Category:</label>
            </div>
            <div class="col-auto">
                <select name="category" class="form-select" onchange="this.form.submit()">
                    <option value="">All</option>
                    <option value="Task Clarity" {% if request.args.get('category') == 'Task Clarity' %}selected{% endif %}>Task Clarity</option>
                    <option value="Resources" {% if request.args.get('category') == 'Resources' %}selected{% endif %}>Resources</option>
                    <option value="Deadlines" {% if request.args.get('category') == 'Deadlines' %}selected{% endif %}>Deadlines</option>
                </select>
            </div>
        </form>
    </div>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Task</th>
                <th>Feedback</th>
                <th>Category</th>
                <th>Status</th>
                <th>Timestamp</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in feedback %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.username }}</td>
                <td>{{ item.task }}</td>
                <td>{{ item.feedback }}</td>
                <td>{{ item.category }}</td>
                <td>{{ item.status }}</td>
                <td>{{ item.timestamp }}</td>
                <td>
                    <form method="POST" action="{{ url_for('update_status') }}" class="d-inline">
                        <input type="hidden" name="feedback_id" value="{{ item.id }}">
                        <select name="status" onchange="this.form.submit()" class="form-select form-select-sm">
                            <option value="Pending" {% if item.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="In Review" {% if item.status == 'In Review' %}selected{% endif %}>In Review</option>
                            <option value="Addressed" {% if item.status == 'Addressed' %}selected{% endif %}>Addressed</option>
                        </select>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
