<!DOCTYPE html>
<html>
<head>
    <title>Status Display</title>
</head>
<body>
    <h2>Your Feedback Status</h2>
    <table>
        <tr>
            <th>Feedback</th>
            <th>Status</th>
        </tr>
        {% for status in statuses %}
        <tr>
            <td>{{ status[1] }}</td>
            <td>{{ status[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
