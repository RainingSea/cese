<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Content Feed</title>
</head>
<body>
    <h1>Content Feed</h1>
    <ul>
        {% for article in articles %}
        <li>
            <h2>{{ article.title }}</h2>
            <p>{{ article.content }}</p>
            <p><em>By {{ article.author }}</em></p>
        </li>
        {% endfor %}
    </ul>
    <a href="/profile">Back to Profile</a>
    <a href="/discovery">Discover Content</a>
</body>
</html>
