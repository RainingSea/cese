<!DOCTYPE html>
<html>
<head>
    <title>Feed</title>
</head>
<body>
    <nav>
        <a href="/feed">Home</a>
        <a href="/profile">Profile</a>
        <a href="/upload">Upload</a>
        <a href="/logout">Logout</a>
    </nav>
    <h1>Content Feed</h1>
    <a href="/upload">Create New Post</a>
    {% for post in feed %}
    <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
        <h3>{{ post.title }}</h3>
        <p>By {{ post.username }} on {{ post.timestamp }}</p>
        <p>{{ post.content }}</p>
        <button>Like</button>
        <button>Comment</button>
        <button>Save</button>
    </div>
    {% endfor %}
</body>
</html>
