<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>
    <nav>
        <a href="/feed">Home</a>
        <a href="/profile">Profile</a>
        <a href="/upload">Upload</a>
        <a href="/logout">Logout</a>
    </nav>
    <h1>Profile</h1>
    <form method="POST" action="/profile">
        <label for="bio">Bio:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="50">{{ profile.bio }}</textarea><br>
        <label for="info">Personal Info:</label><br>
        <textarea id="info" name="info" rows="4" cols="50">{{ profile.info }}</textarea><br>
        <button type="submit">Update Profile</button>
    </form>
</body>
</html>
