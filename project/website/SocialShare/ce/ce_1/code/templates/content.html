<!DOCTYPE html>
<html>
<head>
    <title>{{ content.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('feed') }}">SocialShare</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('profile_page') }}">Profile</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card mb-3">
                    <div class="card-body">
                        <h3 class="card-title">{{ content.title }}</h3>
                        <h6 class="card-subtitle mb-2 text-muted">Posted by {{ content.username }} on {{ content.timestamp }}</h6>
                        <p class="card-text">{{ content.content }}</p>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-sm btn-outline-primary">Like</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">Comment</button>
                            <button type="button" class="btn btn-sm btn-outline-success">Save</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5>Comments</h5>
                    </
