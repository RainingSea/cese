<!DOCTYPE html>
<html>
<head>
    <title>Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('feed') }}">SocialShare</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('profile_page') }}">Profile</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-8 offset-md-2">
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8 offset-md-2">
                {% for item in feed %}
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">{{ item.title }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">Posted by {{ item.username }} on {{ item.timestamp }}</h6>
                        <p class="card-text">{{ item.content }}</p>
                        <a href="{{ url_for('content_page', content_id=item.content_id) }}" class="btn btn-sm btn-primary">View</a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
