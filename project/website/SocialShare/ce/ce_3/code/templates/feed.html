<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
</head>
<body>
    <h1>Content Feed</h1>
    <ul>
        {% for item in content %}
            <li>{{ item.username }}: {{ item.article }}</li>
        {% endfor %}
    </ul>
    <a href="/upload">Upload Content</a>
</body>
</html>
