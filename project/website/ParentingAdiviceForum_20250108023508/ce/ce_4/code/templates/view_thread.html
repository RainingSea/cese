<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ thread.title }}</title>
</head>
<body>
    <h1>{{ thread.title }}</h1>
    <p>{{ thread.content }}</p>
    <h2>Comments</h2>
    <ul>
        {% for comment in thread.comments %}
            <li>{{ comment.content }}</li>
        {% endfor %}
    </ul>
    <form method="post">
        <label for="comment">Add a comment:</label>
        <input type="text" name="comment" required>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
