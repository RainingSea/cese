<!DOCTYPE html>
<html>
<head>
    <title>{{ destination.name }} Details</title>
</head>
<body>
    <h1>{{ destination.name }}</h1>
    <p>Activities: {{ destination.activities }}</p>
    <p>Climate: {{ destination.climate }}</p>
    <p>Cost: ${{ destination.cost }}</p>
    <a href="{{ url_for('save_favorite', name=destination.name) }}">Save as Favorite</a>
    <p><a href="{{ url_for('recommendations') }}">Back to Recommendations</a></p>
</body>
</html>
