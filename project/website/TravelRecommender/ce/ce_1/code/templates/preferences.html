<!DOCTYPE html>
<html>
<head>
    <title>Preferences</title>
</head>
<body>
    <h1>Set Your Travel Preferences</h1>
    <form method="POST">
        <label>Budget ($):</label>
        <input type="number" name="budget" min="0" required><br>
        
        <label>Activities:</label><br>
        <input type="checkbox" name="activities" value="hiking"> Hiking<br>
        <input type="checkbox" name="activities" value="beach"> Beach<br>
        <input type="checkbox" name="activities" value="museum"> Museum<br>
        <input type="checkbox" name="activities" value="city"> City Exploration<br>
        
        <label>Preferred Climate:</label>
        <select name="climate" required>
            <option value="warm">Warm</option>
            <option value="moderate">Moderate</option>
            <option value="cold">Cold</option>
        </select><br>
        
        <button type="submit">Save Preferences</button>
    </form>
</body>
</html>
