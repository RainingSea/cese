<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Preferences</title>
</head>
<body>
    <h1>Travel Preferences</h1>
    <form method="post" action="/preferences">
        <label for="budget">Budget:</label>
        <input type="text" id="budget" name="budget" required>
        <label for="activities">Preferred Activities:</label>
        <input type="text" id="activities" name="activities" required>
        <label for="climate">Desired Climate:</label>
        <input type="text" id="climate" name="climate" required>
        <button type="submit">Submit Preferences</button>
    </form>
</body>
</html>
