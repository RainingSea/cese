<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Preferences</title>
</head>
<body>
    <h2>Travel Preferences</h2>
    <form method="POST" action="/preferences">
        <label for="budget">Budget:</label>
        <input type="number" name="budget" required><br>
        <label for="activities">Activities:</label><br>
        <input type="checkbox" name="activities" value="hiking"> Hiking<br>
        <input type="checkbox" name="activities" value="beach"> Beach<br>
        <input type="checkbox" name="activities" value="cultural"> Cultural<br>
        <label for="climate">Preferred Climate:</label>
        <input type="text" name="climate" required><br>
        <button type="submit">Submit Preferences</button>
    </form>
</body>
</html>
