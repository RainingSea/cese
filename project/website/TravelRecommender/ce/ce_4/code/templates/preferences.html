<!DOCTYPE html>
<html>
<head>
    <title>Travel Preferences</title>
</head>
<body>
    <h1>Preferences Page</h1>
    <form method="POST">
        Budget: <input type="number" name="budget" required><br>
        Activities: <input type="checkbox" name="activities" value="swimming"> Swimming
        <input type="checkbox" name="activities" value="hiking"> Hiking
        <input type="checkbox" name="activities" value="sightseeing"> Sightseeing<br>
        Climate: <input type="text" name="climate" required><br>
        <input type="submit" value="Submit Preferences">
    </form>
</body>
</html>
