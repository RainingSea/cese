<!DOCTYPE html>
<html>
<head>
    <title>Recommendations</title>
</head>
<body>
    <h1>Recommended Destinations</h1>
    <ul>
        {% for destination in destinations %}
            <li>{{ destination.destination }} - Activities: {{ destination.activities }} - Climate: {{ destination.climate }} - Cost: ${{ destination.cost }}</li>
        {% endfor %}
    </ul>
    <a href="/favorites">View Favorites</a>
</body>
</html>
