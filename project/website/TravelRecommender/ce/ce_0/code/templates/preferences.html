<!DOCTYPE html>
<html>
<head>
    <title>Travel Preferences</title>
</head>
<body>
    <h2>Travel Preferences</h2>
    <form method="post" action="/recommendations">
        Budget: <input type="number" name="budget" required><br>
        Preferred Activities: <br>
        <input type="checkbox" name="activities" value="Hiking"> Hiking<br>
        <input type="checkbox" name="activities" value="Beach"> Beach<br>
        <input type="checkbox" name="activities" value="City Tour"> City Tour<br>
        Desired Climate: 
        <select name="climate">
            <option value="Tropical">Tropical</option>
            <option value="Temperate">Temperate</option>
            <option value="Arid">Arid</option>
        </select><br>
        <input type="submit" value="Get Recommendations">
    </form>
</body>
</html>
