<!DOCTYPE html>
<html>
<head>
    <title>Preferences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Travel Preferences</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Budget ($)</label>
                <input type="range" class="form-range" min="500" max="5000" step="100" name="budget" id="budgetSlider" oninput="updateBudgetValue()">
                <p>Selected Budget: $<span id="budgetValue">1000</span></p>
            </div>
            <div class="mb-3">
                <label class="form-label">Activities</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="activities" value="beach" id="beach">
                    <label class="form-check-label" for="beach">Beach</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="activities" value="hiking" id="hiking">
                    <label class="form-check-label" for="hiking">Hiking</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="activities" value="city" id="city">
                    <label class="form-check-label" for="city">City</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="activities" value="shopping" id="shopping">
                    <label class="form-check-label" for="shopping">Shopping</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Preferred Climate</label>
                <select class="form-select" name="climate">
                    <option value="tropical">Tropical</option>
                    <option value="temperate">Temperate</option>
                    <option value="cold">Cold</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Get Recommendations</button>
        </form>
    </div>
    <script>
        function updateBudgetValue() {
            document.getElementById('budgetValue').textContent = document.getElementById('budgetSlider').value;
        }
    </script>
</body>
</html>
