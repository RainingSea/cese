<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Preferences</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Travel Preferences</h2>
        <form method="POST" action="/preferences">
            <div class="form-group">
                <label for="budget">Budget:</label>
                <input type="text" class="form-control" id="budget" name="budget" required>
            </div>
            <div class="form-group">
                <label for="activities">Activities:</label>
                <input type="text" class="form-control" id="activities" name="activities" required>
            </div>
            <div class="form-group">
                <label for="climate">Preferred Climate:</label>
                <input type="text" class="form-control" id="climate" name="climate" required>
            </div>
            <button type="submit" class="btn btn-primary">Get Recommendations</button>
        </form>
    </div>
</body>
</html>
