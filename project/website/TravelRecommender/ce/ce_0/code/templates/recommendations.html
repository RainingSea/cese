<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
</head>
<body>
    <h1>Travel Recommendations</h1>
    <form action="/recommendations" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>
        <label for="budget">Budget:</label>
        <input type="number" id="budget" name="budget" required><br>
        <label for="activities">Activities (comma separated):</label>
        <input type="text" id="activities" name="activities" required><br>
        <label for="climate">Preferred Climate:</label>
        <input type="text" id="climate" name="climate" required><br>
        <input type="submit" value="Get Recommendations">
    </form>

    <h2>Your Recommendations:</h2>
    <ul>
        {% for destination in recommendations %}
            <li>{{ destination.name }} - Activities: {{ destination.activities | join(', ') }} - Climate: {{ destination.climate }} - Cost: ${{ destination.cost }}</li>
        {% endfor %}
    </ul>
</body>
</html>
