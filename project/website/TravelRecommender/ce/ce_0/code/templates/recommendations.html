<!DOCTYPE html>
<html>
<head>
    <title>Recommendations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Recommended Destinations</h2>
        <div class="row">
            {% for dest in recommendations %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ dest.name }}</h5>
                        <p class="card-text">{{ dest.description }}</p>
                        <p class="card-text"><strong>Cost:</strong> ${{ dest.cost }}</p>
                        <p class="card-text"><strong>Climate:</strong> {{ dest.climate }}</p>
                        <p class="card-text"><strong>Activities:</strong> {{ ', '.join(dest.activities) }}</p>
                        <a href="{{ url_for('save_favorite', destination=dest.name) }}" class="btn btn-primary">Save to Favorites</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <a href="{{ url_for('preferences') }}" class="btn btn-secondary">Update Preferences</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
