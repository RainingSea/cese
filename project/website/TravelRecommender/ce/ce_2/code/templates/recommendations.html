<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recommendations</title>
</head>
<body>
    <h1>Your Travel Recommendations</h1>
    <ul>
        {% for recommendation in recommendations %}
            <li>{{ recommendation.name }} - Budget: {{ recommendation.budget }} - Climate: {{ recommendation.climate }}</li>
        {% endfor %}
    </ul>
    <a href="/preferences">Back to Preferences</a>
</body>
</html>
