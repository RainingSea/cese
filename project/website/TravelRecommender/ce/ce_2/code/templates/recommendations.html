<!DOCTYPE html>
<html>
<head>
    <title>Recommendations</title>
</head>
<body>
    <h1>Travel Recommendations</h1>
    <nav>
        <a href="{{ url_for('recommendations') }}">Home</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
    
    <div class="recommendations">
        {% for dest in recommendations %}
        <div class="destination-card">
            <h2>{{ dest.name }}</h2>
            <p><strong>Activities:</strong> {{ ', '.join(dest.activities) }}</p>
            <p><strong>Climate:</strong> {{ dest.climate }}</p>
            <p><strong>Budget:</strong> ${{ dest.min_budget }} - ${{ dest.max_budget }}</p>
            <p>{{ dest.description }}</p>
            <button>Add to Favorites</button>
        </div>
        <hr>
        {% endfor %}
    </div>
</body>
</html>
