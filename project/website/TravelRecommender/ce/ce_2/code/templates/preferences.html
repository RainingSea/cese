<!DOCTYPE html>
<html>
<head>
    <title>Preferences</title>
</head>
<body>
    <h2>Travel Preferences</h2>
    <form method="POST" action="/preferences">
        <label for="budget">Budget:</label>
        <input type="number" name="budget" required>
        <br>
        <label for="activities">Activities:</label>
        <input type="checkbox" name="activities" value="Sightseeing">Sightseeing
        <input type="checkbox" name="activities" value="Hiking">Hiking
        <input type="checkbox" name="activities" value="Beach">Beach
        <br>
        <label for="climate">Preferred Climate:</label>
        <input type="text" name="climate" required>
        <br>
        <input type="submit" value="Save Preferences">
    </form>
</body>
</html>
