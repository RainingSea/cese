<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Preferences</title>
</head>
<body>
    <h1>Travel Preferences</h1>
    <form action="/preferences" method="post">
        <label for="budget">Budget:</label>
        <input type="number" id="budget" name="budget" required>
        <label for="activities">Preferred Activities:</label>
        <input type="checkbox" name="activities" value="hiking"> Hiking
        <input type="checkbox" name="activities" value="beach"> Beach
        <input type="checkbox" name="activities" value="city"> City
        <label for="climate">Desired Climate:</label>
        <select id="climate" name="climate">
            <option value="tropical">Tropical</option>
            <option value="temperate">Temperate</option>
            <option value="arctic">Arctic</option>
        </select>
        <button type="submit">Get Recommendations</button>
    </form>
</body>
</html>
