<!DOCTYPE html>
<html>
<head>
    <title>Destination Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ destination.name }}</h2>
            <div>
                <a href="{{ url_for('recommendations') }}" class="btn btn-outline-primary me-2">Back to Recommendations</a>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Logout</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ destination.name }}</h5>
                <p class="card-text">
                    <strong>Climate:</strong> {{ destination.climate }}<br>
                    <strong>Budget:</strong> ${{ destination.min_budget }} - ${{ destination.max_budget }}<br>
                    <strong>Activities:</strong> {{ destination.activities|join(', ') }}
                </p>
                <p>{{ destination.description }}</p>
                <a href="{{ url_for('add_favorite', destination=destination.name) }}" class="btn btn-primary">Save to Favorites</a>
            </div>
        </div>
    </div>
</body>
</html>
