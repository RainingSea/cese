<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Travel Recommendations</title>
</head>
<body>
    <h1>Your Travel Recommendations</h1>
    <ul>
        {% for destination in recommendations %}
            <li>
                {{ destination }}
                <form method="POST" action="/favorites" style="display:inline;">
                    <input type="hidden" name="destination" value="{{ destination }}">
                    <button type="submit">Save</button>
                </form>
            </li>
        {% else %}
            <li>No recommendations found.</li>
        {% endfor %}
    </ul>
    <a href="/preferences">Back to Preferences</a>
    <a href="/logout">Logout</a>
</body>
</html>
