<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
</head>
<body>
    <h1>Your Travel Recommendations</h1>
    <ul>
        {% for recommendation in recommendations %}
            <li><a href="/details/{{ recommendation.name }}">{{ recommendation.name }}</a> - {{ recommendation.climate }} - ${{ recommendation.cost }}</li>
        {% endfor %}
    </ul>
    <a href="/favorites">View Favorites</a>
    <a href="/">Back to Login</a>
</body>
</html>
