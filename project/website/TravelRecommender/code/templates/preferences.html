<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Preferences</title>
</head>
<body>
    <h1>Input Travel Preferences</h1>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/preferences">
        <label for="budget">Budget:</label>
        <input type="number" name="budget" step="0.01" required>
        <label for="activities">Activities:</label>
        <select name="activities" multiple required>
            <option value="beach">Beach</option>
            <option value="hiking">Hiking</option>
            <option value="cultural">Cultural</option>
        </select>
        <label for="climate">Preferred Climate:</label>
        <input type="text" name="climate" required>
        <button type="submit">Submit Preferences</button>
    </form>
    <a href="/">Back to Login</a>
</body>
</html>
