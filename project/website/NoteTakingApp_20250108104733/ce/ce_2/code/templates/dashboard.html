<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <p><a href="/add_note">Add Note</a></p>
    <p><a href="/search_note">Search Note</a></p>
    <p><a href="/logout">Logout</a></p>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li>
                <a href="/view_note/{{ note[0] }}">{{ note[0] }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
