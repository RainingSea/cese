<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>
</head>
<body>
    <h1>View Note</h1>
    <h2>{{ note[0] }}</h2>
    <p>{{ note[1] }}</p>
    <form action="/view_note/{{ note[0] }}" method="post">
        <label for="content">Edit Content:</label>
        <textarea id="content" name="content" required>{{ note[1] }}</textarea>
        <br>
        <button type="submit">Save Changes</button>
    </form>
    <p><a href="/dashboard">Back to Dashboard</a></p>
</body>
</html>
