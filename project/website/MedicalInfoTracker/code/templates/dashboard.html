<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <h3>Your Medical Information</h3>
    <form method="POST">
        <input type="text" name="medical_info" placeholder="Add Medical Info" required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for info in medical_info %}
            <li>{{ info }}</li>
        {% endfor %}
    </ul>
    
    <h3>Your Appointments</h3>
    <form method="POST" action="/set_appointment">
        <input type="text" name="appointment" placeholder="Add Appointment" required>
        <button type="submit">Set Appointment</button>
    </form>
    <ul>
        {% for appointment in appointments %}
            <li>{{ appointment }}</li>
        {% endfor %}
    </ul>
    
    <a href="/logout">Logout</a>
</body>
</html>
