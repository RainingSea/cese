<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Information</title>
</head>
<body>
    <h1>Medical Information</h1>
    <form method="POST">
        <label for="diagnosis">Diagnosis:</label>
        <input type="text" id="diagnosis" name="diagnosis" required>
        <br>
        <label for="medication">Medication:</label>
        <input type="text" id="medication" name="medication" required>
        <br>
        <label for="treatment">Treatment:</label>
        <input type="text" id="treatment" name="treatment" required>
        <br>
        <button type="submit">Add Info</button>
    </form>
    <h2>Your Medical Information</h2>
    <ul>
        {% for info in info %}
            <li>Diagnosis: {{ info[0] }}, Medication: {{ info[1] }}, Treatment: {{ info[2] }}</li>
        {% endfor %}
    </ul>
    <a href="/reminders">View Reminders</a>
</body>
</html>
