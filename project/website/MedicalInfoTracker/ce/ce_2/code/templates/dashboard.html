<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST">
            <h3>Add Medical Information</h3>
            <div class="form-group">
                <label for="diagnoses">Diagnoses:</label>
                <input type="text" class="form-control" id="diagnoses" name="diagnoses" required>
            </div>
            <div class="form-group">
                <label for="medications">Medications:</label>
                <input type="text" class="form-control" id="medications" name="medications" required>
            </div>
            <div class="form-group">
                <label for="treatments">Treatments:</label>
                <input type="text" class="form-control" id="treatments" name="treatments" required>
            </div>
            <button type="submit" name="add_medical_info" class="btn btn-primary">Add Medical Info</button>
        </form>
        <form method="POST">
            <h3>Set Appointment</h3>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="time">Time:</label>
                <input type="time" class="form-control" id="time" name="time" required>
            </div>
            <button type="submit" name="set_appointment" class="btn btn-primary">Set Appointment</button>
        </form>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
