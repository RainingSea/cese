<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome, {{ username }}</h1>
    <h2>Your Medical Information</h2>
    <form method="POST" action="/add_medical_info">
        <label for="info">Medical Info (JSON format):</label>
        <textarea id="info" name="info" required></textarea>
        <br>
        <button type="submit">Add Medical Info</button>
    </form>
    <h2>Your Appointments</h2>
    <form method="POST" action="/set_appointment">
        <label for="appointment">Appointment (JSON format):</label>
        <textarea id="appointment" name="appointment" required></textarea>
        <br>
        <button type="submit">Set Appointment</button>
    </form>
</body>
</html>
