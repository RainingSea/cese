<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Manage Medical Information</h2>
    <form method="POST">
        <label for="diagnosis">Diagnosis:</label>
        <input type="text" id="diagnosis" name="diagnosis">
        <button type="submit">Add Diagnosis</button>
    </form>
    <form method="POST">
        <label for="medication">Medication:</label>
        <input type="text" id="medication" name="medication">
        <button type="submit">Add Medication</button>
    </form>
    <form method="POST">
        <label for="treatment">Treatment:</label>
        <input type="text" id="treatment" name="treatment">
        <button type="submit">Add Treatment</button>
    </form>
    <h2>Set Appointment</h2>
    <form method="POST">
        <label for="date_time">Date and Time:</label>
        <input type="text" id="date_time" name="date_time">
        <label for="description">Description:</label>
        <input type="text" id="description" name="description">
        <button type="submit">Set Appointment</button>
    </form>
</body>
</html>
