<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Welcome to the Dashboard</h2>
    <h3>Your Medical Information</h3>
    <ul>
        {% for info in medical_info %}
            <li>{{ info }}</li>
        {% endfor %}
    </ul>

    <h3>Add Medical Information</h3>
    <form action="/dashboard" method="post">
        <label for="diagnosis">Diagnosis:</label>
        <input type="text" id="diagnosis" name="diagnosis">
        <button type="submit">Add Diagnosis</button>
        <br>
        <label for="medication">Medication:</label>
        <input type="text" id="medication" name="medication">
        <button type="submit">Add Medication</button>
        <br>
        <label for="treatment">Treatment:</label>
        <input type="text" id="treatment" name="treatment">
        <button type="submit">Add Treatment</button>
        <br>
        <label for="reminder_date">Reminder Date:</label>
        <input type="date" id="reminder_date" name="reminder_date">
        <label for="reminder_time">Reminder Time:</label>
        <input type="time" id="reminder_time" name="reminder_time">
        <button type="submit">Set Reminder</button>
    </form>

    <h3>Your Appointment Reminders</h3>
    <ul>
        {% for reminder in reminders %}
            <li>{{ reminder }}</li>
        {% endfor %}
    </ul>

    <a href="/logout">Logout</a>
</body>
</html>
