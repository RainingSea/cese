<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>User Profile</title>
</head>
<body>
    <h1>Manage Your Profile</h1>
    <form method="POST">
        <label for="preferences">Select your preferences:</label><br>
        <input type="checkbox" name="preferences" value="Technology" {% if 'Technology' in preferences %}checked{% endif %}> Technology<br>
        <input type="checkbox" name="preferences" value="Health" {% if 'Health' in preferences %}checked{% endif %}> Health<br>
        <input type="checkbox" name="preferences" value="Sports" {% if 'Sports' in preferences %}checked{% endif %}> Sports<br>
        <input type="submit" value="Update Preferences">
    </form>
    <a href="/">Back to Home</a>
</body>
</html>
