<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>
    <h1>Manage Your Profile</h1>
    <form method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="topics">Topics of Interest:</label>
        <input type="text" id="topics" name="topics" placeholder="e.g., technology, health">
        <br>
        <label for="sources">Preferred Sources:</label>
        <input type="text" id="sources" name="sources" placeholder="e.g., source1, source2">
        <br>
        <button type="submit">Save Profile</button>
    </form>
</body>
</html>
