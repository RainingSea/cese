<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share {{ article.title }}</title>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
    </nav>
    <h1>Share {{ article.title }}</h1>
    <p>Share this article through your preferred platform.</p>
    <a href="https://twitter.com/intent/tweet?text={{ article.title }}&url={{ url_for('article', article_id=article.id, _external=True) }}">Share on Twitter</a>
    <a href="mailto:?subject={{ article.title }}&body={{ url_for('article', article_id=article.id, _external=True) }}">Share via Email</a>
    <a href="/">Back to Articles</a>
</body>
</html>
