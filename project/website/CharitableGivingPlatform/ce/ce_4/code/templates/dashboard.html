<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Available Charities</h1>
    <ul>
        {% for charity in charities %}
            <li>
                {{ charity.name }} - {{ charity.mission }}
                <a href="/charity/{{ charity.name }}">Details</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
