<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ charity.name }}</title>
</head>
<body>
    <h1>{{ charity.name }}</h1>
    <p>Mission: {{ charity.mission }}</p>
    <h2>Projects:</h2>
    <ul>
        {% for project in charity.projects %}
            <li>{{ project }}</li>
        {% endfor %}
    </ul>
    <form method="POST">
        <input type="number" name="amount" placeholder="Donation Amount" required>
        <button type="submit">Donate</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
