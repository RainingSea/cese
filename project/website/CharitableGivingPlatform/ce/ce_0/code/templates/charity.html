<!DOCTYPE html>
<html>
<head>
    <title>{{ charity.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="mb-4">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="card-title">{{ charity.name }}</h2>
            <h5 class="card-subtitle mb-3 text-muted">Mission</h5>
            <p class="card-text">{{ charity.mission }}</p>
            <h5 class="card-subtitle mb-3 text-muted">Projects</h5>
            <p class="card-text">{{ charity.projects }}</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Make a Donation</h4>
            <form method="POST">
                <div class="mb-3">
                    <label for="amount" class="form-label">Amount ($)</label>
                    <input type="number" step="0.01" min="1" class="form-control" id="amount" name="amount" required>
                </div>
                <button type="submit" class="btn btn-primary">Donate</button>
            </form>
        </div>
    </div>
</body>
</html>
