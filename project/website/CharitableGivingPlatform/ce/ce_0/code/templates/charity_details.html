<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Charity Details</title>
</head>
<body>
    <div class="container">
        <h2>{{ charity.name }}</h2>
        <p>Mission: {{ charity.mission }}</p>
        <p>Projects: {{ charity.projects }}</p>
        <form action="/charity/{{ charity.name }}" method="post">
            <div class="form-group">
                <label for="amount">Donation Amount:</label>
                <input type="number" class="form-control" id="amount" name="amount" required>
            </div>
            <input type="hidden" name="username" value="current_user"> <!-- Replace with actual logged-in user -->
            <button type="submit" class="btn btn-primary">Donate</button>
        </form>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</body>
</html>
