<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ charity.name }}</title>
</head>
<body>
    <h1>{{ charity.name }}</h1>
    <p>Mission: {{ charity.mission }}</p>
    <h2>Projects</h2>
    <ul>
        {% for project in charity.projects %}
            <li>{{ project }}</li>
        {% endfor %}
    </ul>
    <h2>Donate</h2>
    <form method="POST" action="/donate">
        <input type="hidden" name="charity_name" value="{{ charity.name }}">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" required>
        <button type="submit">Donate</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
