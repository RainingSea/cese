<!doctype html>
<html>
<head>
    <title>Charity Details</title>
</head>
<body>
    <h2>{{ charity.name }}</h2>
    <p>Mission: {{ charity.mission }}</p>
    <p>Ongoing Projects: {{ charity.projects | join(', ') }}</p>
    <form method="POST" action="/donate">
        <input type="hidden" name="charity_name" value="{{ charity.name }}">
        Amount: <input type="number" name="amount" required>
        <button type="submit">Donate</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
