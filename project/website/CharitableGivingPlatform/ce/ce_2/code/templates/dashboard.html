<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Charities</h2>
    <ul>
        {% for charity in charities %}
            <li><a href="/charity/{{ charity.name }}">{{ charity.name }}</a></li>
        {% endfor %}
    </ul>
    <h2>Your Donations</h2>
    <ul>
        {% for donation in donations %}
            <li>{{ donation.charity_name }}: ${{ donation.amount }}</li>
        {% endfor %}
    </ul>
</body>
</html>
