<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome to the Dashboard</h1>
    <h2>Your Contributions:</h2>
    <ul>
        {% for donation in donations %}
            <li>{{ donation.username }} donated {{ donation.amount }} to {{ donation.charity_name }}</li>
        {% endfor %}
    </ul>
    <h2>Available Charities:</h2>
    <ul>
        {% for charity in charities %}
            <li><a href="{{ url_for('charity_details', charity_name=charity.name) }}">{{ charity.name }}</a></li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
