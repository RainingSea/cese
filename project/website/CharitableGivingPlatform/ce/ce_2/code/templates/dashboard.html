<!doctype html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <h3>Available Charities</h3>
    <ul>
        {% for charity in charities %}
            <li>
                {{ charity }} <a href="/charity/{{ charity }}">Details</a>
            </li>
        {% endfor %}
    </ul>
    <h3>Your Contributions</h3>
    <ul>
        {% for charity, amount in contributions %}
            <li>{{ charity }}: ${{ amount }}</li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
