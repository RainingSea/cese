<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Charities</h1>
    <ul>
        {% for charity in charities %}
        <li>
            {{ charity.name }} <a href="/charity/{{ charity.id }}">Details</a>
        </li>
        {% endfor %}
    </ul>
    <form action="/logout" method="post">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
