<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Charity Dashboard</h1>
    <ul>
        {% for charity in charities %}
            <li>
                {{ charity.name }} - {{ charity.mission }}
                <a href="{{ url_for('charity_details', charity_id=charity.id) }}">Details</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
