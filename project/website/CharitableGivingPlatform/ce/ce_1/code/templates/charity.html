<!DOCTYPE html>
<html>
<head>
    <title>{{ charity.name }}</title>
</head>
<body>
    <h1>{{ charity.name }}</h1>
    <p><strong>Mission:</strong> {{ charity.mission }}</p>
    <p><strong>Projects:</strong> {{ charity.projects }}</p>
    
    <h2>Make a Donation</h2>
    <form method="POST" action="{{ url_for('donate', username=username) }}">
        <input type="hidden" name="charity_id" value="{{ charity.id }}">
        <label>Amount:</label>
        <input type="number" name="amount" min="1" step="0.01" required><br>
        <button type="submit">Donate</button>
    </form>

    <a href="{{ url_for('dashboard', username=username) }}">Back to Dashboard</a>
</body>
</html>
