<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ charity.name }}</title>
</head>
<body>
    <h1>{{ charity.name }}</h1>
    <p>Mission: {{ charity.mission }}</p>
    <p>Ongoing Projects: {{ charity.ongoing_projects }}</p>
    <form method="POST" action="{{ url_for('donate', charity_id=charity.id) }}">
        <label for="amount">Donation Amount:</label>
        <input type="number" name="amount" required>
        <button type="submit">Donate</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
