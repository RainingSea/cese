<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Details</title>
</head>
<body>
    <h2>Charity Details</h2>
    <h3 id="charity-name"></h3>

    </form>

</html>
