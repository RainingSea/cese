<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Contribution History</title>
</head>
<body>
    <h1>Your Contribution History</h1>
    <ul>
        {% for donation in donations %}
            <li>{{ donation.charity_name }}: ${{ donation.amount }} on {{ donation.date }}</li>
        {% else %}
            <li>No contributions made yet.</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
