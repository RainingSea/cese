<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Charities</h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <ul>
        {% for charity in charities %}
            <li>
                <a href="/charity/{{ charity.name }}">{{ charity.name }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
    <a href="/view_contribution_history">View Contribution History</a>
</body>
</html>
