<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Welcome, {{ username }}!</h2>
    <h3>Available Charities</h3>
    <ul>
        {% for charity in charities %}
            <li>
                {{ charity.name }} - {{ charity.mission }}
                <a href="{{ url_for('charity_details', charity_name=charity.name) }}">Details</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/">Logout</a>
</body>
</html>
