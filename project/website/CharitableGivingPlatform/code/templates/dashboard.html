<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Available Charities</h1>
    <ul>
        {% for charity in charities %}
            <li>
                {{ charity.name }} - <a href="/charity/{{ charity.name }}">Details</a>
            </li>
        {% endfor %}
    </ul>
    <h2>Your Donations</h2>
    <ul>
        {% for charity, amount in contributions %}
            <li>
                You donated {{ amount }} to {{ charity }}
            </li>
        {% endfor %}
    </ul>
    <p><a href="/logout">Logout</a></p>
</body>
</html>
