<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Upcoming Events</h1>
    <ul>
        {% for event in events %}
            <li>
                {{ event[0] }} - <a href="/event/{{ loop.index0 }}">Details</a>
                <form method="POST" action="/set_reminder/{{ loop.index0 }}">
                    <button type="submit">Set Reminder</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/reminders">View Reminders</a>
</body>
</html>
