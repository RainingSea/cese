<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Upcoming Events</h1>
    <ul>
        {% for event in events %}
            <li><a href="/event/{{ event.title }}">{{ event.title }}</a> - {{ event.date }}</li>
        {% endfor %}
    </ul>
    <a href="/reminders">View Reminders</a>
</body>
</html>
