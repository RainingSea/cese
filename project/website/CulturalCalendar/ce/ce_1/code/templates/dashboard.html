<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>Upcoming Cultural Events</h2>
    <ul>
        {% for event in events %}
            <li>
                <a href="{{ url_for('event_details', event_name=event.name) }}">{{ event.name }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/reminders" class="btn btn-secondary">View Reminders</a>
</div>
</body>
</html>
