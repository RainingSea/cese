<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <header>
        <h1>Welcome, {{ username }}!</h1>
        <a href="{{ url_for('logout') }}">Logout</a>
        <a href="{{ url_for('reminders') }}">My Reminders</a>
    </header>
    <form action="{{ url_for('search') }}" method="GET">
        <input type="text" name="q" placeholder="Search events..." value="{{ search_query if search_query else '' }}">
        <button type="submit">Search</button>
    </form>
    <h2>Events</h2>
    <ul>
        {% for event in events %}
            <li>
                <a href="{{ url_for('event', event_id=event.id) }}">{{ event.title }}</a>
                ({{ event.date }} at {{ event.location }})
            </li>
        {% endfor %}
    </ul>
</body>
</html>
