<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Upcoming Events</h1>
    <ul>
        {% for event in events %}
            <li>
                <a href="/event/{{ event.event_name }}">{{ event.event_name }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/reminders">My Reminders</a>
</body>
</html>
