<!DOCTYPE html>
<html>
<head>
    <title>My Reminders</title>
</head>
<body>
    <header>
        <h1>Welcome, {{ username }}!</h1>
        <a href="{{ url_for('logout') }}">Logout</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </header>
    <h1>My Reminders</h1>
    <ul>
        {% for event in events %}
            <li>
                <a href="{{ url_for('event', event_id=event.id) }}">{{ event.title }}</a>
                ({{ event.date }} at {{ event.location }})
                <a href="{{ url_for('delete_reminder', event_id=event.id) }}" style="color:red">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
