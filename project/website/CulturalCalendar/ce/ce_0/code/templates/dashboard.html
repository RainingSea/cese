<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Upcoming Cultural Events</h1>
    <ul>
        {% for event in events %}
            <li><a href="{{ url_for('event_details', event_id=event.id) }}">{{ event.title }}</a> - {{ event.date }}</li>
        {% endfor %}
    </ul>
    <p><a href="/reminders">Manage Reminders</a></p>
</body>
</html>
