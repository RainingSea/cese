<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Upcoming Cultural Events</h2>
        <ul class="list-group">
            {% for event in events %}
                <li class="list-group-item">
                    <a href="{{ url_for('event_details', title=event.title) }}">{{ event.title }}</a>
                </li>
            {% endfor %}
        </ul>
        <a href="/reminders" class="btn btn-secondary">View Reminders</a>
    </div>
</body>
</html>
