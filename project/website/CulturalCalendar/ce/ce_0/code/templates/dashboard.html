<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Upcoming Events</h2>
    <ul>
        {% for event in events %}
            <li>
                <a href="{{ url_for('event_details', event_id=event['name']) }}">{{ event['name'] }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('reminders') }}">View Reminders</a>
</body>
</html>
