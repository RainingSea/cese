<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details</title>
</head>
<body>
    <h1>{{ event['name'] }}</h1>
    <p>Significance: {{ event['significance'] }}</p>
    <p>History: {{ event['history'] }}</p>
    <p>Location: {{ event['location'] }}</p>
    <form action="{{ url_for('set_reminder', event_id=event['name']) }}" method="post">
        <button type="submit">Set Reminder</button>
    </form>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
