<!DOCTYPE html>
<html>
<head>
    <title>{{ event.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .event-details { margin-bottom: 20px; }
        .event-details h1 { margin-top: 0; }
        .event-details .date { color: #666; font-size: 0.9em; }
        .event-details .description { margin: 15px 0; }
        .back-link { display: block; margin-bottom: 20px; }
        .reminder-btn { padding: 10px 15px; background: {% if has_reminder %}red{% else %}#4CAF50{% endif %}; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <a href="{{ url_for('dashboard') }}" class="back-link">← Back to Dashboard</a>
    
    <div class="event-details">
        <h1>{{ event.name }}</h1>
        <div class="date">{{ event.date }}</div>
        <div class="location"><strong>Location:</strong> {{ event.location }}</div>
        <div class="category"><strong>Category:</strong> {{ event.category }}</div>
        <div class="description">{{ event.description }}</div>
        
        {% if has_reminder %}
        <a href="{{ url_for('delete_reminder', event_id=event.id) }}" class="reminder-btn">Remove Reminder</a>
        {% else %}
        <a href="{{ url_for('add_reminder', event_id=event.id) }}" class="reminder-btn">Set Reminder</a>
        {% endif %}
    </div>
</body>
</html>
