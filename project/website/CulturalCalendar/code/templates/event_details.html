<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Event Details</title>
</head>
<body>
    <div class="container">
        <h2>{{ event.title }}</h2>
        <p>Date: {{ event.date }}</p>
        <p>Description: {{ event.description }}</p>
        <form method="POST" action="{{ url_for('reminders_page') }}">
            <input type="hidden" name="event_title" value="{{ event.title }}">
            <div class="form-group">
                <label for="reminder_date">Set Reminder Date</label>
                <input type="date" class="form-control" id="reminder_date" name="reminder_date" required>
            </div>
            <button type="submit" class="btn btn-primary">Set Reminder</button>
        </form>
    </div>
</body>
</html>
