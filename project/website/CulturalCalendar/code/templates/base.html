<!DOCTYPE html>
<html>
<head>
    <title>Event Reminder App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: white; padding: 10px 20px; }
        header a { color: white; text-decoration: none; margin-left: 10px; }
        .container { padding: 20px; }
        .error { color: red; }
        .event { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
        .event h3 { margin-top: 0; }
    </style>
</head>
<body>
    <header>
        {% if 'username' in session %}
            <span>Welcome, {{ username }}</span>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('reminders') }}">My Reminders</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
