{% extends "base.html" %}

{% block content %}
    <h1>Search Books</h1>
    
    <form method="POST" action="{{ url_for('search') }}">
        <div>
            <label>Search:</label>
            <input type="text" name="query" required>
        </div>
        <button type="submit">Search</button>
    </form>
    
    {% if results %}
    <h2>Search Results</h2>
    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
        </tr>
        {% for book in results %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.isbn }}</td>
        </tr>
        {% endfor %}
    </table>
    {% endif %}
{% endblock %}
