{% extends "base.html" %}

{% block content %}
    <h1>Book Management</h1>
    
    <h2>Add New Book</h2>
    <form method="POST" action="{{ url_for('books') }}">
        <div>
            <label>Title:</label>
            <input type="text" name="title" required>
        </div>
        <div>
            <label>Author:</label>
            <input type="text" name="author" required>
        </div>
        <div>
            <label>ISBN:</label>
            <input type="text" name="isbn" required>
        </div>
        <button type="submit">Add Book</button>
    </form>
    
    <h2>Book List</h2>
    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Action</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.isbn }}</td>
            <td>
                <form method="POST" action="{{ url_for('books') }}">
                    <input type="hidden" name="delete_isbn" value="{{ book.isbn }}">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
