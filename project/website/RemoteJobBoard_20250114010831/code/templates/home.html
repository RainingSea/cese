<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Featured Job Listings</h1>
    <ul>
        {% for job in jobs %}
        <li>{{ job.title }} at {{ job.company }} - {{ job.description }}
            <form action="{{ url_for('apply_job', job_id=loop.index0) }}" method="POST">
                <button type="submit">Apply</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    <a href="/post_job">Post a Job</a>
    <a href="/profile">Profile</a>
    <a href="/browse_jobs">Browse Jobs</a>
    <a href="/logout">Logout</a>
</body>
</html>
