<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Movies</title>
</head>
<body>
    <h1>Search Movies</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Enter movie title" required>
        <button type="submit">Search</button>
    </form>
    <h2>Results:</h2>
    <ul>
        {% for movie in movies %}
            <li><a href="{{ url_for('movie_detail', title=movie) }}">{{ movie }}</a></li>
        {% endfor %}
    </ul>
    <a href="/favorites">My Favorites</a>
</body>
</html>
