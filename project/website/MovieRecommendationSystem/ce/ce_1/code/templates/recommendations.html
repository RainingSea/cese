<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
</head>
<body>
    <h1>Movie Recommendations</h1>
    <ul>
        {% for movie in movies %}
            <li>{{ movie.title }} - {{ movie.description }} (Rating: {{ movie.rating }})</li>
        {% endfor %}
    </ul>
    <a href="/favorites">View Favorites</a>
    <a href="/">Logout</a>
</body>
</html>
