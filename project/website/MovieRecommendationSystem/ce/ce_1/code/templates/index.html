<!doctype html>
<html>
<head>
    <title>Movie Recommendations</title>
</head>
<body>
    <h1>Movie Recommendations</h1>
    <ul>
        {% for movie in recommendations %}
            <li><a href="{{ url_for('movie_detail', movie_id=movie['id']) }}">{{ movie['title'] }}</a></li>
        {% endfor %}
    </ul>
    <a href="/favorites">View Favorites</a>
</body>
</html>
