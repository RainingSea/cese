<!DOCTYPE html>
<html>
<head>
    <title>Movie App</title>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/search">Search</a>
        <a href="/favorites">Favorites</a>
        {% if current_user %}
            <span>Welcome, {{ current_user }}</span>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </nav>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
