{% extends "base.html" %}

{% block content %}
<h1>Your Favorites</h1>
{% if favorites %}
<div class="favorites-list">
    {% for movie in favorites %}
    <div class="favorite">
        <h3><a href="{{ url_for('details', movie_id=movie.id) }}">{{ movie.title }}</a></h3>
        <p>{{ movie.description }}</p>
        <p>Rating: {{ movie.rating }}</p>
        <a href="{{ url_for('remove_favorite', movie_id=movie.id) }}">Remove</a>
    </div>
    {% endfor %}
</div>
{% else %}
<p>You haven't added any favorites yet.</p>
{% endif %}
<a href="{{ url_for('index') }}">Back to Home</a>
{% endblock %}
