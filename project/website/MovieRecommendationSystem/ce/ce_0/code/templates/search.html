{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Search Movies</h2>
<form method="POST" class="mb-4">
    <div class="input-group">
        <input type="text" class="form-control" name="query" placeholder="Search for movies..." required>
        <button class="btn btn-primary" type="submit">Search</button>
    </div>
</form>

{% if results %}
<h3 class="mb-3">Search Results</h3>
<div class="row">
    {% for movie in results %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ movie.title }}</h5>
                <p class="card-text">{{ movie.description[:100] }}...</p>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="badge bg-primary">Rating: {{ movie.rating }}</span>
                    <a href="{{ url_for('movie_details', title=movie.title) }}" class="btn btn-sm btn-outline-primary">Details</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endblock %}
