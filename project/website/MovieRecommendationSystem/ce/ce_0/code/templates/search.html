<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Movies</title>
</head>
<body>
    <h1>Search Movies</h1>
    <form action="/search" method="post">
        <label for="query">Movie Title:</label>
        <input type="text" id="query" name="query" required>
        <br>
        <input type="submit" value="Search">
    </form>
    <div id="results"></div>
</body>
</html>
