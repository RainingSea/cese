{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Your Favorites</h2>
{% if favorites %}
<div class="row">
    {% for movie in favorites %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ movie.title }}</h5>
                <p class="card-text">{{ movie.description[:100] }}...</p>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="badge bg-primary">Rating: {{ movie.rating }}</span>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('movie_details', title=movie.title) }}" class="btn btn-sm btn-outline-primary">Details</a>
                        <a href="{{ url_for('remove_favorite', title=movie.title) }}" class="btn btn-sm btn-outline-danger">Remove</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="alert alert-info">You haven't added any favorites yet.</div>
{% endif %}
{% endblock %}
