{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2 class="card-title">{{ movie.title }}</h2>
        <p class="card-text">{{ movie.description }}</p>
        <p class="card-text"><strong>Rating:</strong> {{ movie.rating }}</p>
        <div class="d-flex gap-2">
            <a href="{{ url_for('home') }}" class="btn btn-secondary">Back</a>
            {% if movie.title in movie_app.get_favorites()|map(attribute='title') %}
                <a href="{{ url_for('remove_favorite', title=movie.title) }}" class="btn btn-danger">Remove Favorite</a>
            {% else %}
                <a href="{{ url_for('add_favorite', title=movie.title) }}" class="btn btn-primary">Add Favorite</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
