{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Recommended Movies</h2>
<div class="row">
    {% for movie in recommendations %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ movie.title }}</h5>
                <p class="card-text">{{ movie.description[:100] }}...</p>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="badge bg-primary">Rating: {{ movie.rating }}</span>
                    <a href="{{ url_for('movie_details', title=movie.title) }}" class="btn btn-sm btn-outline-primary">Details</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
