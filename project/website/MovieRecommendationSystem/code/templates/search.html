<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
</head>
<body>
    <h1>Search Movies</h1>
    <form method="post">
        <input type="text" name="query" placeholder="Search for a movie..." required>
        <button type="submit">Search</button>
    </form>
    <h2>Results:</h2>
    <ul>
        {% for movie in movies %}
            <li><a href="{{ url_for('movie_detail', title=movie) }}">{{ movie }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
