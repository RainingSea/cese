{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2>{{ movie.title }}</h2>
        <p class="lead">Rating: {{ movie.rating }}/5</p>
        <p class="lead">Genres: {{ movie.genres|join(', ') }}</p>
        <p>{{ movie.description }}</p>
        <a href="/add_favorite/{{ movie.id }}" class="btn btn-success">Add to Favorites</a>
        <a href="{{ url_for('favorites') }}" class="btn btn-info">View Favorites</a>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
