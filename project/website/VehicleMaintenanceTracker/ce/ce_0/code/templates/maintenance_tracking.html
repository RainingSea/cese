<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tracking</title>
</head>
<body>
    <h2>Maintenance Tracking</h2>
    <ul>
        {% for task in maintenance %}
            <li>{{ task.task }} on {{ task.date }} for vehicle ID {{ task.vehicle_id }}</li>
        {% endfor %}
    </ul>
    <a href="/reminders">View Reminders</a>
    <a href="/maintenance_history">View Maintenance History</a>
    <a href="/logout">Logout</a>
</body>
</html>
