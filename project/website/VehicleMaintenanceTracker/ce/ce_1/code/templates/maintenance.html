<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tracking</title>
</head>
<body>
    <h1>Maintenance Tracking</h1>
    <form method="POST" action="/maintenance">
        <label for="vehicle_id">Vehicle ID:</label>
        <input type="number" id="vehicle_id" name="vehicle_id" required>
        <br>
        <label for="task">Task:</label>
        <input type="text" id="task" name="task" required>
        <br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <br>
        <label for="mileage">Mileage:</label>
        <input type="number" id="mileage" name="mileage" required>
        <br>
        <button type="submit">Add Maintenance</button>
    </form>
    <h2>Maintenance History</h2>
    <ul>
        {% for record in maintenance_records %}
            <li>Vehicle ID: {{ record[0] }}, Task: {{ record[1] }}, Date: {{ record[2] }}, Mileage: {{ record[3] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
