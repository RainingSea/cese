<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Welcome to the Dashboard</h2>
    <nav>
        <a href="/vehicle_management">Vehicle Management</a>
        <a href="/maintenance_tracking">Maintenance Tracking</a>
        <a href="/logout">Logout</a>
    </nav>
    <h3>Your Vehicles</h3>
    <ul>
        {% for vehicle in vehicles %}
            <li>{{ vehicle[0] }} {{ vehicle[1] }} ({{ vehicle[2] }}) - Mileage: {{ vehicle[3] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
