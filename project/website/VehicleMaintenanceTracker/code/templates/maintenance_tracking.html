<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tracking</title>
</head>
<body>
    <h2>Maintenance Tracking</h2>
    <form method="POST" action="/maintenance_tracking">
        <label for="vehicle_id">Vehicle ID:</label>
        <input type="number" id="vehicle_id" name="vehicle_id" required>
        <label for="task">Task:</label>
        <input type="text" id="task" name="task" required>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <button type="submit">Add Maintenance</button>
    </form>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <h3>Maintenance Records</h3>
    <ul>
        {% for record in records %}
            <li>Vehicle ID: {{ record[0] }} - Task: {{ record[1] }} on {{ record[2] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
