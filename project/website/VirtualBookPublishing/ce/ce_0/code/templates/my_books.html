<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Books</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>My Books</h2>
        <ul>
            {% for book in books %}
                <li>
                    {{ book.title }} by {{ book.author }} 
                    <a href="{{ url_for('book_details', title=book.title) }}">View</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
