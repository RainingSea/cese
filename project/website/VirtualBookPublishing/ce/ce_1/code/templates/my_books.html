<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Books</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>My Books</h2>
    <ul class="list-group">
        {% for title, author in books %}
        <li class="list-group-item">
            {{ title }} by {{ author }}
            <a href="{{ url_for('book_details', title=title) }}" class="btn btn-info btn-sm float-right">View</a>
        </li>
        {% endfor %}
    </ul>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
</body>
</html>
