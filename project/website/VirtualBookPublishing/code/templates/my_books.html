<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books</title>
</head>
<body>
    <h1>My Books</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% else %}
        <ul>
            {% for book in books %}
                <li><a href="{{ url_for('book_details', title=book.title) }}">{{ book.title }}</a> by {{ book.author }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    <p><a href="/dashboard">Back to Dashboard</a></p>
</body>
</html>
