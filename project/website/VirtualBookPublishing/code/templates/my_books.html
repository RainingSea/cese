<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books</title>
</head>
<body>
    <h1>My Books</h1>
    <ul>
        {% for book in books %}
            <li>
                {{ book.title }} by {{ book.author }} 
                <a href="{{ url_for('book_details', title=book.title) }}">View</a>
            </li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('create_book') }}">Create New Book</a></p>
</body>
</html>
