<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog Page</title>
</head>
<body>
    <h1>Welcome to Your Blog</h1>
    <a href="/logout">Logout</a>
    <h2>Your Posts</h2>
    <ul>
        {% for post in posts %}
            <li>{{ post.title }} - <a href="/view/{{ post.post_id }}">View</a> - 
            <form action="/delete/{{ post.post_id }}" method="POST" style="display:inline;">
                <button type="submit">Delete</button>
            </form></li>
        {% endfor %}
    </ul>
    <a href="/new_post">Create New Post</a>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
</body>
</html>
