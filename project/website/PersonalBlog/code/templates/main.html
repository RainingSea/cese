<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog Page</title>
</head>
<body>
    <h1>Blog Posts</h1>
    <a href="/new_post">Create New Post</a>
    <ul>
        {% for post in posts %}
            <li><a href="/view_post/{{ loop.index0 }}">{{ post.title }}</a> by {{ post.author }}</li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
