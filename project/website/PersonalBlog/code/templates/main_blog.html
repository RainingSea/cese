<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Blog</title>
</head>
<body>
    <h2>Blog Posts</h2>
    <a href="/new_post">Create New Post</a>
    <a href="/">Logout</a>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ post.post_id }}">{{ post.title }}</a>
                <a href="/edit_post/{{ post.post_id }}">Edit</a>
                <a href="/delete_post/{{ post.post_id }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
