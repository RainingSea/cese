<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog</title>
</head>
<body>
    <h1>Main Blog Page</h1>
    <a href="{{ url_for('new_post') }}">Create New Post</a>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{{ url_for('view_post', title=post.title) }}">{{ post.title }}</a>
                <form action="{{ url_for('delete_post', title=post.title) }}" method="POST" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
