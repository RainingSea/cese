<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Post</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <p>Posted by: {{ post.username }}</p>
    <a href="/edit_post/{{ loop.index0 }}">Edit</a>
    <form method="post" action="/delete_post/{{ loop.index0 }}" style="display:inline;">
        <button type="submit">Delete</button>
    </form>
    <p><a href="/main_blog">Back to Blog</a></p>
</body>
</html>
