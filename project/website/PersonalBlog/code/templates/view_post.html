<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <form action="{{ url_for('delete_post', title=post.title) }}" method="POST">
        <button type="submit">Delete Post</button>
    </form>
    <a href="{{ url_for('edit_post', title=post.title) }}">Edit Post</a>
    <br>
    <a href="{{ url_for('main_blog') }}">Back to Main Blog</a>
</body>
</html>
