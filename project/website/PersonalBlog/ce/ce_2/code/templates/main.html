<!DOCTYPE html>
<html>
<head>
    <title>Main Blog</title>
</head>
<body>
    <h1>Welcome to the Blog</h1>
    <a href="{{ url_for('new_post') }}">Create New Post</a>
    <h2>Your Posts</h2>
    <ul>
        {% for post in posts %}
            <li><a href="{{ url_for('view_post', post_id=post.post_id) }}">{{ post.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('login') }}">Logout</a>
</body>
</html>
