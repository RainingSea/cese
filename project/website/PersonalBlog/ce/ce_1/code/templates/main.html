<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog Page</title>
</head>
<body>
    <h1>Welcome to the Blog</h1>
    <a href="{{ url_for('new_post') }}">Create New Post</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    <h2>Your Posts</h2>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{{ url_for('view_post', post_id=post.post_id) }}">{{ post.title }}</a>
                <a href="{{ url_for('edit_post', post_id=post.post_id) }}">Edit</a>
                <a href="{{ url_for('delete_post', post_id=post.post_id) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
