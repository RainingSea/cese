<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog</title>
</head>
<body>
    <h2>Main Blog</h2>
    <a href="/new_post">Create New Post</a>
    <h3>Blog Posts</h3>
    <ul>
        {% for post in posts %}
        <li>
            <a href="{{ url_for('view_post', post_id=loop.index0) }}">{{ post.title }}</a>
        </li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
