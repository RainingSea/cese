<!DOCTYPE html>
<html>
<head>
    <title>Main Blog</title>
</head>
<body>
    <h2>Your Blog Posts</h2>
    <a href="/new_post">Create New Post</a>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ loop.index0 }}">{{ post[0] }}</a>
                <form method="post" action="/delete_post/{{ loop.index0 }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
