<!DOCTYPE html>
<html>
<head>
    <title>Edit Post</title>
</head>
<body>
    <h2>Edit Post</h2>
    <form method="post">
        <label for="title">Title:</label>
        <input type="text" name="title" value="{{ post[0] }}" required>
        <br>
        <label for="content">Content:</label>
        <textarea name="content" required>{{ post[1] }}</textarea>
        <br>
        <button type="submit">Update</button>
    </form>
</body>
</html>
