<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Main Blog Page</title>
</head>
<body>
    <h1>Welcome to the Blog</h1>
    <a href="/new_post">Create New Post</a>
    <h2>Blog Posts</h2>
    <ul>
        {% for post in posts %}
            <li><a href="{{ url_for('view_post', post_id=loop.index0) }}">{{ post.title }}</a> by {{ post.author }}</li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
