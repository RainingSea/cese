<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Blog</title>
</head>
<body>
    <h1>Main Blog Page</h1>
    <a href="/new_post">Create New Post</a>
    <h2>Blog Posts</h2>
    <ul>
        {% for post in posts.values() %}
            <li><a href="{{ url_for('view_post', title=post.title) }}">{{ post.title }}</a> by {{ post.author }}</li>
        {% endfor %}
    </ul>
</body>
</html>
