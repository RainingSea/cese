<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Blog Page</title>
</head>
<body>
    <h1>Main Blog Page</h1>
    <form method="POST" action="/main">
        <input type="text" name="title" placeholder="Post Title" required>
        <textarea name="content" placeholder="Post Content" required></textarea>
        <button type="submit">Create Post</button>
    </form>
    <h2>Blog Posts</h2>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{{ url_for('view_post', title=post.title) }}">{{ post.title }}</a>
                <form method="POST" action="{{ url_for('delete_post', title=post.title) }}">
                    <button type="submit">Delete</button>
                </form>
                <a href="{{ url_for('edit_post', title=post.title) }}">Edit</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
