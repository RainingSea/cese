<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <p>Author: {{ post.author }}</p>
    <a href="/main">Back to Main</a>
    <form method="POST" action="{{ url_for('delete_post', title=post.title) }}">
        <button type="submit">Delete</button>
    </form>
    <a href="{{ url_for('edit_post', title=post.title) }}">Edit</a>
</body>
</html>
