<!DOCTYPE html>
<html>
<head>
    <title>Main Blog</title>
</head>
<body>
    <h2>Welcome to the Blog</h2>
    <a href="/new_post">Create New Post</a>
    <h3>Your Posts:</h3>
    <ul>
        {% for post in posts %}
            <li><a href="/view_post/{{ post.title }}">{{ post.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
