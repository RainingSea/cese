<!DOCTYPE html>
<html>
<head>
    <title>Edit Post</title>
</head>
<body>
    <h2>Edit Post: {{ post.title }}</h2>
    <form method="post">
        <label for="content">Content:</label>
        <textarea name="content" required>{{ post.content }}</textarea>
        <button type="submit">Update</button>
    </form>
    <a href="/main_blog">Back to Blog</a>
</body>
</html>
