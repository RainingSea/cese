<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Gallery</title>
</head>
<body>
    <h1>Album Gallery</h1>
    <a href="/album/create">Create New Album</a>
    <a href="/logout">Logout</a>
    <div>
        {% for album in albums %}
            <div>
                <h2>{{ album.title }}</h2>
                <p>{{ album.description }}</p>
                <p>Owner: {{ album.owner }}</p>
                <div>
                    {% for image in album.images %}
                        <img src="{{ url_for('static', filename='uploads/' + image) }}" alt="{{ album.title }}" style="width: 100px;">
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
