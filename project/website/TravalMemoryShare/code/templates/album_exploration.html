<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Albums</title>
</head>
<body>
    <h2>Explore Albums</h2>
    <a href="/create_album">Create New Album</a>
    <div>
        {% for album in albums %}
            <div>
                <h3>{{ album.title }}</h3>
                <p>Owner: {{ album.owner }}</p>
                <p>Images: {{ album.images }}</p>
                <p>Private: {{ album.is_private }}</p>
                <form action="/share_album" method="POST">
                    <input type="hidden" name="album_id" value="{{ album.title }}">
                    <label for="shared_with">Share with (comma separated usernames):</label>
                    <input type="text" name="shared_with" required>
                    <button type="submit">Share Album</button>
                </form>
            </div>
        {% endfor %}
    </div>
    <form action="/follow_user" method="POST">
        <label for="followee">Follow User:</label>
        <input type="text" name="followee" required>
        <button type="submit">Follow</button>
    </form>
    <a href="/followers">View Followers</a>
    <a href="/notifications">View Notifications</a>
</body>
</html>
