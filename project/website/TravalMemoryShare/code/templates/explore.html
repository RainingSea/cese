<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Albums</title>
</head>
<body>
    <h2>Explore Albums</h2>
    <div>
        {% for album in albums %}
            <div>
                <h3>{{ album.title }}</h3>
                <p>Owner: {{ album.owner }}</p>
                <p>Images: {{ album.images }}</p>
                <p>Private: {{ album.is_private }}</p>
            </div>
        {% endfor %}
    </div>
    <a href="/albums">Back to Albums</a>
</body>
</html>
