<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
</head>
<body>
    <h2>Your Notifications</h2>

        {% endfor %}
    </div>
    <a href="/albums">Back to Albums</a>
</body>
</html>
