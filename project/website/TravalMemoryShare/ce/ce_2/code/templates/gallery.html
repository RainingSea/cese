<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
</head>
<body>
    <h2>Your Albums</h2>
    <ul>
        {% for album in albums %}
            <li>{{ album.title }}</li>
        {% else %}
            <li>No albums found.</li>
        {% endfor %}
    </ul>
    <a href="/">Logout</a>
</body>
</html>
