<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Albums</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Explore Albums</h2>
        <ul class="list-group">
            {% for album in albums %}
            <li class="list-group-item">{{ album.title }} by {{ album.owner.username }} (Public: {{ album.is_public }})</li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('create_album') }}" class="btn btn-primary">Create New Album</a>
    </div>
</body>
</html>
