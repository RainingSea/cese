<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albums</title>
</head>
<body>
    <h1>Your Albums</h1>
    <ul>
        {% for album in albums %}
            <li>{{ album.title }} - Photos: {{ album.photos }} - Private: {{ album.is_private }}</li>
        {% endfor %}
    </ul>
    <p><a href="/">Logout</a></p>
</body>
</html>
