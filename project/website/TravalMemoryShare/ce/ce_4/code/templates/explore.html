<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explore Albums</title>
</head>
<body>
    <h1>Explore Albums</h1>
    <ul>
        {% for album in albums %}
            <li>
                <h2>{{ album.title }}</h2>
                <p>By: {{ album.user }}</p>
                <p>Privacy: {{ album.privacy }}</p>
                <p>Photos: {{ album.photos | join(', ') }}</p>
            </li>
        {% endfor %}
    </ul>
    <a href="/album_creation">Create Album</a>
    <a href="/logout">Logout</a>
</body>
</html>
