<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>View Album</title>
</head>
<body>
    <div class="container">
        <h2>View Album</h2>
        <p>This page displays the albums created by users.</p>
        <ul>
            {% for album in albums %}
                <li>
                    <strong>{{ album.title }}</strong> by {{ album.owner }}<br>
                    <em>{{ album.description }}</em><br>
                    <strong>Photos:</strong> {{ album.photos | join(', ') }}
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
