<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Albums</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Albums</h2>
        <ul class="list-group">
            {% for album in albums %}
                <li class="list-group-item">
                    <h5>{{ album.title }}</h5>
                    <p>Images: {{ album.images | join(', ') }}</p>
                    <p>Privacy: {{ album.privacy }}</p>
                </li>
            {% endfor %}
        </ul>
        <a href="/album/create" class="btn btn-link">Create New Album</a>
    </div>
</body>
</html>
