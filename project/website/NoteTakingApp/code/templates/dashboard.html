<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li><a href="/view_note/{{ note.split('|')[0] }}">{{ note.split('|')[0] }}</a></li>
        {% else %}
            <li>No notes available. Please add notes!</li>
        {% endfor %}
    </ul>
</body>
</html>
