<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome, {{ session['username'] }}</h1>
    <a href="/add_note">Add Note</a>
    <a href="/search_note">Search Notes</a>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li>
                {{ note[0] }} - <a href="/view_note/{{ note[0] }}">View</a> 
                <a href="/delete_note/{{ note[0] }}">Delete</a>
            </li>
        {% else %}
            <li>No notes available.</li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
