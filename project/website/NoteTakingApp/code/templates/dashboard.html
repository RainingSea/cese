<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Notes</h2>
    <ul>
        {% for title in notes %}
            <li><a href="/view_note/{{ title }}">{{ title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
</body>
</html>
