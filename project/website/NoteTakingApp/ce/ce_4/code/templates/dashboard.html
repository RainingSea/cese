<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Your Notes</h2>
    <a href="/add_note">Add Note</a>
    <ul>
        {% for note in notes %}
            <li><a href="/view_note/{{ note }}">{{ note }}</a></li>
        {% endfor %}
    </ul>
    <a href="/search_note">Search Notes</a>
</body>
</html>
