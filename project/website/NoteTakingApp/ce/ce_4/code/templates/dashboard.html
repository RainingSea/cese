<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Your Notes</h1>
    <a href="/add_note">Add Note</a>
    <ul>
        {% for note in notes %}
            <li>
                {{ note.title }} 
                <a href="/view_note/{{ note.title }}">View</a>
                <form action="/delete_note/{{ note.title }}" method="post" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
