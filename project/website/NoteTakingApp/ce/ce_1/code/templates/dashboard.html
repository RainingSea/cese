<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
    <h3>Your Notes</h3>
    <ul>
        {% for note in notes %}
            <li><a href="/view_note/{{ note[0] }}">{{ note[0] }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
