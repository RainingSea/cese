<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <h3>Your Notes</h3>
    <ul>
        {% for title, content in notes %}
            <li>
                <a href="{{ url_for('view_note', title=title) }}">{{ title }}</a>
                <a href="{{ url_for('edit_note', title=title) }}">Edit</a>
                <a href="{{ url_for('delete_note', title=title) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
</body>
</html>
