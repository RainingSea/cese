<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome to the Dashboard</h1>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li>{{ note.split('|')[0] }} - <a href="/view_note/{{ note.split('|')[0] }}">View</a> - <form action="/delete_note/{{ note.split('|')[0] }}" method="post" style="display:inline;"><button type="submit">Delete</button></form></li>
        {% endfor %}
    </ul>
</body>
</html>
