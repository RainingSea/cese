<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <a href="{{ url_for('logout') }}">Logout</a>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li>{{ note.title }} - <a href="{{ url_for('view_note', note_id=note.id) }}">View</a></li>
        {% else %}
            <li>No notes available.</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('add_note') }}">Add Note</a>
    <a href="{{ url_for('search_note') }}">Search Notes</a>
</body>
</html>
