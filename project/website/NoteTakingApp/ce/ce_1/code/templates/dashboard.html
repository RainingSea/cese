<!doctype html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li><a href="{{ url_for('view_note', title=note[0]) }}">{{ note[0] }}</a></li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
    <a href="/search_note">Search Notes</a>
    <a href="/logout">Logout</a>
</body>
</html>
