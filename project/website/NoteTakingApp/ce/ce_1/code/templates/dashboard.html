<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Your Notes</h2>
    <a href="/add_note">Add Note</a>
    <ul>
        {% for title in notes.keys() %}
            <li>
                <a href="/view_note/{{ title }}">{{ title }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/">Logout</a>
</body>
</html>
