<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
    <h3>Your Notes</h3>
    <ul>
        {% for note in notes %}
            <li>
                <a href="/view_note/{{ loop.index }}">{{ note.title }}</a>
                <form method="POST" action="/delete_note/{{ loop.index }}">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
