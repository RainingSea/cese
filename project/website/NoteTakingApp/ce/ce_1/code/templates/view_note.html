<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Note</title>
</head>
<body>
    <h2>{{ title }}</h2>
    <p>{{ content }}</p>
    <form method="post">
        <textarea name="content" required>{{ content }}</textarea>
        <button type="submit" name="edit">Edit</button>
        <button type="submit" name="delete">Delete</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
