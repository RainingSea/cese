<!doctype html>
<html>
<head>
    <title>View Note</title>
</head>
<body>
    <h1>{{ note[0] }}</h1>
    <p>{{ note[1] }}</p>
    <form method="POST">
        <label for="content">Edit Content:</label>
        <textarea name="content" required>{{ note[1] }}</textarea>
        <br>
        <button type="submit" name="edit">Edit Note</button>
        <button type="submit" name="delete">Delete Note</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
