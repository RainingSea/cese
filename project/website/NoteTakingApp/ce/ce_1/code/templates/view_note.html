<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>
</head>
<body>
    <h1>View Note</h1>
    <h2>{{ note.split('|')[0] }}</h2>
    <p>{{ note.split('|')[1] }}</p>
    <form action="/delete_note/{{ note.split('|')[0] }}" method="post">
        <button type="submit">Delete Note</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
