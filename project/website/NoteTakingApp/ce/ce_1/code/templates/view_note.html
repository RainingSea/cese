{% extends "base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
<h1>{{ note.title }}</h1>
<p>{{ note.content }}</p>
<small>{{ note.timestamp }}</small>
<br><br>
<a href="/dashboard">Back to Dashboard</a>
{% if edit_mode %}
<form method="POST" action="/view_note/{{ note.id }}">
    <input type="hidden" name="_method" value="PUT">
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ note.title }}" required>
    </div>
    <div>
        <label for="content">Content:</label>
        <textarea id="content" name="content" rows="5" required>{{ note.content }}</textarea>
    </div>
    <button type="submit">Save Changes</button>
    <a href="/view_note/{{ note.id }}">Cancel</a>
</form>
<form method="POST" action="/view_note/{{ note.id }}">
    <input type="hidden" name="_method" value="DELETE">
    <button type="submit" onclick="return confirm('Are you sure you want to delete this note?')">Delete Note</button>
</form>
{% else %}
<a href="/view_note/{{ note.id }}?edit=true">Edit</a>
{% endif %}
{% endblock %}
