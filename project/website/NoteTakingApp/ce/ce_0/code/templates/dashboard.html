<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
    <h3>Your Notes</h3>
    <ul>
        {% for note in notes %}
        <li><a href="/view_note/{{ loop.index0 }}">{{ note.title }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
