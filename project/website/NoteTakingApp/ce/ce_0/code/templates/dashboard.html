<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <a href="{{ url_for('add_note') }}">Add Note</a>
    <a href="{{ url_for('search_note') }}">Search Notes</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    <h3>Your Notes</h3>
    <ul>
        {% for note in notes %}
            <li><a href="{{ url_for('view_note', title=note.split('|')[0]) }}">{{ note.split('|')[0] }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
