<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <a href="/add_note" class="btn btn-success">Add Note</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
        <h3>Your Notes:</h3>
        <ul class="list-group">
            {% for note in notes %}
                <li class="list-group-item">
                    <a href="/view_note/{{ note.id }}">{{ note.title }}</a>
                    <a href="/delete_note/{{ note.id }}" class="btn btn-danger btn-sm float-right">Delete</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
