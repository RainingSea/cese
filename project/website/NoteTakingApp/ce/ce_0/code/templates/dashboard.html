<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <h3>Your Notes</h3>
    <ul>
        {% for note in notes %}
            <li>
                <a href="{{ url_for('view_note', title=note[0]) }}">{{ note[0] }}</a>
                <form method="POST" action="{{ url_for('delete_note', title=note[0]) }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
</body>
</html>
