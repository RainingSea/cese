<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li>
                <a href="{{ url_for('view_note', note_id=note.id) }}">{{ note.title }}</a>
                <a href="{{ url_for('delete_note', note_id=note.id) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
</body>
</html>
