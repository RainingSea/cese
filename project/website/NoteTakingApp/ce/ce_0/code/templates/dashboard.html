<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li>
                <a href="{{ url_for('view_note', note_id=loop.index0) }}">{{ note.title }}</a>
                <form method="POST" action="{{ url_for('delete_note', note_id=loop.index0) }}">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
</body>
</html>
