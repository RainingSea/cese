<!DOCTYPE html>
<html>
<head>
    <title>Search Notes</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Note Taking App</a>
        <div class="ml-auto">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Search Results</h2>
        <form method="POST" action="{{ url_for('search') }}" class="mb-4">
            <div class="input-group">
                <input type="text" class="form-control" name="query" placeholder="Search notes..." required>
                <div class="input-group-append">
                    <button class="btn btn-primary" type="submit">Search</button>
                </div>
            </div>
        </form>
        
        {% if results %}
            <div class="list-group">
                {% for note_id, note in results %}
                    <a href="{{ url_for('view_note', note_id=note_id) }}" class="list-group-item list-group-item-action">
                        <div class="d-flex w-100
