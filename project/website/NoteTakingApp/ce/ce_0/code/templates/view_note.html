<!DOCTYPE html>
<html>
<head>
    <title>{{ note['title'] }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Note Taking App</a>
        <div class="ml-auto">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </nav>
    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="card">
            <div class="card-header">
                <h2>{{ note['title'] }}</h2>
                <small class="text-muted">Created: {{ note['created_at'] }}</small>
            </div>
            <div class="card-body">
                <p class="card-text">{{ note['content'] }}</p>
            </div>
            <div class="card-footer">
                <form method="POST" action="{{ url_for('view_note', note_id=note_id) }}">
                    <button type="button" class="btn btn-primary" data-toggle="collapse" data-target="#editForm">Edit</button>
                    <button type="submit" name="delete" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this note?')">Delete</button>
                </form>
                
                <div id="editForm" class="collapse mt-3">
                    <form method="POST" action="{{ url_for('view_note', note_id=note_id) }}">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ note['title'] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="content">Content</label>
                            <textarea class="form-control" id="content" name="content" rows="5" required>{{ note['content'] }}</textarea>
                        </div>
                        <button type="submit" name="edit" class="btn btn-success">Save Changes</button>
                        <button type="button" class="btn btn-secondary" data-toggle="collapse" data-target="#editForm">Cancel</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
