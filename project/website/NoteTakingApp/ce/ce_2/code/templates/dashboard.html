<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <a href="/add_note">Add Note</a>
    <h2>Your Notes</h2>
    <ul>
        {% for title, content in notes %}
            <li>
                <a href="/view_note/{{ title }}">{{ title }}</a>
                <a href="/edit_note/{{ title }}">Edit</a>
                <a href="/delete_note/{{ title }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
