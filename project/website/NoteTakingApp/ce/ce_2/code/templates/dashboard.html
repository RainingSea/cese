<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome, {{ session['username'] }}!</h1>
    <a href="{{ url_for('add_note') }}">Add Note</a>
    <a href="{{ url_for('search') }}">Search Notes</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    
    <h2>Your Notes</h2>
    {% if notes %}
        <ul>
            {% for note in notes %}
                <li>
                    <a href="{{ url_for('view_note', title=note['title']) }}">{{ note['title'] }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No notes yet. <a href="{{ url_for('add_note') }}">Add your first note!</a></p>
    {% endif %}
</body>
</html>
