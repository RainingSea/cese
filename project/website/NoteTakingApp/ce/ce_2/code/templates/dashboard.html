<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Notes</h2>
    <a href="/add_note">Add Note</a>
    <a href="/search_note">Search Notes</a>
    <ul>
        {% for note in notes %}
            <li>
                <a href="/view_note/{{ note.title }}">{{ note.title }}</a>
                <form action="/delete_note/{{ note.title }}" method="POST" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
