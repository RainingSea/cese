<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Notes</h2>
    <ul>
        {% for title in notes.keys() %}
            <li><a href="{{ url_for('view_note', title=title) }}">{{ title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
</body>
</html>
