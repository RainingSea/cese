<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>
</head>
<body>
    <h1>{{ note.title }}</h1>
    <p>{{ note.content }}</p>
    <a href="/edit_note/{{ note.title }}">Edit Note</a>
    <form action="/delete_note/{{ note.title }}" method="POST" style="display:inline;">
        <button type="submit">Delete</button>
    </form>
    <br>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
