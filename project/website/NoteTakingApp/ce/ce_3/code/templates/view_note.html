<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Note</title>
</head>
<body>
    <h1>{{ note.title }}</h1>
    <p>{{ note.content }}</p>
    <form method="post" action="/view_note/{{ note.title }}">
        <textarea name="content" required>{{ note.content }}</textarea>
        <button type="submit">Edit Note</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
