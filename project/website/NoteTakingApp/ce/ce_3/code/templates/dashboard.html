<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Your Notes</h1>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
    <ul>
        {% for note in notes %}
            <li>
                <a href="/view_note/{{ loop.index0 }}">{{ note.title }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
