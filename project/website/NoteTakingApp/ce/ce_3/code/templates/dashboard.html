<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <a href="/add_note">Add Note</a>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li><a href="/view_note/{{ note.title }}">{{ note.title }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
