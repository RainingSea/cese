<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comparison</title>
</head>
<body>
    <h1>Compare Transportation Options</h1>
    <ul>
        {% for option in options %}
            <li>{{ option.mode }} - Cost: {{ option.cost }} - Time: {{ option.time }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('trip_input') }}">Go back</a>
</body>
</html>
