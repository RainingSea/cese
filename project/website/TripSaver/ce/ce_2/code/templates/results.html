<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Options</title>
</head>
<body>
    <h1>Transport Options</h1>
    <ul>
        {% for option in options %}
            <li>{{ option.mode }} - Cost: ${{ option.cost }}, Time: {{ option.time }}</li>
        {% endfor %}
    </ul>
    <a href="/trip_details">Back to Trip Details</a>
</body>
</html>
