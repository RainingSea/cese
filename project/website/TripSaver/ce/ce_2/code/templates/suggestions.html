<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Transportation Suggestions</title>
</head>
<body>
    <div class="container">
        <h2>Transportation Suggestions</h2>
        <ul>
            {% for suggestion in suggestions %}
                <li>{{ suggestion.option }} - Cost: ${{ suggestion.cost }}, Time: {{ suggestion.time }}</li>
            {% endfor %}
        </ul>
        <a href="/trip_input" class="btn btn-secondary">Back</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
