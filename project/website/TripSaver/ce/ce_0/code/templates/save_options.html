<!DOCTYPE html>
<html>
<head>
    <title>Save Options</title>
</head>
<body>
    <h2>Save Your Preferred Options</h2>
    <form method="POST" action="/save_options">
        <label for="selected_option">Select an option to save:</label>
        <select name="selected_option">
            {% for option in options %}
                <option value="{{ option.mode }}">{{ option.mode }}</option>
            {% endfor %}
        </select>
        <input type="submit" value="Save Option">
    </form>
</body>
</html>
