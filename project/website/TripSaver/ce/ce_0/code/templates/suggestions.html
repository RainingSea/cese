<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestions</title>
</head>
<body>
    <h1>Transportation Suggestions</h1>
    <ul>
        {% for suggestion in suggestions %}
            <li>{{ suggestion.option }} - Cost: ${{ suggestion.cost }}, Time: {{ suggestion.time }}</li>
        {% endfor %}
    </ul>
    <a href="/trip_input">Input another trip</a>
</body>
</html>
