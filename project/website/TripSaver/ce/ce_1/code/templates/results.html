<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportation Options</title>
</head>
<body>
    <h1>Transportation Options</h1>
    <ul>
        {% for option in options %}
            <li>{{ option.mode }} - Cost: ${{ option.cost }} - Time: {{ option.time }} minutes</li>
        {% endfor %}
    </ul>
    <a href="/trip_input">Back to Trip Input</a>
    <a href="/logout">Logout</a>
</body>
</html>
