<!DOCTYPE html>
<html>
<head>
    <title>Plan Your Trip - Trip Saver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Plan Your Trip</h1>
    <form method="POST" action="{{ url_for('trip_input') }}">
        <div class="mb-3">
            <label for="start" class="form-label">Starting Point</label>
            <input type="text" class="form-control" id="start" name="start" required>
        </div>
        <div class="mb-3">
            <label for="destination" class="form-label">Destination</label>
            <input type="text" class="form-control" id="destination" name="destination" required>
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Travel Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
        </div>
        <button type="submit" class="btn btn-primary">Find Options</button>
    </form>
    <p class="mt-3"><a href="{{ url_for('preferences') }}">View Saved Preferences</a></p>
</body>
</html>
