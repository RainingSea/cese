<!DOCTYPE html>
<html>
<head>
    <title>Saved Preferences - Trip Saver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Your Saved Preferences</h1>
    
    {% if preferences %}
    <table class="table">
        <thead>
            <tr>
                <th>Transport Mode</th>
                <th>From</th>
                <th>To</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for pref in preferences %}
            <tr>
                <td>{{ pref.transport_mode }}</td>
                <td>{{ pref.start }}</td>
                <td>{{ pref.destination }}</td>
                <td>
                    <form method="POST" action="{{ url_for('trip_input') }}">
                        <input type="hidden" name="start" value="{{ pref.start }}">
                        <input type="hidden" name="destination" value="{{ pref.destination }}">
                        <button type="submit" class="btn btn-sm btn-primary">Use Again</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>You haven't saved any preferences yet.</p>
    {% endif %}
    
    <a href="{{ url_for('trip_input') }}" class="btn btn-secondary mt-3">Plan New Trip</a>
</body>
</html>
