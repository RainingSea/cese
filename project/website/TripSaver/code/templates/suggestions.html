<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportation Suggestions</title>
</head>
<body>
    <h1>Transportation Suggestions</h1>
    <ul>
        {% for option in options %}
            <li>{{ option.option }} - Cost: ${{ option.cost }}, Time: {{ option.time }}</li>
        {% endfor %}
    </ul>
    <a href="/trip_input?username={{ request.args.get('username') }}">Input Another Trip</a>
    <a href="/logout">Logout</a>
</body>
</html>
