<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>
</head>
<body>
    <h1>Transportation Suggestions</h1>
    <ul>
        {% for suggestion in suggestions %}
            <li>{{ suggestion.mode }} - Cost: ${{ suggestion.cost }}, Time: {{ suggestion.time }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('trip_input') }}">Input another trip</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
