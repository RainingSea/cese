<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Trip Details</title>
</head>
<body>
    <h1>Input Trip Details</h1>
    <form method="POST">
        <input type="hidden" name="username" value="{{ username }}">
        <label for="start_point">Start Point:</label>
        <input type="text" name="start_point" required>
        <label for="end_point">End Point:</label>
        <input type="text" name="end_point" required>
        <label for="travel_date">Travel Date:</label>
        <input type="date" name="travel_date" required>
        <label for="transport_option">Preferred Transport Option:</label>
        <input type="text" name="transport_option" required>
        <button type="submit">Save Trip</button>
    </form>
    <a href="/logout">Logout</a>
</body>
</html>
