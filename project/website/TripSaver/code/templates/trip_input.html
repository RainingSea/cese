<!DOCTYPE html>
<html>
<head>
    <title>Trip Input</title>
</head>
<body>
    <h2>Input Trip Details</h2>
    <form method="POST">
        Starting Point: <input type="text" name="starting_point" required><br>
        Destination: <input type="text" name="destination" required><br>
        Travel Date: <input type="date" name="travel_date" required><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
