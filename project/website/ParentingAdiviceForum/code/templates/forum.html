<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum - Parenting Advice Forum</title>
</head>
<body>
    <h1>Forum</h1>
    <ul>
        {% for thread in threads %}
            <li><a href="/thread/{{ loop.index0 }}">{{ thread.strip().split('|')[0] }}</a></li>
        {% endfor %}
    </ul>
    <h2>Create New Thread</h2>
    <form action="" method="post">
        <input type="text" name="title" placeholder="Thread Title" required>
        <textarea name="content" placeholder="Thread Content" required></textarea>
        <button type="submit">Submit Thread</button>
    </form>
    <a href="/post_advice">Post Advice</a>
</body>
</html>
