<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forum</title>
</head>
<body>
    <h1>Forum</h1>
    <ul>
        {% for thread in threads %}
            <li><a href="/view_thread/{{ loop.index0 }}">{{ thread.title }}</a></li>
        {% endfor %}
    </ul>
    <form action="/post_advice" method="POST">
        <input type="text" name="title" placeholder="Title" required>
        <textarea name="content" placeholder="Content" required></textarea>
        <button type="submit">Create Thread</button>
    </form>
</body>
</html>
