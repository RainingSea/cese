<!DOCTYPE html>
<html>
<head>
    <title>Forum</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #f1f1f1; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; }
        .thread { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
        .new-thread { margin-top: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="/home">Home</a>
        <a href="/forum">Forum</a>
        <a href="/post_advice">Post Advice</a>
        <a href="/account">My Account</a>
        <a href="/contact">Contact Us</a>
    </nav>
    <h1>Forum Threads</h1>
    
    <div class="threads">
        {% for thread in threads %}
        <div class="thread">
            <h3><a href="/view_thread?id={{ thread.id }}">{{ thread.title }}</a></h3>
            <p>By: {{ thread.author }}</p>
        </div>
        {% endfor %}
    </div>
    
    <div class="new-thread">
        <a href="/post_advice"><button>Create New Thread</button></a>
    </div>
</body>
</html>
