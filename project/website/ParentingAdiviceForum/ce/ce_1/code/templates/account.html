<!DOCTYPE html>
<html>
<head>
    <title>My Account</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #f1f1f1; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
        .success { color: green; }
    </style>
</head>
<body>
    <nav>
        <a href="/home">Home</a>
        <a href="/forum">Forum</a>
        <a href="/post_advice">Post Advice</a>
        <a href="/account">My Account</a>
        <a href="/contact">Contact Us</a>
    </nav>
    
    <h1>Account Settings</h1>
    <p>Username: {{ current_user }}</p>
    
    <h3>Change Password</h3>
    <form action="/update_account" method="post">
        <input type="password" name="password" placeholder="New Password" required>
        <button type="submit">Update Password</button>
    </form>
    
    <div class="success">
        {% if success %}
        Password updated successfully!
        {% endif %}
    </div>
    
    <h3>Delete Account</h3>
    <form action="/delete_account" method="post">
        <button type="submit" style="background: red;">Delete My Account</button>
    </form>
</body>
</html>
