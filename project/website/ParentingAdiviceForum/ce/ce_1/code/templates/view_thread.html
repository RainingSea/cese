<!DOCTYPE html>
<html>
<head>
    <title>View Thread</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #f1f1f1; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; }
        .thread { border: 1px solid #ddd; padding: 10px; margin-bottom: 20px; }
        .comment { border: 1px solid #eee; padding: 10px; margin: 10px 0; }
        textarea { width: 100%; height: 100px; }
    </style>
</head>
<body>
    <nav>
        <a href="/home">Home</a>
        <a href="/forum">Forum</a>
        <a href="/post_advice">Post Advice</a>
        <a href="/account">My Account</a>
        <a href="/contact">Contact Us</a>
    </nav>
    
    <div class="thread">
        <h2>{{ thread.title }}</h2>
        <p>By: {{ thread.author }}</p>
        <p>{{ thread.content }}</p>
    </div>
    
    <h3>Comments</h3>
    <div class="comments">
        {% for comment in comments %}
        <div class="comment">
            <p><strong>{{ comment.author }}</strong> says:</p>
            <p>{{ comment.content }}</p>
        </div>
        {% endfor %}
    </div>
    
    <form action="/add_comment" method="post">
        <input type="hidden" name="thread_id" value="{{ thread.id }}">
        <textarea name="content" placeholder="Add your comment..." required></textarea>
        <button type="submit">Post Comment</button>
    </form>
</body>
</html>
