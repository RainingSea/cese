<!DOCTYPE html>
<html>
<head>
    <title>Forum</title>
</head>
<body>
    <h1>Forum</h1>
    <a href="{{ url_for('home') }}">Back to Home</a>
    <div>
        {% for thread in threads %}
            <div style="border:1px solid #ccc; padding:10px; margin:10px;">
                <h3><a href="{{ url_for('view_thread', thread_id=thread[0]) }}">{{ thread[1] }}</a></h3>
                <p>Posted by {{ thread[3] }} on {{ thread[4] }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
