<!DOCTYPE html>
<html>
<head>
    <title>{{ thread[1] }}</title>
</head>
<body>
    <h1>{{ thread[1] }}</h1>
    <p>Posted by {{ thread[3] }} on {{ thread[4] }}</p>
    <p>{{ thread[2] }}</p>
    
    <h2>Comments</h2>
    {% for comment in comments %}
        <div style="border:1px solid #eee; padding:5px; margin:5px;">
            <p>{{ comment[2] }}</p>
            <small>By {{ comment[3] }} on {{ comment[4] }}</small>
        </div>
    {% endfor %}
    
    <h3>Add Comment</h3>
    <form method="POST">
        <textarea name="content" required></textarea><br>
        <button type="submit">Submit</button>
    </form>
    <a href="{{ url_for('forum_page') }}">Back to Forum</a>
</body>
</html>
