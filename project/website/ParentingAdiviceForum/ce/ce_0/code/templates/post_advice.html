<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Advice</title>
</head>
<body>
    <h1>Post Advice</h1>
    <form method="POST" action="/post_advice">

        <label for="content">Content:</label>

    </form>
    <a href="/forum">Back to Forum</a>
</body>
</html>
