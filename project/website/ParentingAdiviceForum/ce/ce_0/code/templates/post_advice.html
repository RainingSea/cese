<!DOCTYPE html>
<html>
<head>
    <title>Parenting Advice</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('forum') }}">Forum</a>
            <a href="{{ url_for('advice') }}">Advice</a>
            <a href="{{ url_for('account') }}">My Account</a>
            <a href="{{ url_for('contact') }}">Contact Us</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h1>Parenting Advice</h1>
        <form method="POST" action="{{ url_for('post_advice') }}">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
            
            <label for="content">Advice:</label>
            <textarea id="content" name="content" required></textarea>
            
            <button type="submit">Post Advice</button>
        </form>
        
        <div class="advice-list">
            {% for item in advice %}
            <div class="advice-item">
                <h3>{{ item.title }}</h3>
                <p>{{ item.content }}</p>
                <p class="advice-meta">Posted by {{ item.author }} on {{ item.timestamp }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
