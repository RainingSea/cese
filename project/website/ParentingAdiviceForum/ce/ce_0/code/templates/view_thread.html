<!DOCTYPE html>
<html>
<head>
    <title>{{ thread.title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('forum') }}">Forum</a>
            <a href="{{ url_for('advice') }}">Advice</a>
            <a href="{{ url_for('account') }}">My Account</a>
            <a href="{{ url_for('contact') }}">Contact Us</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h1>{{ thread.title }}</h1>
        <p>Posted by {{ thread.author }} on {{ thread.timestamp }}</p>
        <div class="thread-content">
            <p>{{ thread.content }}</p>
        </div>
        
        <h2>Comments</h2>
        <div class="comments">
            {% for comment in comments %}
            <div class="comment">
                <p>{{ comment.content }}</p>
                <p class="comment-meta">Posted by {{ comment.author }} on {{ comment.timestamp }}</p>
            </div>
            {% endfor %}
        </div>
        
        <form method="POST" action="{{ url_for('add_comment', thread_id=thread.id) }}">
            <label for="comment">Add Comment:</label>
            <textarea id="comment" name="comment" required></textarea>
            <button type="submit">Post Comment</button>
        </form>
    </div>
</body>
</html>
