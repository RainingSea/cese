<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ thread.title }} - Parenting Advice Forum</title>
</head>
<body>
    <h1>{{ thread.title }}</h1>
    <p><strong>By:</strong> {{ thread.author }}</p>
    <p>{{ thread.content }}</p>
    
    <h2>Comments</h2>
    <ul>
        {% for comment in comments %}
            <li><strong>{{ comment.author }}:</strong> {{ comment.content }}</li>
        {% endfor %}
    </ul>
    
    <h3>Add a Comment</h3>
    <form method="POST">
        <label for="content">Comment:</label>
        <textarea id="content" name="content" required></textarea>
        <br>
        <input type="hidden" name="author" value="current_user"> <!-- Replace with actual user -->
        <button type="submit">Submit Comment</button>
    </form>
    
    <p><a href="{{ url_for('forum') }}">Back to Forum</a></p>
</body>
</html>
