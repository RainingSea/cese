<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Thread</title>
</head>
<body>
    <h1>{{ thread[0] }}</h1>
    <p>{{ thread[1] }}</p>
    <h2>Comments</h2>
    <ul>
        {% for comment in comments %}
            <li>{{ comment }}</li>
        {% endfor %}
    </ul>
    <form method="post">
        <input type="text" name="comment" placeholder="Add a comment" required>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
