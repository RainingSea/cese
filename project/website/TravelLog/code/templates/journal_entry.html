<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Journal Entry</title>
</head>
<body>
    <h1>Create Journal Entry</h1>
    <form method="POST">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <br>
        <label for="dates">Dates:</label>
        <input type="text" id="dates" name="dates" required>
        <br>
        <label for="activities">Activities:</label>
        <input type="text" id="activities" name="activities" required>
        <br>
        <label for="photos">Photos:</label>
        <input type="text" id="photos" name="photos">
        <br>
        <label for="reflections">Reflections:</label>
        <textarea id="reflections" name="reflections" required></textarea>
        <br>
        <button type="submit">Save Entry</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
