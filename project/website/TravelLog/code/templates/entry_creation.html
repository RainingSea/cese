<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Entry</title>
</head>
<body>
    <h1>Create Travel Entry</h1>
    <form method="POST">
        <input type="text" name="destination" placeholder="Destination" required>
        <input type="text" name="dates" placeholder="Dates" required>
        <input type="text" name="activities" placeholder="Activities" required>
        <input type="text" name="photos" placeholder="Photos">
        <textarea name="reflections" placeholder="Reflections"></textarea>
        <button type="submit">Save Entry</button>
    </form>
    <a href="/entry_display">View Entries</a>
</body>
</html>
