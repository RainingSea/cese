<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry</title>
</head>
<body>
    <h1>Edit Travel Entry</h1>
    <form method="POST">
        <input type="text" name="destination" value="{{ entry.destination }}" required>
        <input type="text" name="dates" value="{{ entry.dates }}" required>
        <input type="text" name="activities" value="{{ entry.activities }}" required>
        <input type="text" name="photos" value="{{ entry.photos }}">
        <textarea name="reflections">{{ entry.reflections }}</textarea>
        <button type="submit">Update Entry</button>
    </form>
    <a href="/entry_display">Cancel</a>
</body>
</html>
