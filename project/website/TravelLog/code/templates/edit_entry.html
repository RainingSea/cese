<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Edit Journal Entry</title>
</head>
<body>
    <div class="container">
        <h2>Edit Journal Entry</h2>
        <form method="POST" action="">
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" class="form-control" id="destination" name="destination" value="{{ entry.destination }}" required>
            </div>
            <div class="form-group">
                <label for="dates">Dates:</label>
                <input type="text" class="form-control" id="dates" name="dates" value="{{ entry.dates }}" required>
            </div>
            <div class="form-group">
                <label for="activities">Activities:</label>
                <input type="text" class="form-control" id="activities" name="activities" value="{{ entry.activities }}" required>
            </div>
            <div class="form-group">
                <label for="photos">Photos (comma-separated):</label>
                <input type="text" class="form-control" id="photos" name="photos" value="{{ entry.photos | join(', ') }}">
            </div>
            <div class="form-group">
                <label for="reflections">Reflections:</label>
                <textarea class="form-control" id="reflections" name="reflections" required>{{ entry.reflections }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Entry</button>
            <a href="/journal" class="btn btn-link">Cancel</a>
        </form>
    </div>
</body>
</html>
