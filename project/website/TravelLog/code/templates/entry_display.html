<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Entries</title>
</head>
<body>
    <h1>Your Travel Entries</h1>
    <ul>
        {% for entry in entries %}
            <li>
                <strong>{{ entry.destination }}</strong> ({{ entry.dates }})<br>
                Activities: {{ entry.activities }}<br>
                Photos: {{ entry.photos }}<br>
                Reflections: {{ entry.reflections }}<br>
                <form method="POST" action="/delete_entry/{{ entry.id }}">
                    <button type="submit">Delete</button>
                </form>
                <a href="/edit_entry/{{ entry.id }}">Edit</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/entry_creation">Create New Entry</a>
    <a href="/logout">Logout</a>
</body>
</html>
