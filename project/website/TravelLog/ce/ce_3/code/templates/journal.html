<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Journal</title>
</head>
<body>
    <h1>Journal Entries</h1>
    <form action="/journal" method="post">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <label for="dates">Dates:</label>
        <input type="text" id="dates" name="dates" required>
        <label for="activities">Activities:</label>
        <input type="text" id="activities" name="activities" required>
        <label for="photos">Photos (comma-separated paths):</label>
        <input type="text" id="photos" name="photos">
        <label for="reflections">Reflections:</label>
        <textarea id="reflections" name="reflections" required></textarea>
        <button type="submit">Save Entry</button>
    </form>
    <h2>Your Entries</h2>
    <ul>
        {% for entry in entries %}
            <li>{{ entry.destination }} - {{ entry.dates }} - {{ entry.activities }} - {{ entry.reflections }}</li>
        {% endfor %}
    </ul>
</body>
</html>
