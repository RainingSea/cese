<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Journal</title>
</head>
<body>
    <h1>Travel Journal</h1>
    <form method="post">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <label for="activities">Activities:</label>
        <textarea id="activities" name="activities"></textarea>
        <label for="photos">Photos:</label>
        <input type="text" id="photos" name="photos">
        <label for="reflections">Reflections:</label>
        <textarea id="reflections" name="reflections"></textarea>
        <button type="submit">Save Entry</button>
    </form>
    
    <h2>Your Entries</h2>
    <ul>
        {% for entry in entries %}
            <li>
                <strong>{{ entry.destination }}</strong> ({{ entry.date }})<br>
                Activities: {{ entry.activities }}<br>
                Photos: {{ entry.photos }}<br>
                Reflections: {{ entry.reflections }}
            </li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
