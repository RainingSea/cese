<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Journal</title>
</head>
<body>
    <h1>Your Travel Journal</h1>
    <form action="/journal" method="post">
        <label for="destination">Destination:</label>
        <input type="text" name="destination" required>
        <br>
        <label for="dates">Dates:</label>
        <input type="text" name="dates" required>
        <br>
        <label for="activities">Activities:</label>
        <textarea name="activities" required></textarea>
        <br>
        <label for="reflections">Reflections:</label>
        <textarea name="reflections" required></textarea>
        <br>
        <button type="submit">Add Entry</button>
    </form>

    <h2>Previous Entries</h2>
    <ul>
        {% for entry in entries %}
            <li>{{ entry[0] }} ({{ entry[1] }}) - {{ entry[2] }}: {{ entry[3] }}</li>
        {% endfor %}
    </ul>

    <a href="/logout">Logout</a>
</body>
</html>
