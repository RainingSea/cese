<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Journal Entry</title>
</head>
<body>
    <h1>Journal Entry</h1>
    <form method="post" enctype="multipart/form-data">
        <label for="destination">Destination:</label>
        <input type="text" name="destination" required>
        <label for="dates">Dates:</label>
        <input type="text" name="dates" required>
        <label for="activities">Activities:</label>
        <input type="text" name="activities" required>
        <label for="photos">Upload Photos:</label>
        <input type="file" name="photos">
        <label for="reflections">Reflections:</label>
        <textarea name="reflections" required></textarea>
        <button type="submit">Add Entry</button>
    </form>
    <h2>Your Past Entries</h2>
    <ul>
        {% for entry in entries %}
            <li>{{ entry.destination }} - {{ entry.dates }} - {{ entry.activities }} - {{ entry.photos }} - {{ entry.reflections }}</li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
