<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST">
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" class="form-control" id="destination" name="destination" required>
            </div>
            <div class="form-group">
                <label for="dates">Dates:</label>
                <input type="text" class="form-control" id="dates" name="dates" required>
            </div>
            <div class="form-group">
                <label for="activities">Activities:</label>
                <textarea class="form-control" id="activities" name="activities" required></textarea>
            </div>
            <div class="form-group">
                <label for="photos">Photos (comma-separated):</label>
                <input type="text" class="form-control" id="photos" name="photos">
            </div>
            <div class="form-group">
                <label for="reflections">Reflections:</label>
                <textarea class="form-control" id="reflections" name="reflections" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Entry</button>
        </form>
        <h3>Your Journal Entries</h3>
        <ul>
            {% for entry in entries %}
                <li>{{ entry.destination }} - {{ entry.dates }}</li>
            {% endfor %}
        </ul>
        <a href="/">Logout</a>
    </div>
</body>
</html>
