<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="POST">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <label for="activities">Activities:</label>
        <textarea id="activities" name="activities" required></textarea>
        <label for="photos">Photos (comma-separated):</label>
        <input type="text" id="photos" name="photos">
        <label for="reflections">Reflections:</label>
        <textarea id="reflections" name="reflections" required></textarea>
        <button type="submit">Create Entry</button>
    </form>
    <h2>Your Journal Entries</h2>
    <ul>
        {% for entry in entries %}
            <li>{{ entry.destination }} - {{ entry.date }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
