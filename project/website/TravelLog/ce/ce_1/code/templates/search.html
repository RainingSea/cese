<!DOCTYPE html>
<html>
<head>
    <title>Search Entries</title>
</head>
<body>
    <h1>Search Journal Entries</h1>
    <form method="post">
        Search: <input type="text" name="query" required>
        <input type="submit" value="Search">
    </form>
    <h2>Results</h2>
    <ul>
        {% for result in results %}
            <li>{{ result.destination }} on {{ result.date }} - {{ result.activities }}</li>
        {% endfor %}
    </ul>
</body>
</html>
