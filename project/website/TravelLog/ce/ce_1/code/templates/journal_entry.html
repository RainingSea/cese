<!DOCTYPE html>
<html>
<head>
    <title>Journal Entry</title>
</head>
<body>
    <h1>Journal Entries</h1>
    <form method="post" enctype="multipart/form-data">
        Destination: <input type="text" name="destination" required><br>
        Date: <input type="date" name="date" required><br>
        Activities: <textarea name="activities" required></textarea><br>
        Photos: <input type="file" name="photos" multiple><br>
        Reflections: <textarea name="reflections" required></textarea><br>
        <input type="submit" value="Create Entry">
    </form>
    <h2>Past Entries</h2>
    <ul>
        {% for entry in entries %}
            <li>{{ entry.destination }} on {{ entry.date }} - {{ entry.activities }}</li>
        {% endfor %}
    </ul>
</body>
</html>
