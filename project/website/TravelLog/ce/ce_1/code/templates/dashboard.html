<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Travel Journal Entries</h2>
        <form method="POST" action="/dashboard">
            <div class="form-group">
                <label for="destination">Destination</label>
                <input type="text" class="form-control" id="destination" name="destination" required>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="activities">Activities</label>
                <textarea class="form-control" id="activities" name="activities" required></textarea>
            </div>
            <div class="form-group">
                <label for="photos">Photos</label>
                <input type="text" class="form-control" id="photos" name="photos">
            </div>
            <div class="form-group">
                <label for="reflections">Reflections</label>
                <textarea class="form-control" id="reflections" name="reflections" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Entry</button>
        </form>

        <h3>Your Entries</h3>
        <ul>
            {% for entry in entries %}
                <li>{{ entry }}</li>
            {% endfor %}
        </ul>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
