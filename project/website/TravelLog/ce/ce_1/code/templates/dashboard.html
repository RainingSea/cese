<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Your Travel Journal</h1>
    <form action="/create_entry" method="post">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <br>
        <label for="dates">Dates:</label>
        <input type="text" id="dates" name="dates" required>
        <br>
        <label for="activities">Activities:</label>
        <textarea id="activities" name="activities" required></textarea>
        <br>
        <label for="photos">Photos:</label>
        <input type="text" id="photos" name="photos">
        <br>
        <label for="reflections">Reflections:</label>
        <textarea id="reflections" name="reflections" required></textarea>
        <br>
        <button type="submit">Create Entry</button>
    </form>
    <h2>Your Entries</h2>
    <ul id="entries-list">
        <!-- Entries will be populated here -->
    </ul>
</body>
</html>
