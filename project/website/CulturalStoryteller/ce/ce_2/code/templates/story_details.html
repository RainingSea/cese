<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>{{ story[0] }}</title>
</head>
<body>
    <div class="container">
        <h2>{{ story[0] }}</h2>
        <p>{{ story[1] }}</p>
        <h5>Cultural Background:</h5>
        <p>{{ story[2] }}</p>
        <button onclick="addBookmark('{{ story[0] }}')" class="btn btn-primary">Add to Bookmarks</button>
        <a href="/dashboard" class="btn btn-link">Back to Dashboard</a>
    </div>
    <script>
        function addBookmark(title) {
            fetch('/bookmarks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title: title })
            }).then(response => {
                if (response.ok) {
                    alert('Story added to bookmarks!');
                } else {
                    alert('Error adding bookmark.');
                }
            });
        }
    </script>
</body>
</html>
