<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Stories</h2>
        <input type="text" id="search" placeholder="Search stories..." class="form-control mb-3">
        <ul id="story-list" class="list-group">
            {% for story in stories %}
                <li class="list-group-item">
                    <a href="/story/{{ story[0] }}">{{ story[0] }}</a>
                    <p>{{ story[1] }}</p>
                </li>
            {% endfor %}
        </ul>
    </div>
    <script>
        document.getElementById('search').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const items = document.querySelectorAll('#story-list .list-group-item');
            items.forEach(item => {
                const title = item.querySelector('a').textContent.toLowerCase();
                item.style.display = title.includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
