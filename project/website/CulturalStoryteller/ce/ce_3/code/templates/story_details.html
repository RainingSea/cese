<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ story.title }}</title>
</head>
<body>
    <h1>{{ story.title }}</h1>
    <p>{{ story.content }}</p>
    <h2>Cultural Background</h2>
    <p>{{ story.cultural_background }}</p>
    <form method="post" action="/add_bookmark">
        <input type="hidden" name="story_id" value="{{ story.id }}">
        <button type="submit">Add to Bookmarks</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
