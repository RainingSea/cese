<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Story Dashboard</h1>
    <ul>
        {% for story in stories %}
            <li><a href="{{ url_for('story_details', story_id=story.id) }}">{{ story.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/bookmarks">View Bookmarks</a>
    <a href="/logout">Logout</a>
</body>
</html>
