<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Stories</h2>
    <ul>
        {% for story in stories %}
            <li><a href="{{ url_for('story_details', title=story.title) }}">{{ story.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/bookmarks">View Bookmarks</a>
</body>
</html>
