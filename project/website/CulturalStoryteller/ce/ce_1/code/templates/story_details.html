<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ story.title }}</title>
</head>
<body>
    <h1>{{ story.title }}</h1>
    <p>{{ story.content }}</p>
    <p><strong>Cultural Origin:</strong> {{ story.cultural_origin }}</p>
    <form method="POST" action="/add_bookmark">
        <input type="hidden" name="story_title" value="{{ story.title }}">
        <button type="submit">Add to Bookmarks</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
