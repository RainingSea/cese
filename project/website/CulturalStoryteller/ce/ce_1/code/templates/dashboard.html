<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Stories</h2>
    <ul>
        {% for story in stories %}
            <li>
                <a href="/story/{{ story.title }}">{{ story.title }}</a> - {{ story.category }}
                <a href="/add_bookmark/{{ story.title }}">Bookmark</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/bookmarks">My Bookmarks</a>
    <a href="/logout">Logout</a>
</body>
</html>
