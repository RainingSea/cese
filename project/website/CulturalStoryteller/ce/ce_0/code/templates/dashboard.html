<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Stories</h2>
        <ul>
            {% for story in stories %}
                <li><a href="/story/{{ story.title }}">{{ story.title }}</a></li>
            {% endfor %}
        </ul>
        <a href="/bookmarks" class="btn btn-secondary">View Bookmarks</a>
    </div>
</body>
</html>
