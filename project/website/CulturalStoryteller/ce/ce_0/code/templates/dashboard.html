<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>Stories</h2>
    <ul>
        {% for story in stories %}
            <li><a href="{{ url_for('view_story', title=story.title) }}">{{ story.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/bookmarks">View Bookmarks</a>
</div>
</body>
</html>
