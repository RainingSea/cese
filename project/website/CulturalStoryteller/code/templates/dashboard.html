<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Stories</h1>
    <ul>
        {% for story in stories %}
            <li><a href="/story/{{ loop.index0 }}">{{ story }}</a></li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
