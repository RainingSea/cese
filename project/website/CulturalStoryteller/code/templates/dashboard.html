<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Stories</h2>
        <ul>
            {% for story in stories %}
                <li>
                    <a href="{{ url_for('view_story_details', title=story.title) }}">{{ story.title }}</a>
                    <form method="POST" action="/bookmark" style="display:inline;">
                        <input type="hidden" name="story_title" value="{{ story.title }}">
                        <button type="submit" class="btn btn-link">Bookmark</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
        <form method="POST" action="/logout" style="display:inline;">
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
        <a href="/bookmarks">View Bookmarks</a>
        <form method="POST" action="/search" style="display:inline;">
            <input type="text" name="keyword" placeholder="Search stories" required>
            <button type="submit" class="btn btn-secondary">Search</button>
        </form>
    </div>
</body>
</html>
