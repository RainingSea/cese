<!DOCTYPE html>
<html>
<head>
    <title>Travel Tips for {{ destination }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Travel Tips for {{ destination }}</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
        </nav>
        
        <ul>
            {% for tip in tips %}
            <li>
                <p>{{ tip.text }}</p>
                <form method="POST" action="{{ url_for('save_tip') }}">
                    <input type="hidden" name="tip_id" value="{{ tip.id }}">
                    <button type="submit">Save Tip</button>
                </form>
            </li>
            {% else %}
            <li>No tips found for your selection</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
