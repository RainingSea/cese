<!DOCTYPE html>
<html>
<head>
    <title>Main Interface</title>
</head>
<body>
    <h2>Travel Tips</h2>
    <form method="POST">
        Destination: <input type="text" name="destination" required><br>
        Interests: <input type="checkbox" name="interests" value="food"> Food
        <input type="checkbox" name="interests" value="culture"> Culture
        <input type="checkbox" name="interests" value="adventure"> Adventure<br>
        <input type="submit" value="Get Tips">
    </form>
    <h3>Generated Tips:</h3>
    <ul>
        {% if tips %}
            {% for tip in tips %}
                <li>{{ tip }}</li>
            {% endfor %}
        {% else %}
            <li>No tips generated yet.</li>
        {% endif %}
    </ul>
    <a href="/">Logout</a>
</body>
</html>
