<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Travel Details</title>
</head>
<body>
    <div class="container">
        <h2>Enter Travel Details</h2>
        <form method="POST" action="/travel">
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" class="form-control" id="destination" name="destination" required>
            </div>
            <div class="form-group">
                <label for="interests">Interests:</label>
                <input type="text" class="form-control" id="interests" name="interests" placeholder="Comma separated interests">
            </div>
            <button type="submit" class="btn btn-primary">Get Tips</button>
        </form>
    </div>
</body>
</html>
