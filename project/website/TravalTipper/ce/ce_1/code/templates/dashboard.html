<!DOCTYPE html>
<html>
<head>
    <title>Travel Tipper - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ username }}!</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Home</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
        
        <h2>Your Saved Tips</h2>
        <ul>
            {% for tip in saved_tips %}
            <li>{{ tip }}</li>
            {% else %}
            <li>No saved tips yet</li>
            {% endfor %}
        </ul>

        <h2>Get New Travel Tips</h2>
        <form method="POST" action="{{ url_for('get_tips') }}">
            <select name="destination" required>
                <option value="">Select Destination</option>
                <option value="Paris">Paris</option>
                <option value="Tokyo">Tokyo</option>
            </select>
            
            <div class="interests">
                <label><input type="checkbox" name="interests" value="museums"> Museums</label>
                <label><input type="checkbox" name="interests" value="food"> Food</label>
                <label><input type="checkbox" name="interests" value="shopping"> Shopping</label>
                <label><input type="checkbox" name="interests" value="nightlife"> Nightlife</label>
            </div>
            
            <button type="submit">Get Tips</button>
        </form>
    </div>
</body>
</html>
