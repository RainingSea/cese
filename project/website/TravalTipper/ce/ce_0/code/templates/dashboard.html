<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Travel Tipper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Travel Tipper</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('tips') }}">Get Tips</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    
    <h1>Welcome, {{ username }}!</h1>
    
    <h2 class="mt-4">Your Favorites</h2>
    <ul class="list-group">
        {% for fav in favorites %}
        <li class="list-group-item">{{ fav }}</li>
        {% else %}
        <li class="list-group-item">No favorites saved yet</li>
        {% endfor %}
    </ul>
</body>
</html>
