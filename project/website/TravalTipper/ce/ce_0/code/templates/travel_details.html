<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Details</title>
</head>
<body>
    <h1>Travel Details</h1>
    <form method="POST" action="/travel_details">
        <input type="text" name="destination" placeholder="Destination" required>
        <input type="text" name="duration" placeholder="Trip Duration" required>
        <input type="text" name="interests" placeholder="Interests (comma separated)" required>
        <button type="submit">Get Tips</button>
    </form>
</body>
</html>
