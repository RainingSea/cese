<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
</head>
<body>
    <h1>Recommendations for {{ recommendations.destination }}</h1>
    <ul>
        {% for tip in recommendations.recommendations %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <form method="post" action="/favorites">
        <label for="tip">Save a favorite tip:</label>
        <input type="text" id="tip" name="tip" required>
        <button type="submit">Save Favorite</button>
    </form>
    <a href="/favorites">View Favorites</a>
</body>
</html>
