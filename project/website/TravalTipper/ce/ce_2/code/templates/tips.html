<!DOCTYPE html>
<html>
<head>
    <title>Travel Tipper - Tips</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Travel Tipper</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('tips') }}">Tips</a>
            <a href="{{ url_for('favorites') }}">Favorites</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h2>Travel Tips</h2>
        <form method="GET" action="{{ url_for('tips') }}" class="search-form">
            <input type="text" name="search" placeholder="Search tips...">
            <button type="submit">Search</button>
        </form>
        
        {% if tips %}
        <div class="tips-list">
            {% for tip in tips %}
            <div class="tip">
                <h3>{{ tip.destination }} - {{ tip.category }}</h3>
                <p>{{ tip.content }}</p>
                <form method="POST" action="{{ url_for('save_favorite') }}">
                    <input type="hidden" name="destination" value="{{ tip.destination }}">
                    <input type="hidden" name="content" value="{{ tip.content }}">
                    <button type="submit">Save to Favorites</button>
                </form>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p>No tips found. Try adjusting your search criteria.</p>
        {% endif %}
    </div>
</body>
</html>
