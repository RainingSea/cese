<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Details</title>
</head>
<body>
    <h2>Travel Details</h2>
    <form method="POST">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <br>
        <label for="duration">Trip Duration:</label>
        <input type="text" id="duration" name="duration" required>
        <br>
        <label>Interests:</label>
        <input type="checkbox" name="interests" value="Adventure"> Adventure
        <input type="checkbox" name="interests" value="Culture"> Culture
        <input type="checkbox" name="interests" value="Food"> Food
        <br>
        <button type="submit">Get Recommendations</button>
    </form>
</body>
</html>
