<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Details</title>
</head>
<body>
    <h2>Travel Details</h2>
    <form method="post">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <br>
        <label for="duration">Trip Duration:</label>
        <input type="text" id="duration" name="duration" required>
        <br>
        <label for="interests">Interests:</label><br>
        <input type="checkbox" name="interests" value="Adventure"> Adventure<br>
        <input type="checkbox" name="interests" value="Culture"> Culture<br>
        <input type="checkbox" name="interests" value="Food"> Food<br>
        <input type="checkbox" name="interests" value="Relaxation"> Relaxation<br>
        <br>
        <button type="submit">Get Tips</button>
    </form>
    <h3>Travel Tips:</h3>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
</body>
</html>
