<!DOCTYPE html>
<html>
<head>
    <title>Travel Tipper - Favorites</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Travel Tipper</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('tips') }}">Tips</a>
            <a href="{{ url_for('favorites') }}">Favorites</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h2>Your Favorite Tips</h2>
        
        {% if favorites %}
        <div class="favorites-list">
            {% for fav in favorites %}
            <div class="favorite">
                <h3>{{ fav.destination }}</h3>
                <p>{{ fav.content }}</p>
                <form method="POST" action="{{ url_for('remove_favorite') }}">
                    <input type="hidden" name="destination" value="{{ fav.destination }}">
                    <input type="hidden" name="content" value="{{ fav.content }}">
                    <button type="submit">Remove</button>
                </form>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p>You haven't saved any favorites yet.</p>
        {% endif %}
    </div>
</body>
</html>
