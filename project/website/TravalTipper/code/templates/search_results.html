<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>
<body>
    <h1>Search Results</h1>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.destination }} - {{ tip.attractions }}
                <form method="POST" action="/save_favorite">
                    <input type="hidden" name="destination" value="{{ tip.destination }}">
                    <button type="submit">Save to Favorites</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/search_tips">New Search</a>
    <a href="/travel_tips">Back to Travel Tips</a>
    <a href="/logout">Logout</a>
</body>
</html>
