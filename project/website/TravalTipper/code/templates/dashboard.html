<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST">
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" class="form-control" id="destination" name="destination" required>
            </div>
            <div class="form-group">
                <label for="interests">Interests:</label>
                <input type="text" class="form-control" id="interests" name="interests" placeholder="Comma separated interests" required>
            </div>
            <button type="submit" class="btn btn-primary">Get Travel Tips</button>
        </form>
        <h3>Your Travel Tips:</h3>
        <ul>
            {% for tip in tips %}
                <li>
                    {{ tip[1] }} (from {{ tip[0] }})
                    <form method="POST" action="/save_favorite" style="display:inline;">
                        <input type="hidden" name="tip" value="{{ tip[1] }}">
                        <button type="submit" class="btn btn-sm btn-success">Save</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
        <h3>Your Favorite Tips:</h3>
        <ul>
            {% for favorite in favorites %}
                <li>{{ favorite }}</li>
            {% endfor %}
        </ul>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
