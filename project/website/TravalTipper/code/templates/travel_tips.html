<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Tips</title>
</head>
<body>
    <h1>Travel Tips</h1>
    <form method="POST" action="/travel_tips">
        <label for="destination">Destination:</label>
        <input type="text" name="destination" required>
        <label for="trip_duration">Trip Duration:</label>
        <input type="text" name="trip_duration" required>
        <label for="interests">Interests:</label>
        <input type="checkbox" name="interests" value="culture"> Culture
        <input type="checkbox" name="interests" value="food"> Food
        <input type="checkbox" name="interests" value="adventure"> Adventure
        <button type="submit">Get Tips</button>
    </form>
    {% if recommendations %}
        <h2>Recommendations:</h2>
        <ul>
            {% for tip in recommendations %}
                <li>{{ tip.destination }} - {{ tip.attractions }}
                    <form method="POST" action="/save_favorite">
                        <input type="hidden" name="destination" value="{{ tip.destination }}">
                        <button type="submit">Save to Favorites</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% endif %}
    <a href="/logout">Logout</a>
    <a href="/view_favorites">View Favorites</a>
    <a href="/search_tips">Search Tips</a>
</body>
</html>
