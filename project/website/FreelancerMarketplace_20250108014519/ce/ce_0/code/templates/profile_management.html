<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management</title>
</head>
<body>
    <h1>Profile Management</h1>
    <form action="/update_profile" method="POST">

    </form>
</body>
