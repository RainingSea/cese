<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management</title>
</head>
<body>
    <h1>Manage Projects</h1>
    <form method="POST" action="/project_management">
        <input type="text" name="name" placeholder="Project Name" required>
        <input type="text" name="description" placeholder="Project Description" required>
        <input type="text" name="freelancer" placeholder="Freelancer Name" required>
        <button type="submit">Create Project</button>
    </form>
    <h2>Existing Projects</h2>
    <ul>
        {% for project in projects %}
        <li>{{ project.name }} - {{ project.description }} (Freelancer: {{ project.freelancer }})</li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
