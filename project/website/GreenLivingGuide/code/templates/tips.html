<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Living Tips</title>
</head>
<body>
    <h1>Sustainable Living Tips</h1>
    <form action="/tips" method="post">
        <label for="tip">Submit a new tip:</label>
        <input type="text" id="tip" name="tip" required>
        <button type="submit">Submit</button>
    </form>
    <h2>Existing Tips:</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
</body>
</html>
