<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome, {{ username }}</h1>
    <a href="/logout">Logout</a>
    <h2>Your Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <h2>Submit a Tip</h2>
    <form action="/submit_tip" method="post">
        <input type="text" name="tip" placeholder="Enter your tip" required>
        <button type="submit">Submit a Tip</button>
    </form>
    <h2>Articles</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article }}</li>
        {% endfor %}
    </ul>
    <nav>
        <a href="/tips">Tips</a>
        <a href="/articles">Articles</a>
        <a href="/forum">Forum</a>
    </nav>
</body>
</html>
