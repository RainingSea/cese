<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Living Tips</title>
</head>
<body>
    <h1>Sustainable Living Tips</h1>
    <form action="/tips" method="post">
        <textarea name="tip_content" placeholder="Enter your tip here..." required></textarea>
        <button type="submit">Submit Tip</button>
    </form>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
