<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Living Tips</title>
</head>
<body>
    <h2>Submit a Sustainable Living Tip</h2>
    <form method="POST">
        <label for="content">Tip:</label>
        <textarea id="content" name="content" required></textarea>
        <br>
        <button type="submit">Submit Tip</button>
    </form>

    <h3>Tips List</h3>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
