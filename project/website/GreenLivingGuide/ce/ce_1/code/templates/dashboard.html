<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Sustainable Living Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <h2>Articles</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article }}</li>
        {% endfor %}
    </ul>
    <form method="POST" action="/submit_tip">
        <input type="text" name="tip" placeholder="Submit a tip" required>
        <button type="submit">Submit Tip</button>
    </form>
    <form method="POST" action="/submit_article">
        <input type="text" name="article" placeholder="Submit an article" required>
        <button type="submit">Submit Article</button>
    </form>
    <form method="POST" action="/post_forum">
        <input type="text" name="post" placeholder="Post to forum" required>
        <button type="submit">Post</button>
    </form>
</body>
</html>
