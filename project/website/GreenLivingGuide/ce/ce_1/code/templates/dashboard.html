<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Sustainable Living Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.to_string() }}</li>
        {% endfor %}
    </ul>
    <form action="/submit_tip" method="post">
        <label for="tip">Submit a Tip:</label>
        <input type="text" name="tip" required>
        <button type="submit">Submit</button>
    </form>

    <h2>Articles</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article.to_string() }}</li>
        {% endfor %}
    </ul>
    <form action="/submit_article" method="post">
        <label for="article">Submit an Article:</label>
        <input type="text" name="article" required>
        <button type="submit">Submit</button>
    </form>

    <h2>Community Forum</h2>
    <p><a href="/forum">Go to Forum</a></p>
</body>
</html>
