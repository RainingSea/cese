<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome to the Dashboard</h1>
    <h2>Your Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }} (by {{ tip.author }})</li>
        {% endfor %}
    </ul>
    <h2>Your Articles</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article.title }} (by {{ article.author }})</li>
        {% endfor %}
    </ul>
    <form action="/submit_tip" method="post">
        <h3>Submit a Tip</h3>
        <input type="text" name="content" placeholder="Enter your tip" required>
        <button type="submit">Submit</button>
    </form>
    <form action="/submit_article" method="post">
        <h3>Submit an Article</h3>
        <input type="text" name="title" placeholder="Article Title" required>
        <textarea name="content" placeholder="Article Content" required></textarea>
        <button type="submit">Submit</button>
    </form>
    <a href="/forum">Go to Forum</a>
</body>
</html>
