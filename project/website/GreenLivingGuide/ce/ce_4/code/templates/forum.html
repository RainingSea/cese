<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Community Forum</title>
</head>
<body>
    <h1>Community Forum</h1>
    <form method="POST">
        <label for="post">Submit a Post:</label>
        <input type="text" id="post" name="post" required>
        <button type="submit">Submit</button>
    </form>
    <h2>Forum Posts</h2>
    <ul>
        {% for post in posts %}
            <li>{{ post }}</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
