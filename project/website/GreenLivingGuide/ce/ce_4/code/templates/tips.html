<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sustainable Living Tips</title>
</head>
<body>
    <h1>Sustainable Living Tips</h1>
    <form method="POST">
        <label for="tip">Submit a Tip:</label>
        <input type="text" id="tip" name="tip" required>
        <button type="submit">Submit</button>
    </form>
    <h2>Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
