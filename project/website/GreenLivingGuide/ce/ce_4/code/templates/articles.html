<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Articles</title>
</head>
<body>
    <h1>Articles</h1>
    <form method="POST">
        <label for="article">Submit an Article:</label>
        <input type="text" id="article" name="article" required>
        <button type="submit">Submit</button>
    </form>
    <h2>Articles</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article }}</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
