<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips</title>
</head>
<body>
    <h2>Sustainable Living Tips</h2>
    <form method="POST">
        <label for="tip">Submit a Tip:</label>
        <input type="text" name="tip" required>
        <button type="submit">Submit</button>
    </form>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
