<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles</title>
</head>
<body>
    <h1>Articles</h1>
    <form method="POST">
        <textarea name="article" placeholder="Write your article..." required></textarea>
        <button type="submit">Submit Article</button>
    </form>
    <h2>Recent Articles</h2>
    <ul>
        {% for article in articles %}
        <li>{{ article }}</li>
        {% endfor %}
    </ul>
</body>
</html>
