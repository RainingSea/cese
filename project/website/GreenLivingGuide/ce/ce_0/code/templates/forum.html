<!DOCTYPE html>
<html>
<head>
    <title>Community Forum</title>
</head>
<body>
    <h1>Community Forum</h1>
    <h2>Posts</h2>
    <ul>
        {% for post in posts %}
            <li>{{ post }}</li>
        {% endfor %}
    </ul>
    <form method="POST">
        Post: <textarea name="post" required></textarea><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
