<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Forum</title>
</head>
<body>
    <h1>Community Forum</h1>
    <form method="POST">
        <label for="post">Share your experience:</label>
        <textarea id="post" name="post" required></textarea>
        <button type="submit">Post</button>
    </form>
    <h2>Forum Posts</h2>
    <ul id="forum-posts-list">
        <!-- Forum posts will be dynamically loaded here -->
    </ul>
</body>
</html>
