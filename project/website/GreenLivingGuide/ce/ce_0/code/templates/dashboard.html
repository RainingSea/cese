<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Articles</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article.title }} by {{ article.author }}</li>
        {% endfor %}
    </ul>
    <h2>Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }} by {{ tip.author }}</li>
        {% endfor %}
    </ul>
</body>
</html>
