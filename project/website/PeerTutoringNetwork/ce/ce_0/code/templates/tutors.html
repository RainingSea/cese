{% extends "base.html" %}

{% block content %}
<h2>Available Tutors</h2>
<div class="table-responsive mt-4">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Username</th>
                <th>Subjects</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody>
            {% for tutor in tutors %}
            <tr>
                <td>{{ tutor.username }}</td>
                <td>
                    {% for subject in tutor.subjects %}
                    <span class="badge bg-primary">{{ subject }}</span>
                    {% endfor %}
                </td>
                <td>{{ tutor.availability }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
