{% extends "base.html" %}

{% block content %}
<h2>Welcome, {{ username }}!</h2>
<div class="row mt-4">
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Find Tutors</h5>
                <p class="card-text">Browse available tutors and their subjects.</p>
                <a href="{{ url_for('tutors') }}" class="btn btn-primary">View Tutors</a>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Request Tutoring</h5>
                <p class="card-text">Submit a request for tutoring help.</p>
                <a href="{{ url_for('request_tutor') }}" class="btn btn-primary">Make Request</a>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Your Profile</h5>
                <p class="card-text">View and manage your profile and requests.</p>
                <a href="{{ url_for('profile') }}" class="btn btn-primary">View Profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
