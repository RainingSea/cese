<!DOCTYPE html>
<html>
<head>
    <title>Tutors</title>
</head>
<body>
    <h1>Available Tutors</h1>
    <ul>
        {% for tutor in tutors %}
            <li>
                <strong>{{ tutor.name }}</strong> - {{ tutor.subjects }}
            </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
