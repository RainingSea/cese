<!DOCTYPE html>
<html>
<head>
    <title>Tutors</title>
</head>
<body>
    <h1>Available Tutors</h1>
    <ul>
        {% for tutor in tutors %}
        <li>
            <h3>{{ tutor.name }}</h3>
            <p>Subjects: {{ tutor.subjects|join(', ') }}</p>
            <p>Availability: {{ tutor.availability }}</p>
        </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
