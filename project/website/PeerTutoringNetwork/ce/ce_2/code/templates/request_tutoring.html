<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Tutoring</title>
</head>
<body>
    <h2>Request Tutoring</h2>
    <form action="/request_tutoring" method="post">
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required><br><br>
        <label for="details">Details:</label>
        <textarea id="details" name="details" required></textarea><br><br>
        <label for="preferred_date">Preferred Date:</label>
        <input type="date" id="preferred_date" name="preferred_date" required><br><br>
        <input type="submit" value="Submit Request">
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
