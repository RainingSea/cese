<!DOCTYPE html>
<html>
<head>
    <title>Request Tutoring</title>
</head>
<body>
    <h1>Request Tutoring</h1>
    <form method="POST">
        <label>Subject:</label>
        <input type="text" name="subject" required><br>
        <label>Details:</label>
        <textarea name="details" required></textarea><br>
        <label>Date:</label>
        <input type="date" name="date" required><br>
        <button type="submit">Submit Request</button>
        <a href="{{ url_for('dashboard') }}">Cancel</a>
    </form>
</body>
</html>
