<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Tutoring Requests</title>
</head>
<body>
    <h1>Your Tutoring Requests</h1>
    <ul>
        {% for request in requests %}
            <li>{{ request.subject }} - {{ request.details }} on {{ request.date }}
                <form action="/cancel_request/{{ loop.index0 }}" method="POST" style="display:inline;">
                    <button type="submit">Cancel Request</button>
                </form>
            </li>
        {% else %}
            <li>No requests found.</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
