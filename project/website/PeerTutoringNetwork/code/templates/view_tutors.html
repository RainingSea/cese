<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Tutors</title>
</head>
<body>
    <h1>Available Tutors</h1>
    <ul>
        {% for tutor in tutors %}
            <li>{{ tutor.name }} - {{ tutor.subject }} ({{ tutor.availability }})</li>
        {% else %}
            <li>No tutors available.</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
