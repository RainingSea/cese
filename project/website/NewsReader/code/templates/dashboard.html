<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <a href="/logout">Logout</a>
    <h2>Articles</h2>
    <ul>
        {% if articles %}
            {% for article in articles %}
                <li><a href="/article/{{ loop.index0 }}">{{ article[0] }}</a> - {{ article[1] }}</li>
            {% endfor %}
        {% else %}
            <li>No articles available.</li>
        {% endif %}
    </ul>
</body>
</html>
