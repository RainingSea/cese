<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Welcome, {{ session['username'] }}</h2>
    <a href="/logout">Logout</a>
    <h3>Articles</h3>
    <ul>
        {% for article in articles %}
            <li><a href="/article/{{ loop.index0 }}">{{ article }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
