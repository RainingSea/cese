<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Articles</h2>
    <ul>
        {% for article in articles %}
            <li><a href="/article/{{ loop.index0 }}">{{ article }}</a></li>
        {% endfor %}
    </ul>
    <p><a href="/">Logout</a></p>
</body>
</html>
