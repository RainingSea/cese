<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browse Recipes</title>
</head>
<body>
    <h1>Browse Recipes</h1>
    <ul>
        {% for recipe in recipes %}
            <li><a href="/recipe_details/{{ recipe.split('|')[0] }}">{{ recipe.split('|')[0] }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
