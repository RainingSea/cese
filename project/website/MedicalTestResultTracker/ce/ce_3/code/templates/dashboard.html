<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <form method="POST" action="/dashboard">
        <label for="test_name">Test Name:</label>
        <input type="text" name="test_name" required>
        <br>
        <label for="result_value">Result Value:</label>
        <input type="number" name="result_value" step="0.01" required>
        <br>
        <label for="date">Date:</label>
        <input type="date" name="date" required>
        <br>
        <button type="submit">Add Test Result</button>
    </form>
    <h3>Test Results</h3>
    <ul>
        {% for result in results %}
            <li>{{ result.test_name }}: {{ result.result_value }} on {{ result.date }}</li>
        {% endfor %}
    </ul>
    <a href="/reminders">Go to Reminders</a>
    <a href="/logout">Logout</a>
</body>
</html>
