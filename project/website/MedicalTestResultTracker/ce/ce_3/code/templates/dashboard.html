<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST">
            <div class="form-group">
                <label for="test_name">Test Name:</label>
                <input type="text" class="form-control" id="test_name" name="test_name" required>
            </div>
            <div class="form-group">
                <label for="result">Result:</label>
                <input type="number" class="form-control" id="result" name="result" required>
            </div>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Test Result</button>
        </form>
        <h3>Test Results</h3>
        <ul>
            {% for result in test_results %}
                <li>{{ result.test_name }}: {{ result.result }} on {{ result.date }}</li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('reminders') }}">Go to Reminders</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</body>
</html>
