<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="post" action="/dashboard">
        <input type="text" name="test_name" placeholder="Test Name" required>
        <input type="text" name="result" placeholder="Result" required>
        <input type="date" name="date" required>
        <button type="submit">Add Test Result</button>
    </form>
    <h2>Your Test Results</h2>
    <ul>
        {% for test in test_results %}
            <li>{{ test[1] }}: {{ test[2] }} on {{ test[3] }}</li>
        {% endfor %}
    </ul>
    <a href="/reminders">View Reminders</a>
    <a href="/logout">Logout</a>
</body>
</html>
