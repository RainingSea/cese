<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>History</title>
</head>
<body>
    <h1>Test Results History</h1>
    <ul>
        {% for result in test_results %}
            <li>{{ result.test_name }} - {{ result.date }}: {{ result.result }}</li>
        {% endfor %}
    </ul>
</body>
</html>
