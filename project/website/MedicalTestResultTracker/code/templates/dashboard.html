<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Test Results</h2>
    <ul>
        {% for result in test_results %}
            <li>{{ result }}</li>
        {% endfor %}
    </ul>
    <h2>Your Reminders</h2>
    <ul>
        {% for reminder in reminders %}
            <li>{{ reminder[0] }} - {{ reminder[1] }}</li>
        {% endfor %}
    </ul>
    <a href="/test_result">Input Test Result</a>
    <a href="/reminder">Set Reminder</a>
    <a href="/logout">Logout</a>
</body>
</html>
