<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
</head>
<body>
    <h2>Welcome to Online Vintage Market</h2>
    <h3>Items for Sale</h3>
    <ul>
        {% for item in items %}
            <li><a href="/item/{{ item.name }}">{{ item.name }}</a> - ${{ item.price }}</li>
        {% endfor %}
    </ul>
    <p><a href="/listing">List a new item</a></p>
</body>
</html>
