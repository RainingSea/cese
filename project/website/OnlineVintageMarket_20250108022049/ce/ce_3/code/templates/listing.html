<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Item Listing</title>
</head>
<body>
    <h1>Item Listing</h1>
    <ul>
        {% for item in items %}
            <li><a href="/items/{{ item.name }}">{{ item.name }}</a> - ${{ item.price }}</li>
        {% endfor %}
    </ul>
    <p><a href="/">Back to Home</a></p>
</body>
</html>
