<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Welcome to Online Vintage Market</h1>
    <h2>Items for Sale</h2>
    <ul>
        {% for item in items %}
            <li><a href="/item/{{ item.name }}">{{ item.name }}</a> - ${{ item.price }}</li>
        {% endfor %}
    </ul>
    <a href="/listing">List a new item</a>
</body>
</html>
