<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs</title>
</head>
<body>
    <h1>All Job Listings</h1>
    <ul>
        {% for job in jobs %}

        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
