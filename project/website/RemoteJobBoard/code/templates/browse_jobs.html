<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browse Jobs</title>
</head>
<body>
    <h2>All Job Listings</h2>
    <ul>
        {% for job in jobs %}
            <li>{{ job.title }} - {{ job.description }} <form method="POST" action="/apply_job/{{ job.id }}"><button type="submit">Apply</button></form></li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
