<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs</title>
</head>
<body>
    <h1>All Job Listings</h1>
    <ul>
        {% for job in jobs %}
            <li>{{ job[0] }} - {{ job[1] }} ({{ job[2] }}) 
                <form action="/apply_job/{{ loop.index0 }}" method="POST" style="display:inline;">
                    <button type="submit">Apply</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/home">Home</a>
</body>
</html>
