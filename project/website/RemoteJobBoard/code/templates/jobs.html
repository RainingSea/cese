<!DOCTYPE html>
<html>
<head>
    <title>Jobs - RemoteJobBoard</title>
</head>
<body>
    <header>
        <h1>Job Listings</h1>
        <nav>
            <a href="/home">Home</a> |
            <a href="/jobs">Browse Jobs</a> |
            <a href="/post_job">Post a Job</a> |
            <a href="/profile">Profile</a> |
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <h2>Available Jobs</h2>
    <ul>
        {% for job in jobs %}
        <li>
            <h3>{{ job.title }} at {{ job.company }}</h3>
            <p>{{ job.description }}</p>
            {% if job.id not in applications %}
            <a href="/apply/{{ job.id }}">Apply</a>
            {% else %}
            <span>Applied</span>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
