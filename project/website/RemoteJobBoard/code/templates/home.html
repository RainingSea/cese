<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h2>Featured Job Listings</h2>
    <ul>
        {% for job in jobs %}
            <li>{{ job.title }} - {{ job.description }} <form method="POST" action="/apply_job/{{ job.id }}"><button type="submit">Apply</button></form></li>
        {% endfor %}
    </ul>
    <a href="/post_job">Post a Job</a>
    <a href="/logout">Logout</a>
    <a href="/profile">Profile</a>
</body>
</html>
