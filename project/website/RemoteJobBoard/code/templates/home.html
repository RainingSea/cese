<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Featured Job Listings</h1>
    <ul>
        {% for job in jobs %}
            <li>{{ job[0] }} - {{ job[1] }} ({{ job[2] }}) 
                <form action="/apply_job/{{ loop.index0 }}" method="POST" style="display:inline;">
                    <button type="submit">Apply</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <form action="/post_job" method="POST">
        <input type="text" name="title" placeholder="Job Title" required>
        <input type="text" name="description" placeholder="Job Description" required>
        <input type="text" name="company" placeholder="Company Name" required>
        <button type="submit">Post Job</button>
    </form>
    <a href="/browse_jobs">Browse Jobs</a>
    <a href="/profile">Profile</a>
</body>
</html>
