<!DOCTYPE html>
<html>
<head>
    <title>Home - RemoteJobBoard</title>
</head>
<body>
    <header>
        <h1>Welcome, {{ username }}!</h1>
        <nav>
            <a href="/home">Home</a> |
            <a href="/jobs">Browse Jobs</a> |
            <a href="/post_job">Post a Job</a> |
            <a href="/profile">Profile</a> |
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <h2>Featured Jobs</h2>
    <ul>
        {% for job in jobs %}
        <li>
            <h3>{{ job.title }} at {{ job.company }}</h3>
            <p>{{ job.description }}</p>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
