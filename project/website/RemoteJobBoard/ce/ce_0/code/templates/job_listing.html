<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Job Listings</title>
</head>
<body>
    <div class="container">
        <h2>Job Listings</h2>
        <ul class="list-group">
            {% for job in jobs %}
                <li class="list-group-item">
                    <h5>{{ job.title }}</h5>
                    <p>{{ job.company }}</p>
                    <p>{{ job.description }}</p>
                    <button class="btn btn-success">Apply</button>
                </li>
            {% endfor %}
        </ul>
        <a href="/job_posting" class="btn btn-primary">Post a Job</a>
    </div>
</body>
</html>
