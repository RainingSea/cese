<!DOCTYPE html>
<html>
<head>
    <title>Browse Jobs</title>
</head>
<body>
    <h1>Browse Jobs</h1>
    <a href="{{ url_for('home') }}">Back to Home</a>
    <ul>
        {% for job_id, job in jobs.items() %}
        <li>
            <h3>{{ job.title }} at {{ job.company }}</h3>
            <p>{{ job.description }}</p>
            <a href="{{ url_for('apply_job', job_id=job_id) }}">Apply</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
