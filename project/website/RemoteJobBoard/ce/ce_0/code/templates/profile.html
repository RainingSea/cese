<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>
    <h1>Profile</h1>
    <a href="{{ url_for('home') }}">Back to Home</a>
    <h2>User Information</h2>
    <p>Username: {{ user.username }}</p>
    <p>Email: {{ user.email }}</p>
    
    <h2>Applied Jobs</h2>
    <ul>
        {% for job in applied_jobs %}
        <li>
            <h3>{{ job.title }} at {{ job.company }}</h3>
            <p>{{ job.description }}</p>
        </li>
        {% else %}
        <li>No jobs applied yet</li>
        {% endfor %}
    </ul>
</body>
</html>
