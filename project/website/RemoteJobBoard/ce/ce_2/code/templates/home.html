<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>
    <nav>
        <a href="/jobs">Jobs</a> | 
        <a href="/profile">Profile</a> | 
        <a href="/logout">Logout</a>
    </nav>
    
    <h2>Featured Jobs</h2>
    <div>
        {% for job in jobs %}
        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
            <h3>{{ job.title }}</h3>
            <p>Company: {{ job.company }}</p>
            <p>{{ job.description }}</p>
        </div>
        {% endfor %}
    </div>
    <a href="/jobs"><button>Browse All Jobs</button></a>
</body>
</html>
