<!DOCTYPE html>
<html>
<head>
    <title>Job Listings</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h1>All Job Listings</h1>
        <div class="jobs-list">
            {% for job in jobs %}
            <div class="job-item">
                <h3>{{ job[1] }}</h3>
                <p><strong>Company:</strong> {{ job[2] }}</p>
                <p>{{ job[3] }}</p>
                <a href="{{ url_for('apply', job_id=job[0]) }}" class="button">Apply</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
