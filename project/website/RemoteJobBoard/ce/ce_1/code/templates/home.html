<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav>
            <span>Welcome, {{ username }}</span>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h1>Featured Jobs</h1>
        <div class="jobs-grid">
            {% for job in jobs %}
            <div class="job-card">
                <h3>{{ job[1] }}</h3>
                <p><strong>Company:</strong> {{ job[2] }}</p>
                <p>{{ job[3] }}</p>
            </div>
            {% endfor %}
        </div>
        <div class="actions">
            <a href="{{ url_for('jobs') }}" class="button">Browse All Jobs</a>
            <a href="{{ url_for('post_job') }}" class="button">Post a Job</a>
        </div>
    </div>
</body>
</html>
