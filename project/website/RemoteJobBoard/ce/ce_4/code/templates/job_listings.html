<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Listings</title>
</head>
<body>
    <h1>Job Listings</h1>
    <ul>
        {% for job in jobs %}
            <li>{{ job.title }} at {{ job.company }} - {{ job.description }}</li>
        {% endfor %}
    </ul>
    <a href="/job_post">Post a Job</a>
    <a href="/profile">Profile</a>
</body>
</html>
