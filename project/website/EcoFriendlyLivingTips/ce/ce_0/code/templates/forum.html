<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Forum</title>
</head>
<body>
    <h1>Community Forum</h1>
    <form method="POST">
        <label for="content">Post Content:</label>
        <textarea name="content" required></textarea>
        <button type="submit">Post</button>
    </form>
    <h2>Posts</h2>
    <ul>
        {% for post in posts %}
            <li><strong>{{ post.username }}:</strong> {{ post.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
