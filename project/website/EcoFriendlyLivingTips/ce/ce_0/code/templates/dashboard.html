<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Eco-Friendly Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.title }}: {{ tip.description }}</li>
        {% endfor %}
    </ul>
    <h2>Resources</h2>
    <ul>
        {% for resource in resources %}
            <li><a href="{{ resource.url }}">{{ resource.description }}</a></li>
        {% endfor %}
    </ul>
    <a href="/tips">Submit a Tip</a>
    <a href="/resources">Add Resource</a>
    <a href="/forum">Forum</a>
    <a href="/profile">Profile</a>
    <a href="/contact">Contact</a>
</body>
</html>
