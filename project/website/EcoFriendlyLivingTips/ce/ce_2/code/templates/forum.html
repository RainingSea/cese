<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
</head>
<body>
    <h1>Community Forum</h1>
    <ul>
        {% for post in posts %}
            <li>{{ post._title }}: {{ post._content }} (by {{ post._author }})</li>
        {% endfor %}
    </ul>
</body>
</html>
