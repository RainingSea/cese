<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
</head>
<body>
    <h1>Community Forum</h1>
    <ul>
        {% for post in posts %}
            <li>{{ post }}</li>
        {% endfor %}
    </ul>
    <form method="POST" action="/submit_post">
        <input type="text" name="post" placeholder="Submit a new post" required>
        <button type="submit">Submit</button>
    </form>
    <a href="/home">Back to Home</a>
</body>
</html>
