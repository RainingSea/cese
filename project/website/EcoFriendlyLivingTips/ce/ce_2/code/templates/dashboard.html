<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Eco-Friendly Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.title }}: {{ tip.content }}</li>
        {% endfor %}
    </ul>
    <h2>Resources</h2>
    <ul>
        {% for resource in resources %}
            <li>{{ resource.title }}: <a href="{{ resource.url }}">{{ resource.url }}</a></li>
        {% endfor %}
    </ul>
    <h2>Submit a Tip</h2>
    <form action="/submit_tip" method="post">
        <input type="text" name="title" placeholder="Tip Title" required>
        <textarea name="content" placeholder="Tip Content" required></textarea>
        <button type="submit">Submit Tip</button>
    </form>
    <h2>Submit a Resource</h2>
    <form action="/submit_resource" method="post">
        <input type="text" name="title" placeholder="Resource Title" required>
        <input type="url" name="url" placeholder="Resource URL" required>
        <button type="submit">Submit Resource</button>
    </form>
    <h2>Community Forum</h2>
    <form action="/submit_forum_post" method="post">
        <textarea name="content" placeholder="Post your message here..." required></textarea>
        <button type="submit">Post</button>
    </form>
</body>
</html>
