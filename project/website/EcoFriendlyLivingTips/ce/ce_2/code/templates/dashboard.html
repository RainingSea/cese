<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Eco-Friendly Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip._title }}: {{ tip._content }} (by {{ tip._author }})</li>
        {% endfor %}
    </ul>
    <h2>Resources</h2>
    <ul>
        {% for resource in resources %}
            <li><a href="{{ resource._url }}">{{ resource._title }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
