<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips</title>
</head>
<body>
    <h1>Eco-Friendly Living Tips</h1>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <form method="POST" action="/submit_tip">
        <input type="text" name="tip" placeholder="Submit a new tip" required>
        <button type="submit">Submit</button>
    </form>
    <a href="/home">Back to Home</a>
</body>
</html>
