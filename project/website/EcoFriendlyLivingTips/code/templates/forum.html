<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
</head>
<body>
    <h1>Forum Posts</h1>
    <ul>
        {% for post in posts %}
            <li>{{ post[0] }}: {{ post[1] }} - {{ post[2] }}</li>
        {% endfor %}
    </ul>
    <a href="/submit_post">Submit Post</a>
</body>
</html>
