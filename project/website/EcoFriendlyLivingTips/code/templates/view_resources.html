<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Resources</title>
</head>
<body>
    <h1>Resources</h1>
    <ul>
        {% for resource in resources %}
            <li>{{ resource[0] }} - <a href="{{ resource[1] }}">{{ resource[1] }}</a> - {{ resource[2] }}</li>
        {% endfor %}
    </ul>
    <a href="/submit_resource">Add Resource</a>
</body>
</html>
