<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome to EcoFriendlyLivingTips</h1>
    <nav>
        <a href="/submit_tip">Submit Tip</a>
        <a href="/view_resources">View Resources</a>
        <a href="/forum">Forum</a>
        <a href="/logout">Logout</a>
    </nav>
    <p>Here you can access eco-friendly tips, resources, and the community forum.</p>
    <h2>Registered Users</h2>
    <ul>
        {% for user in users %}
            <li>{{ user[0] }} ({{ user[2] }})</li>
        {% endfor %}
    </ul>
</body>
</html>
