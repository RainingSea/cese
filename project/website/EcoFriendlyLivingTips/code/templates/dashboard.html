<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Eco-Friendly Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.title }}: {{ tip.content }}</li>
        {% endfor %}
    </ul>
    <h2>Resources</h2>
    <ul>
        {% for resource in resources %}
            <li><a href="{{ resource.url }}">{{ resource.title }}</a></li>
        {% endfor %}
    </ul>
    <p><a href="/tips">Submit a Tip</a></p>
    <p><a href="/forum">Community Forum</a></p>
    <p><a href="/logout">Logout</a></p>
</body>
</html>
