<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Management</title>
</head>
<body>
    <h1>Manage Projects</h1>
    <form action="/project_management" method="post">
        <input type="text" name="name" placeholder="Project Name" required>
        <input type="text" name="description" placeholder="Project Description" required>
        <input type="number" name="freelancer_id" placeholder="Freelancer ID" required>
        <button type="submit">Create Project</button>
    </form>
    <h2>Existing Projects</h2>
    <ul>
        {% for project in projects %}
            <li>{{ project[0] }} - {{ project[1] }} (Freelancer ID: {{ project[2] }})</li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
