<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Home</title>
</head>
<body>
    <div class="container">
        <h2>Welcome to Freelancer Marketplace</h2>
        <h3>Search for Freelancers</h3>
        <form method="POST">
            <input type="text" name="search" placeholder="Search freelancers..." class="form-control">
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <h3>Freelancers</h3>
        <ul>
            {% for freelancer in freelancers %}
            <li><a href="/freelancer/{{ freelancer[0] }}">{{ freelancer[0] }}</a></li>
            {% endfor %}
        </ul>
        <a href="/project_management">Manage Projects</a>
    </div>
</body>
</html>
