<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Welcome to Freelancer Marketplace</h2>
    <h3>Your Projects:</h3>
    <ul>
        {% for project in projects %}
            <li>{{ project.project_name }}: {{ project.description }} (Freelancer: {{ project.freelancer }})</li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
