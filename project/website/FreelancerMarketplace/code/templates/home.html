<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Welcome to Freelancer Marketplace</h2>
    <form action="/home" method="post">
        <label for="search_name">Search for Freelancers:</label>
        <input type="text" id="search_name" name="search_name" required>
        <button type="submit">Search</button>
    </form>
    <h3>Search Results:</h3>
    <ul>
        {% for freelancer in freelancers %}
            <li>{{ freelancer.name }} - Skills: {{ freelancer.skills | join(', ') }} 
                <a href="/freelancer/{{ freelancer.name }}">View Freelancer Details</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/project_management">Manage All Projects</a>
    <a href="/profile_management">Edit Profile</a>
</body>
</html>
