<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Welcome to Freelancer Marketplace</h1>
    <form method="POST">
        <label for="name">Search Freelancer:</label>
        <input type="text" id="name" name="name" required>
        <button type="submit">Search</button>
    </form>
    <a href="/project_management">Manage Projects</a>
    <a href="/profile_management">Manage Profile</a>
    {% if freelancers %}
        <h2>Search Results:</h2>
        <ul>
            {% for freelancer in freelancers %}
                <li><a href="/freelancer/{{ freelancer.name }}">{{ freelancer.name }}</a></li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
