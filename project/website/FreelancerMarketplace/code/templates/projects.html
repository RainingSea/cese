<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
</head>
<body>
    <h1>Projects List</h1>
    <ul>
        {% for project in projects %}
            <li>
                <strong>{{ project.name }}</strong>: {{ project.description }} (Assigned to: {{ project.assigned_freelancer }})
            </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
