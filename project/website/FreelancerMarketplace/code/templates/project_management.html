<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management</title>
</head>
<body>
    <h2>Manage Projects</h2>
    <form action="/project_management" method="post">
        <label for="project_name">Project Name:</label>
        <input type="text" id="project_name" name="project_name" required>
        <br>
        <label for="project_description">Project Description:</label>
        <textarea id="project_description" name="project_description" required></textarea>
        <br>
        <label for="freelancer_name">Assign Freelancer:</label>
        <input type="text" id="freelancer_name" name="freelancer_name" required>
        <br>
        <button type="submit">Create Project</button>
    </form>
    <h3>Existing Projects:</h3>
    <ul>
        {% for project in projects %}
            <li>{{ project.name }} - {{ project.description }} (Assigned to: {{ project.freelancer }})</li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
