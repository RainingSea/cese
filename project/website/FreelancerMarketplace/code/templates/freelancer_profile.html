<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Profile</title>
</head>
<body>
    <h1>Freelancer Profile</h1>
    <div>
        <h2>Freelancer Details</h2>
        <ul>
            {% for freelancer in results %}
                <li>{{ freelancer }}</li>
            {% endfor %}
        </ul>
        {% if results|length == 0 %}
            <p>No freelancers found.</p>
        {% endif %}
    </div>
</body>
</html>
