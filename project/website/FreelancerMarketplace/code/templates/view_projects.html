<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Projects</title>
</head>
<body>
    <h1>All Projects</h1>
    <a href="/home">Back to Home</a>
    {% if projects %}
        <ul>
            {% for project in projects %}
                <li>{{ project.name }} - {{ project.description }} (Assigned to: {{ project.assigned_freelancer }})</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No projects available.</p>
    {% endif %}
</body>
</html>
