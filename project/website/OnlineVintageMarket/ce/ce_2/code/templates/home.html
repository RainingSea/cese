<!DOCTYPE html>
<html>
<head>
    <title>Vintage Items</title>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>
    <a href="/logout">Logout</a>
    <h2>Vintage Items</h2>
    <form action="/search" method="GET">
        <input type="text" name="q" placeholder="Search items..." value="{{ search_query if search_query else '' }}">
        <button type="submit">Search</button>
    </form>
    <a href="/listing">Add New Listing</a>
    <ul>
        {% for item in items %}
            <li>
                <h3>{{ item.title }} - ${{ item.price }}</h3>
                <p>{{ item.description }}</p>
                <p>Seller: {{ item.seller }}</p>
                <a href="/item/{{ item.id }}">View Details</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
