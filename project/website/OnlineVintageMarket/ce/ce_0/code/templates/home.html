<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Welcome to Online Vintage Market</h1>
    <h2>Available Vintage Items</h2>
    <ul>
        {% for item in items %}
            <li>
                {{ item.name }} - ${{ item.price }}
                <a href="{{ url_for('item_details', name=item.name) }}">Item Details</a>
            </li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('listing') }}">List a new item</a></p>
</body>
</html>
