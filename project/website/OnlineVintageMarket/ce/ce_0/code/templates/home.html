<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Available Vintage Items</h2>
    <ul>
        {% for item in items %}
            <li><a href="/item/{{ item.id }}">{{ item.name }}</a> - ${{ item.price }}</li>
        {% endfor %}
    </ul>
    <a href="/listing">List a New Item</a>
</body>
</html>
