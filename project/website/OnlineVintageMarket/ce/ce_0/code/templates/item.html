<!DOCTYPE html>
<html>
<head>
    <title>{{ item.name }}</title>
</head>
<body>
    <h1>{{ item.name }}</h1>
    <a href="/home">Back to Home</a>
    
    <div style="margin-top: 20px;">
        <p><strong>Description:</strong> {{ item.description }}</p>
        <p><strong>Price:</strong> ${{ "%.2f"|format(item.price) }}</p>
        <p><strong>Seller:</strong> {{ item.seller }}</p>
    </div>
</body>
</html>
