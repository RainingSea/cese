<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Available Vintage Items</h1>
    <input type="text" placeholder="Search items...">
    <ul>
        {% for item in items %}
        <li>
            {{ item.name }} - <a href="{{ url_for('item_details', item_id=loop.index0) }}">Item Details</a>
        </li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('listing') }}">List a new item</a></p>
</body>
</html>
