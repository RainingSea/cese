<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Available Vintage Items</h1>
    <input type="text" placeholder="Search items...">
    <ul>
        {% for item in items %}
            <li>
                <a href="/item/{{ item }}">{{ item }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/listing">List a new item</a>
    <a href="/logout">Logout</a>
</body>
</html>
