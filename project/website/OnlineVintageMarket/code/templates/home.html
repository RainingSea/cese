<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Vintage Items</h2>
    <form method="POST">
        <input type="text" name="search_query" placeholder="Search for items...">
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for item in items %}
            <li>
                <a href="{{ url_for('item_details', item_id=item.item_id) }}">{{ item.name }}</a> - ${{ item.price }}
            </li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('listing') }}">Create New Listing</a></p>
    <p><a href="{{ url_for('login') }}">Logout</a></p>
</body>
</html>
