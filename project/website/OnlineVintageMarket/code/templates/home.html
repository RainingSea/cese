<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Available Vintage Items</h1>
    <form method="POST">
        <input type="text" name="search_query" placeholder="Search for items...">
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for item in items %}
            <li>
                <a href="{{ url_for('item_details', item_name=item.name) }}">{{ item.name }}</a>
            </li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('create_item') }}">Create New Listing</a></p>
</body>
</html>
