<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Vintage Items</h1>
    <a href="/listing">List a new item</a>
    <form method="GET" action="/search">
        <input type="text" name="query" placeholder="Search for an item" required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for item in items %}
            <li>
                <a href="/item/{{ item.name }}">{{ item.name }}</a> - {{ item.price }}$
            </li>
        {% endfor %}
    </ul>
</body>
</html>
