<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Marketplace</a>
        <div class="navbar-text">
            Welcome, {{ username }}! <a href="/logout" class="btn btn-sm btn-outline-light ml-2">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-6">
                <form action="/home" method="GET">
                    <div class="input-group">
                        <input type="text" class="form-control" name="query" placeholder="Search items...">
                        <div class="input-group-append">
                            <button class="btn btn-dark" type="submit">Search</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-md-6 text-right">
                <a href="/listing" class="btn btn-dark">Add New Listing</a>
            </div>
        </div>
        <div class="row">
            {% for item in items %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ item.title }}</h5>
                        <p class="card-text">{{ item.description }}</p>
                        <p class="text-muted">${{ "%.2f"|format(item.price) }}</p>
                        <a href="/item/{{ item.id }}" class="btn btn-dark btn-sm">View Details</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
