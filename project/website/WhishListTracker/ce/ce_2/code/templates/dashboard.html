<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Wishlist Dashboard</h2>
        <form method="POST">
            <div class="form-group">
                <label for="item_name">Item Name:</label>
                <input type="text" class="form-control" name="item_name" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <input type="text" class="form-control" name="description" required>
            </div>
            <div class="form-group">
                <label for="price">Desired Price:</label>
                <input type="number" class="form-control" name="price" required>
            </div>
            <button type="submit" name="add" class="btn btn-success">Add Item</button>
        </form>
        <h3>Current Wishlist</h3>
        <ul class="list-group">
            {% for item in items %}
                <li class="list-group-item">
                    {{ item.item_name }} - {{ item.description }} - ${{ item.price }}
                    <form method="POST" style="display:inline;">
                        <input type="hidden" name="item_name" value="{{ item.item_name }}">
                        <input type="hidden" name="description" value="{{ item.description }}">
                        <input type="hidden" name="price" value="{{ item.price }}">
                        <button type="submit" name="update" class="btn btn-warning btn-sm">Update</button>
                    </form>
                    <form method="POST" style="display:inline;">
                        <input type="hidden" name="item_name" value="{{ item.item_name }}">
                        <button type="submit" name="remove" class="btn btn-danger btn-sm">Remove</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
        <a href="/logout" class="btn btn-secondary">Logout</a>
    </div>
</body>
</html>
