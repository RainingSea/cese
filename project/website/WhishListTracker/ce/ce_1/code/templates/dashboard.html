<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome to your Wishlist, {{ session['username'] }}</h1>
    <form method="POST">
        <h2>Add Item</h2>
        <label for="item_name">Item Name:</label>
        <input type="text" id="item_name" name="item_name" required>
        <br>
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required>
        <br>
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required>
        <br>
        <button type="submit" name="add_item">Add Item</button>
    </form>

    <h2>Your Wishlist</h2>
    <ul>
        {% for item in wishlist %}
            <li>
                {{ item[0] }} - {{ item[1] }} - ${{ item[2] }}
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="item_name" value="{{ item[0] }}">
                    <button type="submit" name="remove_item">Remove</button>
                </form>
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="old_item_name" value="{{ item[0] }}">
                    <input type="text" name="new_item_name" placeholder="New Name" required>
                    <input type="text" name="new_description" placeholder="New Description" required>
                    <input type="number" name="new_price" placeholder="New Price" required>
                    <button type="submit" name="update_item">Update</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <a href="/logout">Logout</a>
</body>
</html>
