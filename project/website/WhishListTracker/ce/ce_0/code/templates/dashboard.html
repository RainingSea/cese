<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <form method="POST">
            <div class="form-group">
                <label for="name">Item Name:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <input type="text" class="form-control" id="description" name="description" required>
            </div>
            <div class="form-group">
                <label for="price">Price:</label>
                <input type="number" class="form-control" id="price" name="price" required step="0.01">
            </div>
            <button type="submit" name="add_item" class="btn btn-primary">Add Item</button>
        </form>
        <h3>Your Wishlist</h3>
        <ul class="list-group">
            {% for item in items %}
                <li class="list-group-item">{{ item.name }} - {{ item.description }} - ${{ item.price }}</li>
            {% endfor %}
        </ul>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
