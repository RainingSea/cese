<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips</title>
</head>
<body>
    <h1>Sustainable Living Tips</h1>
    <form method="POST">
        <textarea name="content" required></textarea>
        <button type="submit">Submit Tip</button>
    </form>
    <h2>Submitted Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
</body>
</html>
