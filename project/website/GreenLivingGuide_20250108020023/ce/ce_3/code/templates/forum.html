<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forum</title>
</head>
<body>
    <h1>Community Forum</h1>
    <form action="/forum" method="post">
        <textarea name="content" required></textarea>
        <button type="submit">Post</button>
    </form>
    <ul>
        {% for post in posts %}
            <li><strong>{{ post.username }}:</strong> {{ post.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
