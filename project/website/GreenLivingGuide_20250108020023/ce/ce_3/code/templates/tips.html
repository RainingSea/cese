<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tips</title>
</head>
<body>
    <h1>Sustainable Living Tips</h1>
    <form action="/tips" method="post">
        <textarea name="tip" required></textarea>
        <button type="submit">Submit Tip</button>
    </form>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
