<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips Archive</title>
</head>
<body>
    <h1>Health Tips Archive</h1>
    <ul>
        {% for tip in tips %}
        <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <form action="/search_tips" method="post">
        <label for="query">Search Tips:</label>
        <input type="text" id="query" name="query" required>
        <button type="submit">Search</button>
    </form>
    <a href="/tip_display">Back to Daily Tip</a>
</body>
</html>
