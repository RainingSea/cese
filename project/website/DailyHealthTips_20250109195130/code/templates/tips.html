<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Health Tips</title>
</head>
<body>
    <h1>Daily Health Tips</h1>
    <form method="POST">
        <input type="text" name="search" placeholder="Search tips..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }} ({{ tip.date }})</li>
        {% endfor %}
    </ul>
    <a href="/feedback">Give Feedback</a>
    <a href="/archive">View Archive</a>
</body>
</html>
