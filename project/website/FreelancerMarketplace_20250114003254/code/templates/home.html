<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Welcome to the Freelancer Platform</h1>
    <form method="post">
        <label for="search_query">Search Freelancers:</label>
        <input type="text" id="search_query" name="search_query">
        <button type="submit">Search</button>
    </form>
    <h2>Available Freelancers</h2>
    <ul>
        {% for freelancer in freelancers %}
            <li><a href="{{ url_for('freelancer_profile', name=freelancer.name) }}">{{ freelancer.name }}</a>: {{ freelancer.details }}</li>
        {% endfor %}
    </ul>
    <a href="/project_management">Manage Projects</a>
    <a href="/profile_management">Manage Profile</a>
</body>
</html>
