<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Welcome, {{ session['username'] }}</h2>
    <h3>Your Tasks</h3>
    <ul>
        {% for task in tasks %}
            <li>{{ task[0] }} (Due: {{ task[1] }})</li>
        {% endfor %}
    </ul>
    <form method="POST">
        <input type="text" name="description" placeholder="Task Description" required>
        <input type="date" name="due_date" required>
        <button type="submit" name="add_task">Add Task</button>
    </form>
    <form method="POST">
        <input type="text" name="task_description" placeholder="Task Description to Remove" required>
        <button type="submit" name="remove_task">Remove Task</button>
    </form>
    <p><a href="/logout">Logout</a></p>
</body>
</html>
