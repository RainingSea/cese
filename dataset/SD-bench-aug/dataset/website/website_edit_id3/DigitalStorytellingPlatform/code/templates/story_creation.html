<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create or Edit Story</title>
</head>
<body>
    <h1>Create a New Story</h1>
    <form method="POST" action="/story_creation">
        <label for="title">Story Title:</label>
        <input type="text" id="title" name="title" required>
        <br>
        <label for="content">Story Content:</label>
        <textarea id="content" name="content" required></textarea>
        <br>
        <button type="submit">Save Story</button>
    </form>
    <h1>Edit Existing Story</h1>
    <form method="POST" action="/edit_story">
        <label for="edit_title">Story Title:</label>
        <input type="text" id="edit_title" name="title" required>
        <br>
        <label for="edit_content">New Content:</label>
        <textarea id="edit_content" name="content" required></textarea>
        <br>
        <button type="submit">Edit Story</button>
    </form>
    <a href="/">Logout</a>
</body>
</html>
