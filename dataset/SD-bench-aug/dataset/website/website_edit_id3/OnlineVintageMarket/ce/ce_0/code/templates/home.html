<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Available Vintage Items</h1>
    <form method="POST" action="/home">
        <input type="text" name="search" placeholder="Search items..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for item in items %}
            <li>
                <a href="{{ url_for('item_details', item_id=loop.index0) }}">{{ item.name }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/listing">Create New Listing</a>
</body>
</html>
