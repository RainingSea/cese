<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details</title>
</head>
<body>
    <h1>{{ details.title }}</h1>
    <h2>Ingredients:</h2>
    <ul>
        {% for ingredient in details.ingredients %}
            <li>{{ ingredient }}</li>
        {% endfor %}
    </ul>
    <h2>Instructions:</h2>
    <p>{{ details.instructions }}</p>
    <a href="/recipe_browsing">Back to Browsing</a>
</body>
</html>
