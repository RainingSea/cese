<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Recipes</title>
</head>
<body>
    <h1>Browse Recipes</h1>
    <form method="POST" action="/recipe_browsing">
        <input type="text" name="keyword" placeholder="Search recipes..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for recipe in recipes %}
            <li><a href="/recipe_details/{{ recipe.split('|')[0] }}">{{ recipe.split('|')[0] }}</a></li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
