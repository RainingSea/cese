<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs</title>
</head>
<body>
    <h1>Browse Job Listings</h1>
    <a href="/home">Home</a>
    <a href="/logout">Logout</a>
    <ul>
        {% for job in jobs %}
            <li>
                {{ job.title }} at {{ job.company }} - {{ job.description }}
                <form action="/apply/{{ job.title }}" method="post" style="display:inline;">
                    <button type="submit">Apply</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
