<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Welcome to Freelancer Marketplace</h1>
    <form action="/search" method="get">
        <input type="text" name="search" placeholder="Search for freelancers...">
        <button type="submit">Search</button>
    </form>
    <h2>Freelancer Search Results:</h2>
    <ul>
        {% if freelancers %}
            {% for freelancer in freelancers %}
                <li>{{ freelancer }}</li>
            {% endfor %}
        {% else %}
            <li>No freelancers found.</li>
        {% endif %}
    </ul>
    <a href="/manage_projects">Manage All Projects</a>
    <a href="/profile_management">Profile Management</a>
</body>
</html>
