<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Projects</title>
</head>
<body>
    <h1>Manage Projects</h1>
    <h2>Create New Project</h2>
    <form method="POST" action="/manage_projects">
        <label for="project_name">Project Name:</label>
        <input type="text" id="project_name" name="project_name" required>
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required>
        <label for="assigned_freelancer">Assigned Freelancer:</label>
        <input type="text" id="assigned_freelancer" name="assigned_freelancer" required>
        <button type="submit">Create Project</button>
    </form>
    <h2>Existing Projects</h2>
    <ul>
        {% for project in projects %}
            <li>{{ project.project_name }} - {{ project.description }} (Assigned to: {{ project.assigned_freelancer }})</li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
