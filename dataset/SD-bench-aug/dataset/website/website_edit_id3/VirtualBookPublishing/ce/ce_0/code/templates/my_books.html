<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books</title>
</head>
<body>
    <h2>My Published Books</h2>
    <ul>
        {% for book in books %}
            <li>
                <a href="{{ url_for('book_details', book_id=loop.index0) }}">{{ book.title }}</a> by {{ book.author }}
            </li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
