<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog Page</title>
</head>
<body>
    <h1>Welcome to the Blog</h1>
    <p><a href="/new_post">Create New Post</a></p>
    <h2>Your Posts:</h2>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ post.title }}">{{ post.title }}</a>
                <form action="/delete_post/{{ post.title }}" method="POST" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <p><a href="/logout">Logout</a></p>
</body>
</html>
