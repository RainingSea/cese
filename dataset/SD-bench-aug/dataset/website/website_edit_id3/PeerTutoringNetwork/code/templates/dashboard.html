<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Available Tutors</h2>
    <ul>
        {% for tutor in tutors %}
            <li>{{ tutor.name }} - {{ tutor.subject }}</li>
        {% endfor %}
    </ul>
    <h2>Request Tutoring</h2>
    <form action="/dashboard" method="post">
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required>
        <label for="details">Details:</label>
        <textarea id="details" name="details" required></textarea>
        <label for="preferred_date">Preferred Date:</label>
        <input type="date" id="preferred_date" name="preferred_date" required>
        <button type="submit">Request Tutoring</button>
    </form>
    <h2>Your Tutoring Requests</h2>
    <ul>
        {% for request in requests %}
            <li>{{ request.subject }} - {{ request.details }} 
                <form action="/cancel_request" method="post" style="display:inline;">
                    <input type="hidden" name="subject" value="{{ request.subject }}">
                    <button type="submit">Cancel</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/profile">Profile</a>
    <a href="/contact">Contact</a>
</body>
</html>
