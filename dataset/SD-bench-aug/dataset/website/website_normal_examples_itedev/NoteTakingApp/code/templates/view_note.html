<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>
</head>
<body>
    <h1>View Note</h1>
    {% if note %}
        <h2>{{ note.title }}</h2>
        <p>{{ note.content }}</p>
        <form action="/view_note?title={{ note.title }}" method="post">
            <label for="content">Edit Content:</label>
            <textarea id="content" name="content" required>{{ note.content }}</textarea>
            <br>
            <button type="submit" name="edit">Save Changes</button>
            <button type="submit" name="delete">Delete Note</button>
        </form>
    {% else %}
        <p>Note not found.</p>
    {% endif %}
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
