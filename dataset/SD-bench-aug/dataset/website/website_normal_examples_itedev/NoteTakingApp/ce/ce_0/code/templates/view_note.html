<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>
</head>
<body>
    <h1>{{ note.title }}</h1>
    <p>{{ note.content }}</p>
    <form method="POST" action="{{ url_for('view_note', title=note.title) }}">
        <label for="content">Edit Content:</label>
        <textarea id="content" name="content" required>{{ note.content }}</textarea>
        <br>
        <button type="submit" name="edit">Save Changes</button>
        <button type="submit" name="delete">Delete Note</button>
    </form>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
