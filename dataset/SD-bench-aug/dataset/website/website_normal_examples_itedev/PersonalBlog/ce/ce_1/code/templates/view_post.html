<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Post</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <a href="/edit/{{ post.title }}">Edit Post</a>
    <form action="/delete/{{ post.title }}" method="post" style="display:inline;">
        <button type="submit">Delete Post</button>
    </form>
    <a href="/main">Back to Main</a>
</body>
</html>
