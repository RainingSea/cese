<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post</title>
</head>
<body>
    <h1>Edit Post</h1>
    <form action="/edit/{{ post.title }}" method="post">
        <label for="new_title">New Title:</label>
        <input type="text" id="new_title" name="new_title" value="{{ post.title }}" required>
        <label for="new_content">New Content:</label>
        <textarea id="new_content" name="new_content" required>{{ post.content }}</textarea>
        <button type="submit">Update Post</button>
    </form>
    <a href="/main">Back to Main</a>
</body>
</html>
