<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog Page</title>
</head>
<body>
    <h1>Welcome to your Blog</h1>
    <a href="/logout">Logout</a>
    <h2>Your Posts</h2>
    <ul>
        {% for post in posts %}
            <li>{{ post.title }} - <a href="/view/{{ post.title }}">View</a></li>
        {% endfor %}
    </ul>
    <a href="/new_post">Create New Post</a>
</body>
</html>
