<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog</title>
</head>
<body>
    <h1>Welcome to Your Blog, {{ session['username'] }}</h1>
    <a href="{{ url_for('new_post') }}">Create New Post</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    <h2>Your Posts</h2>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{{ url_for('view_post', title=post['title']) }}">{{ post['title'] }}</a>
                <form method="POST" action="{{ url_for('delete_post', title=post['title']) }}">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
