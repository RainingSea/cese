<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Tutors</title>
</head>
<body>
    <h2>Available Tutors</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Subject</th>
        </tr>
        {% for tutor in tutors %}
        <tr>
            <td>{{ tutor.name }}</td>
            <td>{{ tutor.subject }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
