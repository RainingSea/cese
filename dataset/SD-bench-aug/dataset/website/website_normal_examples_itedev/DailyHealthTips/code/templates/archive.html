<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive</title>
</head>
<body>
    <h1>Welcome, {{ username }}</h1>
    <h2>Today's Health Tip:</h2>
    <p>{{ daily_tip }}</p>
    <h2>All Health Tips:</h2>
    <ul>
        {% for tip in all_tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('feedback') }}">Submit Feedback</a>
    <a href="{{ url_for('login') }}">Logout</a>
</body>
</html>
