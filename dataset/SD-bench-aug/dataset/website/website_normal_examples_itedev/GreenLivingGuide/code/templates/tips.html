<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Living Tips</title>
</head>
<body>
    <h1>Sustainable Living Tips</h1>
    <form method="POST">
        <label for="tip_content">Submit a Tip:</label>
        <input type="text" id="tip_content" name="tip_content" required>
        <button type="submit">Submit</button>
    </form>
    <h2>Tips List</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
</body>
</html>
