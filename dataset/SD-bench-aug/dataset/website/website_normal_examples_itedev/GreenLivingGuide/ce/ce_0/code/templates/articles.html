<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Living Articles</title>
</head>
<body>
    <h1>Sustainable Living Articles</h1>
    <form method="POST">
        <label for="article_title">Article Title:</label>
        <input type="text" id="article_title" name="article_title" required>
        <br>
        <label for="article_content">Article Content:</label>
        <textarea id="article_content" name="article_content" required></textarea>
        <br>
        <button type="submit">Submit Article</button>
    </form>
    <h2>Existing Articles:</h2>
    <ul>
        {% for article in articles %}
            <li><strong>{{ article[0] }}:</strong> {{ article[1] }}</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
