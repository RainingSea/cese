<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Living Tips</title>
</head>
<body>
    <h1>Sustainable Living Tips</h1>
    <form method="POST">
        <label for="tip_content">Submit a new tip:</label>
        <textarea id="tip_content" name="tip_content" required></textarea>
        <br>
        <button type="submit">Submit Tip</button>
    </form>
    <h2>Existing Tips:</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip }}</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
