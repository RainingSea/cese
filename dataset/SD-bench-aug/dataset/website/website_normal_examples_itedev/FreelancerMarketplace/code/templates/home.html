<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>
    <form method="POST">
        <label for="search_name">Search for Freelancers:</label>
        <input type="text" id="search_name" name="search_name" required>
        <button type="submit">Search</button>
    </form>
    
    <h2>Freelancer Results:</h2>
    <ul>
        {% for freelancer in freelancers %}
            <li>
                {{ freelancer.name }} - Skills: {{ freelancer.skills | join(', ') }}
                <a href="{{ url_for('freelancer_profile', name=freelancer.name) }}">View Freelancer Details</a>
            </li>
        {% else %}
            <li>No freelancers found.</li>
        {% endfor %}
    </ul>
</body>
</html>
