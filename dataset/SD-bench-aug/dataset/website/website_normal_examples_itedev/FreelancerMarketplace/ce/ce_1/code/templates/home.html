<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Welcome to Freelancer Marketplace</h2>
    <form method="GET" action="/home">
        <label for="search">Search for Freelancers:</label>
        <input type="text" id="search" name="search" placeholder="Enter freelancer name">
        <button type="submit">Search</button>
    </form>
    
    <h3>Freelancer List</h3>
    <ul>
        {% for freelancer in freelancers %}
            <li>
                {{ freelancer.name }} 
                <a href="/freelancer/{{ freelancer.name }}">View Freelancer Details</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
