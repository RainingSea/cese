<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management</title>
</head>
<body>
    <h2>Project Management</h2>
    <form method="POST">
        <label for="project_name">Project Name:</label>
        <input type="text" id="project_name" name="project_name" required>
        <br>
        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>
        <br>
        <label for="freelancer">Select Freelancer:</label>
        <select id="freelancer" name="freelancer" required>
            {% for freelancer in freelancers %}
                <option value="{{ freelancer.name }}">{{ freelancer.name }}</option>
            {% endfor %}
        </select>
        <br>
        <button type="submit">Create Project</button>
    </form>
    
    <h3>Existing Projects</h3>
    <ul>
        {% for project in projects %}
            <li>
                <strong>{{ project.name }}</strong>: {{ project.description }} (Assigned to: {{ project.freelancer }})
            </li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
