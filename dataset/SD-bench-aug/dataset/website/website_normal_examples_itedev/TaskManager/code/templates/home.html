<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h2>Task Manager</h2>
    <form method="POST">
        <button type="submit" name="logout">Logout</button>
    </form>
    <h3>Your Tasks</h3>
    <ul>
        {% for task in tasks %}
            <li>{{ task[0] }} - Due: {{ task[1] }} 
                <form method="POST" action="/remove_task">
                    <input type="hidden" name="task_description" value="{{ task[0] }}">
                    <button type="submit">Remove Task</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <h3>Add New Task</h3>
    <form method="POST">
        <label for="task_description">Task Description:</label>
        <input type="text" id="task_description" name="task_description" required>
        <br>
        <label for="due_date">Due Date:</label>
        <input type="date" id="due_date" name="due_date" required>
        <br>
        <button type="submit" name="add_task">Add Task</button>
    </form>
    <p><a href="/">Back to Login</a></p>
</body>
</html>
