<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
</head>
<body>
    <h1>Task Manager</h1>
    <form method="POST">
        <input type="text" name="task_description" placeholder="Task Description" required>
        <input type="date" name="due_date" required>
        <button type="submit" name="add_task">Add Task</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>{{ task[0] }} (Due: {{ task[1] }}) 
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="task_description" value="{{ task[0] }}">
                    <button type="submit" name="remove_task">Remove Task</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
