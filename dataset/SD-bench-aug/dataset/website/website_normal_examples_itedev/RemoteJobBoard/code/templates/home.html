<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Remote Job Board</title>
</head>
<body>
    <h1>Featured Job Listings</h1>
    <ul>
        {% for job in jobs %}
            <li>
                <h2>{{ job.title }}</h2>
                <p><strong>Company:</strong> {{ job.company }}</p>
                <p>{{ job.description }}</p>
            </li>
        {% endfor %}
    </ul>
    <a href="/browse_jobs">Browse All Jobs</a>
    <a href="/profile">Profile</a>
    <a href="/logout">Logout</a>
</body>
</html>
