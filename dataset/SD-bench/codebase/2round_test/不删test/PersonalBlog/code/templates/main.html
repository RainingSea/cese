<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog Page</title>
</head>
<body>
    <h2>Welcome to the Blog</h2>
    <a href="/logout">Logout</a>
    <h3>Blog Posts</h3>
    <ul>
        {% for post in posts %}
            <li>{{ post[0] }} by {{ post[2] }} - <a href="/view/{{ post[0] }}">View</a> - <a href="/edit_post/{{ post[0] }}">Edit</a> - 
            <form action="/delete_post/{{ post[0] }}" method="POST" style="display:inline;">
                <button type="submit">Delete</button>
            </form></li>
        {% endfor %}
    </ul>
    <a href="/new_post">Create New Post</a>
</body>
</html>
