<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form action="/submit_tip" method="POST">
        <input type="text" name="content" placeholder="Enter your tip" required>
        <button type="submit">Submit Tip</button>
    </form>
    <form action="/submit_article" method="POST">
        <input type="text" name="title" placeholder="Article Title" required>
        <textarea name="content" placeholder="Article Content" required></textarea>
        <button type="submit">Submit Article</button>
    </form>
    <a href="/forum">Go to Forum</a>
    <a href="/logout">Logout</a>
    <h2>Your Tips</h2>
    <ul>
        {% for tip in tips %}
            <li>{{ tip.content }}</li>
        {% endfor %}
    </ul>
    <h2>Your Articles</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article.title }}: {{ article.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
