<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Available Vintage Items</h1>
    <ul>
        {% if items %}
            {% for item in items %}
                <li><a href="/item/{{ item.name }}">{{ item.name }}</a> - ${{ item.price }}</li>
            {% endfor %}
        {% else %}
            <li>No items available.</li>
        {% endif %}
    </ul>
    <a href="/listing">List a New Item</a>
</body>
</html>
