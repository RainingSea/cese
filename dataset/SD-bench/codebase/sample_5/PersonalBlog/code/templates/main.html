<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Blog</title>
</head>
<body>
    <h1>Blog Posts</h1>
    <a href="/new_post">Create New Post</a>
    <a href="/logout">Logout</a>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ loop.index0 }}">{{ post.title }}</a> by {{ post.username }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
