<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog</title>
</head>
<body>
    <h1>Blog Posts</h1>
    <a href="/new_post">Create New Post</a>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ post.post_id }}">{{ post.title }}</a>
                <form action="/delete_post/{{ post.post_id }}" method="post" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
