<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog</title>
</head>
<body>
    <h2>Welcome to your Blog</h2>
    <a href="/new_post">Create New Post</a>
    <a href="/logout">Logout</a>
    <h3>Your Posts</h3>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ loop.index0 }}">{{ post.title }}</a>
                <a href="/edit_post/{{ loop.index0 }}">Edit</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
