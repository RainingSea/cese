<!DOCTYPE html>
<html>
<head>
    <title>Edit Post</title>
</head>
<body>
    <h2>Edit Post: {{ post.title }}</h2>
    <form method="POST" action="/edit_post/{{ post.title }}">
        Content: <textarea name="content" required>{{ post.content }}</textarea><br>
        <input type="submit" value="Update Post">
    </form>
</body>
</html>
