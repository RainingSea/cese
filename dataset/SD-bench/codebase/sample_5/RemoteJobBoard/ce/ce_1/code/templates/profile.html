<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>
<body>
    <h1>User Profile</h1>
    <p>Username: {{ profile.username }}</p>
    <h2>Applied Jobs</h2>
    <ul>
        {% for job in profile.applied_jobs %}
            <li>{{ job }}</li>
        {% endfor %}
    </ul>
    <p><a href="/home">Home</a></p>
</body>
</html>
