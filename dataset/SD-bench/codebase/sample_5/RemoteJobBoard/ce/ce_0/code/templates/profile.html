<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>
    <h1>User Profile</h1>
    <p>Username: {{ user.username }}</p>
    <p>Email: {{ user.email }}</p>
    <h2>Applied Jobs</h2>
    <ul>
        {% for job in user.applied_jobs %}
        <li>{{ job }}</li>
        {% endfor %}
    </ul>
</body>
</html>
