<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Stories</title>
</head>
<body>
    <h1>Your Stories</h1>
    <ul>
        {% for story in stories %}
            <li>
                <strong>{{ story.title }}</strong>: {{ story.content }}
                <a href="/edit_story/{{ story.title }}">Edit</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/create_story">Create New Story</a>
    <a href="/">Logout</a>
</body>
</html>
