<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Note</title>
</head>
<body>
    <h1>{{ note[0] }}</h1>
    <p>{{ note[1] }}</p>
    <a href="/edit_note/{{ note[0] }}">Edit</a>
    <form action="{{ url_for('delete_note', title=note[0]) }}" method="post">
        <button type="submit">Delete</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
