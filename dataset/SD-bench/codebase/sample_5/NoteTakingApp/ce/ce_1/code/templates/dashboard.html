<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Your Notes</h1>
    <a href="/add_note">Add Note</a>
    <ul>
        {% for note in notes %}
            <li>
                <a href="{{ url_for('view_note', title=note.title) }}">{{ note.title }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/search_note">Search Notes</a>
</body>
</html>
