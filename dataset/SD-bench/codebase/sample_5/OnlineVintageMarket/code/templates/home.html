<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>Available Vintage Items</h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <form method="GET" action="/search">
        <input type="text" name="query" placeholder="Search items..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for item in items %}
            <li><a href="/item/{{ item.name }}">{{ item.name }}</a> - ${{ item.price }}</li>
        {% endfor %}
    </ul>
    <a href="/listing">Create Listing</a>
</body>
</html>
