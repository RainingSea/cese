<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <a href="/new_entry">New Entry</a>
    <h2>Your Journal Entries</h2>
    <ul>
        {% for entry in entries %}
            <li>{{ entry.title }} - {{ entry.date }}<br>{{ entry.content }}</li>
        {% endfor %}
    </ul>
    <a href="/">Logout</a>
</body>
</html>
