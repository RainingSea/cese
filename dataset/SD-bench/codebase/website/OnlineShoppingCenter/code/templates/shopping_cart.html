<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
</head>
<body>
    <h1>Your Shopping Cart</h1>
    <ul>
        {% for product_id, quantity in items.items() %}
            <li>Product ID: {{ product_id }} - Quantity: {{ quantity }} 
                <a href="/remove_from_cart/{{ product_id }}">Remove</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/checkout">Checkout</a>
    <a href="/back_to_products">Continue Shopping</a>
</body>
</html>
