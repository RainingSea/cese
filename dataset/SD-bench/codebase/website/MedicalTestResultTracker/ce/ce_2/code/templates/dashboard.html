<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Your Test Results</h2>
    <ul>
        {% for result in test_results %}
            <li>{{ result.test_name }}: {{ result.result }} on {{ result.date }}</li>
        {% endfor %}
    </ul>
    <a href="/history">View History</a>
    <a href="/logout">Logout</a>
</body>
</html>
