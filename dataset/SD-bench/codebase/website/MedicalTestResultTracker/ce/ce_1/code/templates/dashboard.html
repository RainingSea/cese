<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <h2>Test Results</h2>
    <form method="POST">
        <input type="text" name="test_name" placeholder="Test Name" required>
        <input type="text" name="result" placeholder="Result" required>
        <input type="date" name="date" required>
        <input type="date" name="reminder_date" placeholder="Reminder Date">
        <button type="submit">Add Test Result</button>
    </form>
    <ul>
        {% for result in test_results %}
            <li>{{ result.test_name }}: {{ result.result }} on {{ result.date }}</li>
        {% endfor %}
    </ul>
    <h2>Reminders</h2>
    <ul>
        {% for reminder in reminders %}
            <li>Reminder for {{ reminder.test_name }} on {{ reminder.reminder_date }}</li>
        {% endfor %}
    </ul>
    <a href="/logout">Logout</a>
</body>
</html>
