<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Detail</title>
</head>
<body>
    <h1>{{ movie.title }}</h1>
    <p>Genre: {{ movie.genre }}</p>
    <p>Year: {{ movie.year }}</p>
    <a href="{{ url_for('add_favorite', movie_title=movie.title) }}">Add to Favorites</a>
    <a href="{{ url_for('index') }}">Back to Recommendations</a>
</body>
</html>
