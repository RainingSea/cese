<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
</head>
<body>
    <h1>Search Results</h1>
    <ul>
        {% for movie in movies %}
            <li>
                <a href="{{ url_for('movie_detail', title=movie.title) }}">{{ movie.title }}</a> ({{ movie.year }}) 
                <a href="{{ url_for('add_favorite', movie_title=movie.title) }}">Add to Favorites</a>
            </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('index') }}">Back to Recommendations</a>
</body>
</html>
