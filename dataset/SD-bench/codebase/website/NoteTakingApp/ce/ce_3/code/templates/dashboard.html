<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Dashboard</h2>
    <a href="/add_note">Add Note</a>
    <h3>Your Notes</h3>
    <ul>
        {% for note in notes %}
            <li>
                <a href="/view_note/{{ note.title }}">{{ note.title }}</a>
                <a href="/delete_note/{{ note.title }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/search_note">Search Notes</a>
</body>
</html>
