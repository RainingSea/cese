<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <p>Welcome, {{ session['username'] }}!</p>
    <a href="/add_note">Add Note</a>
    <a href="/logout">Logout</a>
    <h2>Your Notes</h2>
    <ul>
        {% for note in notes %}
            <li><a href="/view_note/{{ note.title }}">{{ note.title }}</a> | <a href="/edit_note/{{ note.title }}">Edit</a></li>
        {% endfor %}
    </ul>
</body>
</html>
