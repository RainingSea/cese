<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <form method="POST" action="/dashboard">
        <input type="text" name="diagnosis" placeholder="Add Diagnosis">
        <button type="submit" name="add_diagnosis">Add Diagnosis</button>
    </form>
    <form method="POST" action="/dashboard">
        <input type="text" name="medication" placeholder="Add Medication">
        <button type="submit" name="add_medication">Add Medication</button>
    </form>
    <form method="POST" action="/dashboard">
        <input type="text" name="treatment" placeholder="Add Treatment">
        <button type="submit" name="add_treatment">Add Treatment</button>
    </form>
    <a href="/">Logout</a>
</body>
</html>
