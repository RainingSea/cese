<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Status</title>
</head>
<body>
    <h1>Your Feedback Status</h1>
    <ul>
        {% for feedback in feedback_status %}
            <li>{{ feedback.content }} - Status: {{ feedback.status }}</li>
        {% endfor %}
    </ul>
    <a href="/feedback">Submit More Feedback</a>
    <a href="/logout">Logout</a>
</body>
</html>
