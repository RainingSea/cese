<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Status</title>
</head>
<body>
    <h1>Feedback Status</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Feedback</th>
            <th>Category</th>
            <th>Status</th>
        </tr>
        {% for feedback in feedbacks %}
        <tr>
            <td>{{ feedback.id }}</td>
            <td>{{ feedback.username }}</td>
            <td>{{ feedback.feedback }}</td>
            <td>{{ feedback.category }}</td>
            <td>{{ feedback.status }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/feedback">Submit More Feedback</a>
</body>
</html>
