<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h2>Your Feedback</h2>
    <ul>
        {% for feedback in feedbacks %}
            <li>{{ feedback.content }} - {{ feedback.category }} (Status: {{ feedback.status }})</li>
        {% endfor %}
    </ul>
    <a href="/feedback">Submit Feedback</a>
    <a href="/">Logout</a>
</body>
</html>
