<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Status</title>
</head>
<body>
    <h1>Your Feedback Status</h1>
    <ul>
        {% for feedback in feedbacks %}
            <li>{{ feedback.category }}: {{ feedback.content }} (Status: {{ feedback.status }})</li>
        {% endfor %}
    </ul>
</body>
</html>
