<!DOCTYPE html>
<html>
<head>
    <title>Feedback Status</title>
</head>
<body>
    <h2>Your Feedback Status</h2>
    <table>
        <tr>
            <th>User</th>
            <th>Content</th>
            <th>Category</th>
            <th>Status</th>
        </tr>
        {% for feedback in feedback_status %}
        <tr>
            <td>{{ feedback[0] }}</td>
            <td>{{ feedback[1] }}</td>
            <td>{{ feedback[2] }}</td>
            <td>{{ feedback[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
