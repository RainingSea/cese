<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Welcome to your Dashboard</h2>
    <a href="/logout">Logout</a>
    <h3>Your Journal Entries</h3>
    <ul>
        {% for entry in entries %}
            <li>{{ entry.title }} - {{ entry.date }}<br>{{ entry.content }}</li>
        {% endfor %}
    </ul>
    <a href="/new_entry">Create New Entry</a>
</body>
</html>
