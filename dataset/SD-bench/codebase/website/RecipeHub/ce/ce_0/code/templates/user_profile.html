<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>
    <h1>User Profile: {{ username }}</h1>
    <h2>Your Recipes</h2>
    <ul>
        {% for recipe in recipes %}
            <li><a href="/recipe/{{ recipe.title }}">{{ recipe.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/home">Home</a>
</body>
</html>
