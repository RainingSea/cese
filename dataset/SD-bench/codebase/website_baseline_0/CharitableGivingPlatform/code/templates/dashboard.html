<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Available Charities</h1>
    <ul>
        {% for charity in charities %}
            <li><a href="{{ url_for('charity_details', charity_name=charity.name) }}">{{ charity.name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
