<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Articles</title>
</head>
<body>
    <div class="container">
        <h1>Articles</h1>
        <ul>
            {% for article in articles %}
                <li>
                    <strong>{{ article.title }}</strong>: {{ article.summary }}
                    <form action="/share_article" method="post" style="display:inline;">
                        <input type="hidden" name="article_title" value="{{ article.title }}">
                        <input type="submit" value="Share" class="btn btn-link">
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
