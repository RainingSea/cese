<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
</head>
<body>
    <h1>Forum Threads</h1>
    <ul>
        {% for thread in threads %}
            <li><a href="{{ url_for('view_thread', thread_id=loop.index0) }}">{{ thread.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="/create_thread">Create New Thread</a>
    <a href="/home">Home</a>
</body>
</html>
