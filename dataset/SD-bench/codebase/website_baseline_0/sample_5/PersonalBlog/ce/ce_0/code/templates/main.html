<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Blog</title>
</head>
<body>
    <h1>Welcome to the Blog</h1>
    <a href="/new_post">Create New Post</a>
    <a href="/logout">Logout</a>
    <h2>Your Posts</h2>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ loop.index0 }}">{{ post.title }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
