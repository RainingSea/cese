<!DOCTYPE html>
<html>
<head>
    <title>Main Blog Page</title>
</head>
<body>
    <h2>Blog Posts</h2>
    <a href="/new_post">Create New Post</a>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ post.title }}">{{ post.title }}</a>
                <a href="/edit_post/{{ post.title }}">Edit</a>
                <a href="/delete_post/{{ post.title }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
