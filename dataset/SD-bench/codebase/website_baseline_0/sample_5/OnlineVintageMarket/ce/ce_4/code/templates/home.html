<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h2>Available Vintage Items</h2>
    <form method="post">
        <input type="text" name="search" placeholder="Search items">
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for item in items %}
            <li>
                <a href="{{ url_for('item_details', item_id=loop.index0) }}">{{ item.name }}</a>
            </li>
        {% endfor %}
    </ul>
    <p><a href="/listing">List a new item</a></p>
</body>
</html>
