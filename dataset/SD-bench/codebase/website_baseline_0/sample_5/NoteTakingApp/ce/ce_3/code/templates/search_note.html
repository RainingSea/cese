<!DOCTYPE html>
<html>
<head>
    <title>Search Notes</title>
</head>
<body>
    <h2>Search Notes</h2>
    <form method="POST">
        Search: <input type="text" name="search_term" required><br>
        <input type="submit" value="Search">
    </form>
    <h3>Search Results</h3>
    <ul>
        {% for note in notes %}
            <li>{{ note.title }}: {{ note.content }}</li>
        {% endfor %}
    </ul>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
