<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>
</head>
<body>
    <h1>Edit Note</h1>
    <form method="POST" action="/view_note/{{ note[0] }}">
        <textarea name="content" required>{{ note[1] }}</textarea>
        <button type="submit">Save Changes</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
