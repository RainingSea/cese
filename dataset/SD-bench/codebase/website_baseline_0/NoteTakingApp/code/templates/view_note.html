<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Note</title>
</head>
<body>
    <h1>Edit Note</h1>
    <form method="POST" action="/view_note/{{ note.title }}">
        <label for="new_title">Title:</label>
        <input type="text" name="new_title" value="{{ note.title }}" required>
        <label for="new_content">Content:</label>
        <textarea name="new_content" required>{{ note.content }}</textarea>
        <button type="submit">Update Note</button>
    </form>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
