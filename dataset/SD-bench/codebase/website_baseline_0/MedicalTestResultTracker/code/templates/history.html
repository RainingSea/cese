<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Test Results History</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Test Name</th>
                    <th>Result</th>
                    <th>Date</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                {% for result in results %}
                <tr>
                    <td>{{ result.test_name }}</td>
                    <td>{{ result.result }}</td>
                    <td>{{ result.date }}</td>
                    <td><a href="{{ url_for('test_result_details', index=loop.index0) }}" class="btn btn-info">View Details</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</body>
</html>
