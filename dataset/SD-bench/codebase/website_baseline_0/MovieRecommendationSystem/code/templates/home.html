<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Movie Recommendations</h1>
    <ul>
        {% for movie in recommendations %}
            <li>
                <a href="{{ url_for('movie_details', title=movie) }}">{{ movie }}</a>
                <a href="{{ url_for('add_favorite', title=movie) }}">Add to Favorites</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/favorites">View Favorites</a>
</body>
</html>
