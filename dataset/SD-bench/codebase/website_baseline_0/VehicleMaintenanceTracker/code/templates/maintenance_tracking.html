<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Maintenance Tracking</title>
</head>
<body>
    <div class="container">
        <h2>Maintenance Tracking</h2>
        <form method="POST" action="/maintenance_tracking">
            <div class="form-group">
                <label for="vehicle_id">Vehicle ID:</label>
                <input type="number" class="form-control" id="vehicle_id" name="vehicle_id" required>
            </div>
            <div class="form-group">
                <label for="task">Task:</label>
                <input type="text" class="form-control" id="task" name="task" required>
            </div>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Maintenance Record</button>
        </form>
        <h3>Maintenance Records</h3>
        <ul>
            {% for record in records %}
                <li>{{ record.vehicle_id }} - {{ record.task }} on {{ record.date }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
