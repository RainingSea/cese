<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Review</title>
</head>
<body>
    <h1>Feedback Review</h1>
    <ul>
        {% for feedback in feedback_list %}
            <li>
                <strong>{{ feedback.username }}</strong>: {{ feedback.feedback_text }} ({{ feedback.category }}) - Status: {{ feedback.status }}
            </li>
        {% endfor %}
    </ul>
    <a href="/submit_feedback">Submit More Feedback</a>
    <a href="/logout">Logout</a>
</body>
</html>
