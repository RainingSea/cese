<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Blog</title>
</head>
<body>
    <h1>Blog Posts</h1>
    <a href="/new_post">New Post</a>
    <ul>
        {% for post in posts %}
            <li>
                <a href="/view_post/{{ post.title }}">{{ post.title }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
