<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Profiles</title>
</head>
<body>
    <h1>Freelancer Profiles</h1>
    <form method="POST" action="/freelancer_profile">
        <label for="search_query">Search Freelancers:</label>
        <input type="text" id="search_query" name="search_query">
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for freelancer in freelancers %}
            <li><a href="{{ url_for('freelancer_detail', name=freelancer.name) }}">{{ freelancer.name }}</a>: {{ freelancer.details }}</li>
        {% endfor %}
    </ul>
    <a href="/project_management">Manage Projects</a>
</body>
</html>
