<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Book Dashboard</h2>
        <form method="POST">
            <input type="text" name="search" placeholder="Search for books" required>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <ul>
            {% for book in books %}
                <li>
                    <a href="{{ url_for('book_details', book_id=loop.index0) }}">{{ book.title }}</a> by {{ book.author }}
                    <form method="POST" action="/reading_list" style="display:inline;">
                        <input type="hidden" name="book_id" value="{{ loop.index0 }}">
                        <button type="submit" class="btn btn-success btn-sm">Add to Reading List</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
