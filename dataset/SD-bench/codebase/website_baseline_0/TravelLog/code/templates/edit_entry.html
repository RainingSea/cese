<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Edit Journal Entry</h2>
        <form method="POST" action="/edit_entry/{{ entry.destination }}/{{ entry.dates }}">
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" class="form-control" id="destination" name="destination" value="{{ entry.destination }}" required>
            </div>
            <div class="form-group">
                <label for="dates">Dates:</label>
                <input type="text" class="form-control" id="dates" name="dates" value="{{ entry.dates }}" required>
            </div>
            <div class="form-group">
                <label for="activities">Activities:</label>
                <textarea class="form-control" id="activities" name="activities" required>{{ entry.activities }}</textarea>
            </div>
            <div class="form-group">
                <label for="photos">Photos (comma-separated):</label>
                <input type="text" class="form-control" id="photos" name="photos" value="{{ entry.photos }}">
            </div>
            <div class="form-group">
                <label for="reflections">Reflections:</label>
                <textarea class="form-control" id="reflections" name="reflections" required>{{ entry.reflections }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Entry</button>
        </form>
    </div>
</body>
</html>
