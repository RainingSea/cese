<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Entries</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Journal Entries</h2>
        <ul class="list-group">
            {% for entry in entries %}
                <li class="list-group-item">
                    <h5>{{ entry.destination }}</h5>
                    <p><strong>Dates:</strong> {{ entry.dates }}</p>
                    <p><strong>Activities:</strong> {{ entry.activities }}</p>
                    <p><strong>Photos:</strong> {{ entry.photos }}</p>
                    <p><strong>Reflections:</strong> {{ entry.reflections }}</p>
                    <form method="POST" action="/delete_entry/{{ entry.destination }}/{{ entry.dates }}">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        <a href="/edit_entry/{{ entry.destination }}/{{ entry.dates }}" class="btn btn-warning btn-sm">Edit</a>
                        <form method="POST" action="/share_entry/{{ entry.destination }}/{{ entry.dates }}">
                            <button type="submit" class="btn btn-info btn-sm">Share</button>
                        </form>
                    </form>
                </li>
            {% endfor %}
        </ul>
        <a href="/journal" class="btn btn-link">Add New Entry</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
