<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Entries</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>Search Journal Entries</h2>
        <form method="POST" action="/search_entries">
            <div class="form-group">
                <label for="search_term">Search:</label>
                <input type="text" class="form-control" id="search_term" name="search_term" required>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <ul class="list-group mt-3">
            {% for entry in entries %}
                <li class="list-group-item">
                    <h5>{{ entry.destination }}</h5>
                    <p><strong>Dates:</strong> {{ entry.dates }}</p>
                    <p><strong>Activities:</strong> {{ entry.activities }}</p>
                    <p><strong>Photos:</strong> {{ entry.photos }}</p>
                    <p><strong>Reflections:</strong> {{ entry.reflections }}</p>
                </li>
            {% endfor %}
        </ul>
        <a href="/view_entries" class="btn btn-link">Back to Entries</a>
    </div>
</body>
</html>
