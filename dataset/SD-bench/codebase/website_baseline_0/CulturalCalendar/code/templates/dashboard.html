<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Upcoming Events</h2>
        <ul class="list-group">
            {% for event in events %}
                <li class="list-group-item">
                    <a href="{{ url_for('event_details', event_id=event.id) }}">{{ event.name }}</a>
                    <form method="POST" action="{{ url_for('set_reminder', event_id=event.id) }}" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-warning">Set Reminder</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
