<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Preferences</title>
</head>
<body>
    <div class="container">
        <h2>Travel Preferences</h2>
        <form method="POST">
            <div class="form-group">
                <label for="budget">Budget:</label>
                <input type="number" class="form-control" id="budget" name="budget" required>
            </div>
            <div class="form-group">
                <label for="activities">Activities:</label>
                <select multiple class="form-control" id="activities" name="activities">
                    <option value="beach">Beach</option>
                    <option value="hiking">Hiking</option>
                    <option value="cultural">Cultural</option>
                </select>
            </div>
            <div class="form-group">
                <label for="climate">Preferred Climate:</label>
                <input type="text" class="form-control" id="climate" name="climate" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Preferences</button>
        </form>
    </div>
</body>
</html>
