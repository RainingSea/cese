<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Recommendations</title>
</head>
<body>
    <div class="container">
        <h2>Recommended Destinations</h2>
        <ul class="list-group">
            {% for destination in destinations %}
                <li class="list-group-item">
                    <h5><a href="{{ url_for('destination_detail', name=destination.name) }}">{{ destination.name }}</a></h5>
                    <p>Activities: {{ destination.activities | join(', ') }}</p>
                    <p>Climate: {{ destination.climate }}</p>
                    <p>Cost: ${{ destination.cost }}</p>
                    <form method="POST">
                        <input type="hidden" name="destination" value="{{ destination.name }}">
                        <button type="submit" class="btn btn-secondary">Save</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
