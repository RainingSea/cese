<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>
<body>
    <h1>User Profile</h1>
    <p>Username: {{ user_info.username }}</p>
    <p>Email: {{ user_info.email }}</p>
    <h2>Applied Jobs</h2>
    <ul>
        {% for job in user_info.applied_jobs %}
            <li>{{ job }}</li>
        {% endfor %}
    </ul>
    <a href="/home">Back to Home</a>
</body>
</html>
