<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Story</title>
</head>
<body>
    <h1>Edit Story</h1>
    <form action="/edit_story" method="post">
        <label for="title">Current Story Title:</label>
        <input type="text" id="title" name="title" required>
        <br>
        <label for="new_title">New Story Title:</label>
        <input type="text" id="new_title" name="new_title" required>
        <br>
        <label for="new_content">New Story Content:</label>
        <textarea id="new_content" name="new_content" required></textarea>
        <br>
        <button type="submit">Update Story</button>
    </form>
</body>
</html>
