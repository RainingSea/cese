<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Wishlist Dashboard</h2>
        <form action="/dashboard" method="post">
            <div class="form-group">
                <label for="item_name">Item Name:</label>
                <input type="text" class="form-control" id="item_name" name="item_name" required>
            </div>
            <div class="form-group">
                <label for="item_description">Description:</label>
                <input type="text" class="form-control" id="item_description" name="item_description" required>
            </div>
            <div class="form-group">
                <label for="item_price">Desired Price:</label>
                <input type="number" class="form-control" id="item_price" name="item_price" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Item</button>
        </form>
        <h3>Your Wishlist Items:</h3>
        <ul>
            {% for item in items %}
                <li>{{ item.name }} - {{ item.description }} - ${{ item.price }}
                    <form action="/remove_item/{{ item.name }}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                    </form>
                    <form action="/update_item/{{ item.name }}" method="post" style="display:inline;">
                        <input type="text" name="item_description" placeholder="New Description" required>
                        <input type="number" name="item_price" step="0.01" placeholder="New Price" required>
                        <button type="submit" class="btn btn-warning btn-sm">Update</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
        <a href="/logout" class="btn btn-secondary">Logout</a>
    </div>
</body>
</html>
