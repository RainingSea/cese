<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Albums</title>
</head>
<body>
    <h1>Explore Shared Albums</h1>
    <ul>
        {% for album in albums %}
            <li>{{ album.title }} - {{ album.is_public }}</li>
        {% endfor %}
    </ul>
    <a href="/album">Back to Your Albums</a>
</body>
</html>
