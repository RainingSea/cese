<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Groups</title>
</head>
<body>
    <h1>Study Groups</h1>
    <ul>
        {% for group in groups %}
            <li>{{ group.group_name }} - Members: {{ group.members | join(', ') }}</li>
        {% endfor %}
    </ul>
</body>
</html>
