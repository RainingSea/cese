<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Suggestions</title>
</head>
<body>
    <h1>Transportation Suggestions</h1>
    <ul>
        {% for suggestion in suggestions %}

        {% endfor %}
    </ul>
    <a href="/trip_input">Back</a>
</body>
</html>
