<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>Available Vintage Items</h1>
    <form method="GET" action="/search">
        <input type="text" name="query" placeholder="Search items..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for item in items %}
            <li><a href="{{ url_for('item_details', item_id=item.item_id) }}">{{ item.name }}</a> - ${{ item.price }}</li>
        {% endfor %}
    </ul>
    <a href="/listing">List a New Item</a>
</body>
</html>
