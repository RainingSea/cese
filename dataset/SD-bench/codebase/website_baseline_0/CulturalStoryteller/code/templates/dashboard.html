<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <h2>Stories</h2>
        <form method="POST">
            <ul class="list-group">
                {% for story in stories %}
                <li class="list-group-item">
                    <a href="{{ url_for('story_details', story_id=story.id) }}">{{ story.title }}</a>
                    <input type="checkbox" name="bookmarks" value="{{ story.id }}">
                </li>
                {% endfor %}
            </ul>
            <button type="submit" class="btn btn-primary">Save Bookmarks</button>
        </form>
        <form method="POST" action="/search">
            <div class="form-group">
                <label for="query">Search Stories:</label>
                <input type="text" class="form-control" id="query" name="query" required>
            </div>
            <button type="submit" class="btn btn-secondary">Search</button>
        </form>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</body>
</html>
